<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>PE Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-column game console. Status strip, then the current phase, portfolio and hand, then the deal log. Plain on purpose: v1 tests mechanics, not looks. */
:root{
  --bg:#eef0ec; --panel:#fbfcfa; --ink:#18201b; --muted:#5b675f; --line:#d3d9d3;
  --accent:#1d6b47; --accent-ink:#ffffff; --good:#1d7a3e; --warn:#8f5b00; --bad:#b42318;
  --chip:#e3e8e3; --sel:#d3eadc; --scrim:rgb(10 16 12 / .55);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1411; --panel:#171e1a; --ink:#e3eae5; --muted:#95a299; --line:#2b362f;
  --accent:#4fbf86; --accent-ink:#0b130e; --good:#62d394; --warn:#e3a94a; --bad:#ff7d6e;
  --chip:#222c26; --sel:#1d3a2a; --scrim:rgb(0 0 0 / .65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1411; --panel:#171e1a; --ink:#e3eae5; --muted:#95a299; --line:#2b362f;
  --accent:#4fbf86; --accent-ink:#0b130e; --good:#62d394; --warn:#e3a94a; --bad:#ff7d6e;
  --chip:#222c26; --sel:#1d3a2a; --scrim:rgb(0 0 0 / .65); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
#app{max-width:980px;margin:0 auto;padding-block:12px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;text-wrap:balance} h1{font-size:24px} h2{font-size:17px} h3{font-size:14px}
p{margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)} .small{font-size:12px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.btn{font:inherit;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;text-align:left}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn .sub{display:block;font-size:12px;opacity:.8;font-weight:400}
.btn.illegal{border-color:var(--bad)} .btn.gray{border-color:var(--warn)}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid currentColor;white-space:nowrap;align-self:flex-start}
.tag.illegal{color:var(--bad)} .tag.gray{color:var(--warn)} .tag.legal{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px 10px}
.stat{display:flex;flex-direction:column;min-width:0;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit}
button.stat{cursor:pointer;border-radius:4px} button.stat:hover .k{color:var(--accent)}
.stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-variant-numeric:tabular-nums;font-weight:600;font-family:var(--mono);font-size:13px}
.stat .x{font-size:11px;color:var(--muted)}
.term{font-size:9px;opacity:.65;text-transform:none;letter-spacing:0;margin-left:4px;font-family:var(--mono)}
.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.co{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.co.target{border-color:var(--accent)}
.co-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--chip);white-space:nowrap}
.pill.Failing,.pill.Danger{color:var(--bad)} .pill.Thriving,.pill.Safe{color:var(--good)} .pill.Risky{color:var(--warn)}
.traits{display:flex;flex-direction:column;gap:2px;font-size:12px;margin:0;padding:0;list-style:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cardb{display:flex;flex-direction:column;gap:4px;min-height:110px}
.cardb.selected{border-color:var(--accent);background:var(--sel)}
.cardb .top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.cardb .cost{font-family:var(--mono);font-weight:700;white-space:nowrap}
.cardb .desc{font-size:12px;opacity:.85}
.preview{background:var(--sel);border-radius:6px;padding:8px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.preview b{font-family:var(--mono)}
.map{display:grid;grid-template-columns:64px repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.map .yr{font-size:11px;color:var(--muted);align-self:center;line-height:1.2}
.map .node{text-align:center;padding:10px 4px}
.map .node.here{background:var(--sel);border-color:var(--accent)}
.map .boss{grid-column:2 / span 3;text-align:center;font-weight:600}
.log{font-size:12px;display:flex;flex-direction:column;gap:3px;max-height:260px;overflow:auto}
.log .y{font-family:var(--mono);color:var(--muted);margin-right:6px}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.heat>i,.bar.doubt>i,.bar.rival>i{background:var(--bad)}
.bar .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);left:50%}
#modal{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal[hidden]{display:none!important}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:540px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
#modal .choices{display:flex;flex-direction:column;gap:8px}
input[type=text]{font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;max-width:320px}
input[type=range]{width:100%}
table{border-collapse:collapse;font-size:12px;width:100%} td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left} td.n,th.n{font-family:var(--mono);text-align:right}
tr.on td{font-weight:700}
.tablewrap{overflow-x:auto}
.paper{border:2px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:6px}
.paper h2{font-family:Georgia,"Times New Roman",serif;font-size:22px;text-align:center;border-bottom:1px solid var(--ink);padding-bottom:6px}
.paper li{font-family:Georgia,"Times New Roman",serif}
.boss-q{font-size:16px;font-style:italic}
details summary{cursor:pointer}
footer{font-size:11px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" hidden></div>

<script>
'use strict';
const VERSION = '1.1';
const SAVE_KEY = 'pe_tycoon_save_v11';
const HALL_KEY = 'pe_tycoon_hall';

/* ---------- state ---------- */
let S = null;          // game state (serializable)
let Q = [];            // modal queue (transient)
let pending = null;    // continuation to run once the modal queue empties
let sel = null;        // selected hand index
let PREVIEW = false;   // true while simulating a card for its preview
let titleFounder = 'banker';

/* ---------- rng & helpers ---------- */
function rand(){if(PREVIEW)return 0.5;S.rs=(S.rs+0x6D2B79F5)|0;let t=S.rs;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
const rf=(a,b)=>a+(b-a)*rand();
const ri=(a,b)=>Math.floor(rf(a,b+1));
const pick=a=>a[Math.floor(rand()*a.length)];
const chance=p=>rand()<p;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function wpick(o){let t=0;for(const k in o)t+=o[k];let r=rand()*t;for(const k in o){r-=o[k];if(r<0)return k;}return Object.keys(o)[0];}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function fm(x){const n=Math.abs(x),s=x<0?'−':'';if(n>=1000)return s+'$'+(n/1000).toFixed(2)+'B';if(n>=100)return s+'$'+n.toFixed(0)+'M';return s+'$'+n.toFixed(1)+'M';}
const pct=x=>(x>=0?'+':'−')+Math.abs(x*100).toFixed(1)+'%';
const sc=()=>S.fund.size/50;
const calYear=()=>2026+(S.fund.n-1)*7+S.year;
const FUNDNAMES=['Fund I','Fund II','Fund III'];
const T=(label,real)=>`${label}<span class="term">${real}</span>`;

/* ---------- data ---------- */
const SECTORS={
  'Dental':{mult:9,suf:['Dental Partners','Smile Group','Family Dentistry']},
  'Laundromats':{mult:5,suf:['Suds Co.','Wash & Fold','Laundry Centers']},
  'HVAC':{mult:7,suf:['Heating & Air','Comfort Systems','Climate Services']},
  'Software':{mult:12,suf:['Logic','Cloudworks','Data Systems']},
  'Restaurants':{mult:6,suf:['Diner Group','Burger Co.','Pizza Kitchens']},
  'Trucking':{mult:5,suf:['Freight','Haulers','Logistics']},
  'Pet Care':{mult:10,suf:['Pet Resorts','Animal Hospitals','Grooming Co.']},
  'Manufacturing':{mult:6,suf:['Fasteners','Tool & Die','Plastics']}
};
const PREFIX=['Midwest','Summit','Blue Ridge','Lakeside','Ironwood','Sunbelt','Pioneer','Harbor','Copperline','Prairie','Northstar','Bayou','Redwood','Keystone','Cedar Valley','Gulf Coast','Twin Rivers','Old Mill','High Plains','Silver Creek','Granite','Bluewater','Foxhollow','Tri-County'];

const TRAITS={
  cooked:{n:'Cooked Books',bad:true,d:'Reported profit is about 25% inflated.'},
  lawsuit:{n:'Pending Lawsuit',bad:true,d:'A settlement of about 1.5× yearly profit lands in year 2.'},
  keyperson:{n:'Key-Person Risk',bad:true,d:'The founder runs everything. Replacing the CEO backfires, and they may quit.'},
  concentration:{n:'Customer Concentration',bad:true,d:'One customer is a quarter of sales and may leave.'},
  union:{n:'Union Trouble',bad:true,d:'Cost cuts and layoffs trigger strikes.'},
  maintenance:{n:'Deferred Maintenance',bad:true,d:'About 1× yearly profit of surprise repairs in year 1.'},
  realestate:{n:'Hidden Real Estate',bad:false,d:'Owns valuable property. Breakups and sale-leasebacks pay more.'},
  pricing:{n:'Pricing Power',bad:false,d:'Customers tolerate price hikes. Raise Prices is doubled.'},
  patent:{n:'Unused Patent',bad:false,d:'May license for a cash windfall.'},
  loyal:{n:'Loyal Customers',bad:false,d:'Grows about 2% faster than the numbers show.'},
  bloated:{n:'Bloated Costs',bad:false,d:'Fat to trim. Cut Costs is doubled.'},
  founder:{n:'Motivated Seller',bad:false,d:'The founder wants out. Price drops 12% once you know.'}
};

const RIVALS=[
  {name:'Kestrel Partners',bias:0.12,loves:null},
  {name:'Monolith Capital',bias:0,loves:'Manufacturing'},
  {name:'Vantablack Growth',bias:0.04,loves:'Software'}
];

const FOUNDERS={
  banker:{n:'Ex-Investment Banker',lev:5,bw:3,op:0.8,rate:-0.005,conn:'insider',
    deck:['cut','cut','raise','recap','refi','paydown','consult','network','slb'],
    d:'Banks lend you up to 5× a company’s yearly profit, at 0.5% less interest. Starts with the Auction Insider. Operational cards are 20% weaker. 3 actions a year.'},
  operator:{n:'Former Operator',lev:3.5,bw:4,op:1.25,rate:0,conn:'guru',
    deck:['cut','cut','raise','raise','ceo','overhaul','consult','network','pivot'],
    d:'Operational cards are 25% stronger and you get 4 actions a year. Starts with the Turnaround Guru. Banks lend at most 3.5× yearly profit.'}
};

const CONNS={
  banker:{n:'Friendly Banker',d:'Banks lend 1× yearly profit more on every deal.'},
  golf:{n:"Senator's Golf Buddy",d:'The first investigation each fund is quietly dropped.'},
  mckinsey:{n:'Ex-Consultant Associate',d:'Your first Cut Costs each year costs 0 actions.'},
  whisper:{n:'Pension Fund Whisperer',d:'Fundraising targets are 15% lower.'},
  barbarians:{n:'Dog-Eared "Barbarians at the Gate"',d:'Each diligence round reveals 2 traits.'},
  prfirm:{n:'PR Firm on Retainer',d:'The first reporter each fund is handled for free.'},
  cayman:{n:'Cayman Lawyer',d:'Your bonus +25%. Heat +3 every year.'},
  insider:{n:'Auction Insider',d:"See roughly where the top rival will walk away in auctions and takeover fights."},
  guru:{n:'Turnaround Guru',d:'Shrinking companies you buy get +4% growth.'},
  rolodex:{n:'Rolodex of CFOs',d:'Draw 1 extra card each year.'},
  dog:{n:'Office Dog',d:'Reputation +1 every year.'},
  vulture:{n:'Distressed Debt Desk',d:'Distressed deals are 10% cheaper.'},
  shredder:{n:'Shredder Pro 3000',d:'Evidence goes cold 2 years sooner.'},
  hype:{n:'Hype Machine',d:'Strategic sales in the hot sector pay 10% more.'},
  club:{n:'Club Membership',d:'Conference prices −20% and one extra card on offer.'},
  second:{n:'Second Chair',d:'+1 action every year.'}
};

const LAWS={
  loophole:{n:'Carried Interest Loophole',d:'Your bonus is taxed like a capital gain. Bonus ×1.5.'},
  interest:{n:'Interest Deduction Expansion',d:'Interest costs −30% at every company.'},
  antitrust:{n:'Antitrust Relaxation',d:'Antitrust reviews clear automatically. Platform premium doubles.'}
};

const OFF_NAMES=['Dale Pruitt','Anne Holloway','Wade Kimball','Rita Vasquez','Hugh Barnaby','Lorraine Cobb','Gus Feeney','Priya Natarajan','Bo Whitlock','Marjorie Tull','Felix Ortega','Constance Reed'];
const OFF_TRAITS={
  greedy:{n:'Greedy',d:'Takes the money and delivers.'},
  unreliable:{n:'Unreliable',d:'Takes the money. Delivers nothing.'},
  bought:{n:'Already Bought',d:'Works for a rival firm.'},
  honest:{n:'Honest',d:'Will report you.'},
  sting:{n:'Wired',d:'Cooperating with prosecutors.'},
  escalator:{n:'Escalator',d:'Delivers, then keeps asking for more.'}
};

/* ---------- small state helpers ---------- */
const hasConn=k=>S.conns.includes(k);
const has=(c,k)=>c.traits.some(t=>t.k===k);
function trig(c,k){const t=c.traits.find(t=>t.k===k);if(t)t.rev=true;return !!t;}
function dropTrait(c,k){c.traits=c.traits.filter(t=>t.k!==k);}
const OPM=()=>FOUNDERS[S.founder].op;
function rep(d){S.rep=clamp(S.rep+d,0,100);}
function heat(d){S.heat=clamp(S.heat+d,0,100);}
function log(msg,cls){S.log.unshift({y:`${FUNDNAMES[S.fund.n-1]} Y${S.year}`,msg,cls:cls||''});if(S.log.length>80)S.log.length=80;}
function news(s){S.news.unshift(`${calYear()}: ${s}`);}
const co=id=>S.companies.find(c=>c.id===id);
const bribeCost=()=>0.8*sc();
function levCap(){return FOUNDERS[S.founder].lev+(hasConn('banker')?1:0);}
function avgLoad(){const cs=S.companies.filter(c=>c.ebitda>0);if(!cs.length)return 0;return cs.reduce((s,c)=>s+c.debt,0)/cs.reduce((s,c)=>s+c.ebitda,0);}

/* ---------- reputation, heat, economy ---------- */
const REP_TIERS=[
  {min:85,n:'Legendary',price:-0.10,d:'Sellers give you 10% off and offer you private deals.'},
  {min:65,n:'Respected',price:-0.05,d:'Sellers give you 5% off and offer you private deals.'},
  {min:45,n:'Known',price:0,d:'No special treatment.'},
  {min:25,n:'Shady',price:0.05,d:'Sellers charge you 5% more.'},
  {min:0,n:'Toxic',price:0.10,d:'Sellers charge you 10% more and auction houses won’t let you in.'}
];
const repTier=()=>REP_TIERS.find(t=>S.rep>=t.min);
const HEAT_TIERS=[
  {min:90,n:'Raid',d:'At year end the authorities raid your office: fund cash frozen for a year, every piece of evidence rolls at 50%.'},
  {min:60,n:'Under watch',d:'Evidence surfaces 1.5× as often. Every crime has a 20% chance of getting caught on the spot.'},
  {min:30,n:'Reporters circling',d:'Evidence surfaces more often.'},
  {min:0,n:'Quiet',d:'Nobody is looking.'}
];
const heatTier=()=>HEAT_TIERS.find(t=>S.heat>=t.min);
const SEV={1:{n:'minor',p:0.04,life:3},2:{n:'serious',p:0.07,life:5},3:{n:'severe',p:0.11,life:8}};
function evLife(e){return Math.max(1,SEV[e.sev].life-(hasConn('shredder')?2:0));}
function evChance(e){return Math.min(0.95,(SEV[e.sev].p+S.heat/200)*(S.heat>=60?1.5:1));}
function addEvidence(crime,sev){
  if(PREVIEW){S.evidence.push({id:0,crime,sev:sev||2,age:0});return;}
  sev=sev||2;
  if(S.heat>=60&&chance(0.2)){log(`Caught in the act: ${crime}.`,'bad');openCase(crime,sev>=3?2:1);return;}
  S.evidence.push({id:S.uid++,crime,sev,age:0});
}
function moodOf(m){
  if(m<0.85)return {n:'Cold',cls:'bad'};if(m<0.95)return {n:'Cool',cls:'warn'};if(m<1.05)return {n:'Normal',cls:''};if(m<1.15)return {n:'Warm',cls:'good'};return {n:'Hot',cls:'good'};
}
function genEconomy(){
  const ph=rf(0,6.28);S.mktPlan=[];S.ratePlan=[];
  for(let y=0;y<9;y++){const m=clamp(1+0.2*Math.sin(ph+y*0.95)+rf(-0.04,0.04),0.72,1.28);S.mktPlan.push(m);S.ratePlan.push(clamp(0.075-0.08*(m-1)+rf(-0.004,0.004),0.03,0.13));}
  S.mktShift=0;S.rateShift=0;applyEconomy();
}
function applyEconomy(){S.mkt=clamp(S.mktPlan[S.year-1]+S.mktShift,0.5,1.5);S.rate=clamp(S.ratePlan[S.year-1]+S.rateShift,0.02,0.16);}
function forecast(dy){const y=S.year-1+dy;if(y>8)return null;const f=Math.pow(0.5,dy);return {m:clamp(S.mktPlan[y]+S.mktShift*f,0.5,1.5),r:clamp(S.ratePlan[y]+S.rateShift*f,0.02,0.16)};}
function loadPremium(l){return l<=2?-0.01:l<=3?0:l<=4?0.01:l<=5?0.025:l<=6?0.04:0.06;}

/* ---------- valuation ---------- */
function health(c){return c.growth<0?'Failing':c.growth>=0.08?'Thriving':'Steady';}
function mult(c){
  let m=SECTORS[c.sector].mult*S.mkt;
  if(c.sector===S.hot)m*=1.25; if(c.sector===S.cold)m*=0.8;
  const h=health(c); if(h==='Failing')m*=0.65; else if(h==='Thriving')m*=1.2;
  m+=1.5*Math.log10(Math.max(c.ebitda,0.5));
  m+=c.multBonus;
  if(c.platform>=2)m+=S.laws.antitrust?2:1;
  return Math.max(2,m);
}
function value(c){return Math.max(0,c.ebitda)*mult(c)*(1+(c.inflated||0));}
function equity(c){return Math.max(0,value(c)-c.debt);}
function nav(){return S.companies.reduce((s,c)=>s+equity(c),0);}
function fundMoic(){const f=S.fund;return (f.cash+f.dist+nav())/f.size;}
function largest(){return S.companies.slice().sort((a,b)=>value(b)-value(a))[0]||null;}
function compRate(c,debt){const d=debt===undefined?c.debt:debt;const l=c.ebitda>0?d/c.ebitda:99;return Math.max(0.02,S.rate+loadPremium(l)+c.rateAdj+FOUNDERS[S.founder].rate)*(S.laws.interest?0.7:1);}
// chance the bank takes this company next year (debt above 7x profit), by quick simulation
function riskOf(c,debt){
  const d0=debt===undefined?c.debt:debt;if(d0<=0||c.ebitda<=0)return d0>0?1:0;
  const rate=compRate(c,d0),known=k=>c.traits.some(t=>t.rev&&t.k===k);let hits=0;const N=240;
  for(let i=0;i<N;i++){
    let e=c.ebitda*(1+c.growth+(Math.random()*0.06-0.03)*(c.growth<0?1.6:1));
    if(Math.random()<0.12)e*=0.85;
    if(known('concentration')&&Math.random()<0.18)e*=0.75;
    let d=d0;const fcf=e*0.65-d*rate;d-=fcf>0?Math.min(d,fcf):fcf;
    if(known('maintenance')&&c.yearsOwned===0)d+=e;
    if(known('lawsuit')&&c.yearsOwned===1)d+=1.5*e;
    if(d/e>7)hits++;
  }
  return hits/N;
}
function riskLabel(p){return p<0.05?{n:'Safe',cls:'Safe'}:p<0.25?{n:'Risky',cls:'Risky'}:{n:'Danger',cls:'Danger'};}

/* ---------- companies ---------- */
function genName(sector){
  for(let i=0;i<30;i++){const n=`${pick(PREFIX)} ${pick(SECTORS[sector].suf)}`;if(!S.usedNames.includes(n)){S.usedNames.push(n);return n;}}
  return `${pick(PREFIX)} ${sector} #${S.uid}`;
}
function genCompany(h,extraBad){
  const sector=pick(Object.keys(SECTORS));
  const g={Failing:[-0.12,-0.03],Steady:[0.01,0.06],Thriving:[0.08,0.16]}[h];
  const e={Failing:[0.012,0.04],Steady:[0.02,0.06],Thriving:[0.02,0.05]}[h];
  const c={id:S.uid++,name:genName(sector),sector,ebitda:S.fund.size*rf(e[0],e[1]),growth:rf(g[0],g[1]),
    multBonus:0,debt:0,rateAdj:0,platform:0,traits:[],assetKnown:false,owned:false,yearsOwned:0,cost:0,
    strategic:false,inflated:0,slb:false,aiwash:0,fakeBid:false};
  const bad=['cooked','lawsuit','keyperson','concentration','union','maintenance'];
  const good=['realestate','pricing','patent','loyal','bloated','founder'];
  const nb={Failing:2,Steady:1,Thriving:chance(0.5)?1:0}[h]+(extraBad||0);
  let ng={Failing:chance(0.5)?1:0,Steady:1,Thriving:1}[h]; if(chance(0.3))ng++;
  shuffle(bad).slice(0,nb).forEach(k=>c.traits.push({k,rev:false}));
  shuffle(good).slice(0,ng).forEach(k=>c.traits.push({k,rev:false}));
  c.traits=shuffle(c.traits);
  const v=value(c);
  c.assetValue=v*({Failing:rf(0.9,1.5),Steady:rf(0.35,0.75),Thriving:rf(0.2,0.45)}[h])+(has(c,'realestate')?v*0.6:0);
  if(has(c,'cooked'))c.ebitda/=0.75;
  return c;
}
function makeOffer(c,kind,premium){if(kind!=='auction')premium*=1+repTier().price;const o={c,kind,premium,price:0,dd:0,ddMax:kind==='auction'?1:9,done:false,disc:false};recalcOffer(o);return o;}
function recalcOffer(o){o.price=value(o.c)*o.premium*(o.disc?0.88:1);}
function maxDebt(c,price){return Math.min(levCap()*c.ebitda,0.8*price);}
function canFinance(c,price){return !S.frozen&&price-maxDebt(c,price)<=S.fund.cash+1e-9;}
function ddCost(o){return 0.15*sc()+0.01*o.price;}

/* ---------- cards ---------- */
function strike(c){trig(c,'union');c.ebitda*=0.9;c.growth-=0.01;log(`Workers at ${c.name} walked out. Profit −10%, growth −1%.`,'bad');}
function needCash(x){if(S.frozen){log('Your fund cash is frozen this year.','bad');return false;}if(S.fund.cash<x){log(`Not enough fund cash (${fm(x)} needed).`,'bad');return false;}S.fund.cash-=x;return true;}
function needPersonal(x){if(S.personal<x){log(`Not enough personal money (${fm(x)} needed).`,'bad');return false;}S.personal-=x;return true;}

function cardCost(k){if(k==='cut'&&hasConn('mckinsey')&&!S.mckUsed)return 0;return CARDS[k].c;}
function draw(n){for(let i=0;i<n;i++){if(!S.deck.length){S.deck=shuffle(S.discard);S.discard=[];}if(!S.deck.length)break;S.hand.push(S.deck.pop());}}
function addCard(k){S.cards.push(k);S.discard.push(k);}
function removeCard(k){const i=S.cards.indexOf(k);if(i<0)return;S.cards.splice(i,1);for(const pile of [S.deck,S.discard,S.hand]){const j=pile.indexOf(k);if(j>=0){pile.splice(j,1);return;}}}
function draftCards(n,rareOnly){
  const w={common:6,uncommon:3,rare:1};const out=[];
  const keys=Object.keys(CARDS).filter(k=>!rareOnly||CARDS[k].r!=='common');
  for(let t=0;t<60&&out.length<n;t++){const o={};keys.forEach(k=>{if(!out.includes(k))o[k]=w[CARDS[k].r];});out.push(wpick(o));}
  return out;
}
function draftConns(n){return shuffle(Object.keys(CONNS).filter(k=>!S.conns.includes(k))).slice(0,n);}

/* ---------- card preview ---------- */
function snapshotMetrics(c){return {profit:c?c.ebitda:0,growth:c?c.growth:0,value:c?value(c):0,debt:c?c.debt:0,stake:c?equity(c):0,risk:c?riskOf(c):0,
  cash:S.fund.cash,dist:S.fund.dist,personal:S.personal,rep:S.rep,heat:S.heat,inf:S.influence,ev:S.evidence.length,companies:S.companies.length};}
function previewCard(k,cid){
  const S0=S,q0=Q.length,p0=pending;let res;
  try{
    S=JSON.parse(JSON.stringify(S0));PREVIEW=true;
    const c=cid!=null?co(cid):null;if(c)c.traits=c.traits.filter(t=>t.rev);
    const before=snapshotMetrics(c);
    const r=CARDS[k].p(c);
    if(r===false)res={blocked:S.log[0]?S.log[0].msg:'Can’t play this here.'};
    else{const c2=c?co(c.id):null;res={before,after:snapshotMetrics(c2)};}
  }catch(e){res={blocked:'No preview available.'};}
  finally{S=S0;PREVIEW=false;Q.length=q0;pending=p0;}
  return res;
}
function previewHTML(k,cid){
  const r=previewCard(k,cid);const C=CARDS[k];
  if(r.blocked)return `<div class="preview"><span class="bad">${esc(r.blocked)}</span></div>`;
  const b=r.before,a=r.after,L=[];
  const line=(label,x,y,f,goodUp=true)=>{if(Math.abs(y-x)<1e-6)return;const up=y>x;L.push(`<div>${label}: <b>${f(x)}</b> → <b class="${up===goodUp?'good':'bad'}">${f(y)}</b></div>`);};
  if(cid!=null){line('Yearly profit',b.profit,a.profit,fm);line('Growth',b.growth,a.growth,pct);line('Value',b.value,a.value,fm);line('Debt',b.debt,a.debt,fm,false);line('Your stake',b.stake,a.stake,fm);
    if(Math.abs(a.risk-b.risk)>=0.03)line('Chance bank takes it',b.risk,a.risk,x=>Math.round(x*100)+'%',false);}
  line('Fund cash',b.cash,a.cash,fm);line('Paid out',b.dist,a.dist,fm);line('Your money',b.personal,a.personal,fm);
  line('Reputation',b.rep,a.rep,x=>Math.round(x));line('Heat',b.heat,a.heat,x=>Math.round(x),false);line('Influence',b.inf,a.inf,x=>Math.round(x));
  if(a.ev>b.ev)L.push(`<div class="bad">Evidence +${a.ev-b.ev}</div>`);
  if(!L.length)L.push('<div>No visible change.</div>');
  if(C.odds)L.push(`<div class="warn">${C.odds}</div>`);
  if(cid!=null){const c=co(cid);if(c&&c.traits.some(t=>!t.rev))L.push('<div class="muted">Hidden traits could change this.</div>');}
  if(C.tier==='illegal'&&S.heat>=60)L.push('<div class="bad">Under watch: 20% chance you’re caught on the spot.</div>');
  return `<div class="preview">${L.join('')}</div>`;
}

/* ---------- modals ---------- */
const queue=m=>Q.push(m);
const next=m=>Q.unshift(m);
function info(title,body){return {title,body,choices:[{label:'Continue'}]};}
function cardRewardModal(why){
  const opts=draftCards(3);
  return {title:'Add a Play to Your Playbook',body:`${why} Pick one card for your deck, or skip.`,
    choices:opts.map(k=>({label:CARDS[k].n,sub:`${CARDS[k].c} action${CARDS[k].c===1?'':'s'} · ${CARDS[k].d}`,cls:CARDS[k].tier,fn:()=>{addCard(k);log(`Added ${CARDS[k].n} to your playbook.`);}})).concat([{label:'Skip'}])};
}
function connRewardModal(why){
  const opts=draftConns(3);
  if(!opts.length)return info('Connections','You already know everyone worth knowing.');
  return {title:'You Made a Connection',body:why||'Winning that got you noticed. Choose one.',
    choices:opts.map(k=>({label:CONNS[k].n,sub:CONNS[k].d,fn:()=>{S.conns.push(k);log(`New connection: ${CONNS[k].n}.`,'good');}}))};
}

/* ---------- bribery ---------- */
function genOfficials(){const names=shuffle(OFF_NAMES);return ['Zoning Commissioner','Regulator','Senator'].map((role,i)=>({id:i,name:names[i],role,trait:wpick({greedy:35,unreliable:15,bought:15,honest:15,sting:10,escalator:10}),known:false,demand:false}));}
function bribeModal(o){
  const bc=bribeCost();const offs=S.officials.filter(x=>!o.role||x.role===o.role);const choices=[];
  offs.forEach(of=>{
    if(!of.known)choices.push({label:`Background check on ${of.name}`,sub:`${fm(bc*0.25)} personal · learn what they’re really like`,disabled:()=>S.personal<bc*0.25,
      fn:()=>{S.personal-=bc*0.25;of.known=true;next(bribeModal(o));}});
    choices.push({label:`Pay ${of.name}, ${of.role}`,sub:`${fm(bc)} personal · ${of.known?OFF_TRAITS[of.trait].n+': '+OFF_TRAITS[of.trait].d:'character unknown'}`,cls:'illegal',
      disabled:()=>S.personal<bc,fn:()=>resolveBribe(of,bc,o)});
  });
  choices.push({label:'Back off',fn:()=>{o.onBackoff&&o.onBackoff();}});
  return {title:'Envelope of Cash',body:`${o.purpose}<br><span class="muted small">You have ${fm(S.personal)} of personal money. Every bribe that lands leaves serious evidence.</span>`,choices};
}
function resolveBribe(of,bc,o){
  S.personal-=bc;of.known=true;let msg='';
  switch(of.trait){
    case 'greedy':addEvidence('bribery',2);heat(4);msg=`${of.name} took the envelope and delivered.`;o.onSuccess(of);break;
    case 'escalator':addEvidence('bribery',2);heat(4);of.demand=true;msg=`${of.name} delivered. Then smiled and said, “See you next year.”`;o.onSuccess(of);break;
    case 'unreliable':addEvidence('bribery',2);msg=`${of.name} took the money and did nothing.`;o.onFail&&o.onFail();break;
    case 'bought':heat(15);S.rivalBoost=true;msg=`${of.name} already works for ${pick(RIVALS).name}. They know your playbook now (rivals bid harder at your next auction). Heat +15.`;o.onFail&&o.onFail();break;
    case 'honest':heat(20);msg=`${of.name} refused and called a reporter. Heat +20.`;o.onFail&&o.onFail();openCase('attempted bribery',1);break;
    case 'sting':heat(25);msg=`${of.name} was wearing a wire. Heat +25.`;o.onFail&&o.onFail();openCase('bribery, on tape',3);break;
  }
  log(msg,of.trait==='greedy'||of.trait==='escalator'?'warn':'bad');
  next(info('The Envelope',msg));
}
function bribeCard(){
  queue(bribeModal({purpose:'Who gets the envelope? A zoning commissioner fast-tracks permits at your largest company (profit +20%). A regulator makes problems go away (heat −30, one case closed). A senator delivers votes (influence +6).',
    onSuccess:of=>{
      if(of.role==='Zoning Commissioner'){const c=largest();if(c){c.ebitda*=1.2;log(`Permits for ${c.name} came through overnight. Profit +20%.`);}}
      else if(of.role==='Regulator'){heat(-30);const cs=S.cases[0];if(cs)closeCase(cs,'An investigation was quietly closed.');}
      else{S.influence+=6;}
    }}));
}

/* ---------- legal trouble ---------- */
function openCase(crime,stage){
  stage=stage||1;
  if(hasConn('golf')&&!S.golfUsed){S.golfUsed=true;log(`A look into ${crime} was quietly dropped. Your golf buddy made a call.`,'good');return;}
  if(stage===1&&hasConn('prfirm')&&!S.prUsed){S.prUsed=true;log(`A reporter asked about ${crime}. Your PR firm buried it.`,'good');return;}
  const cs={id:S.uid++,crime,stage};S.cases.push(cs);queue(caseModal(cs));
}
function closeCase(cs,msg){S.cases=S.cases.filter(x=>x!==cs);if(msg)log(msg,'good');}
function caseModal(cs){
  const bc=bribeCost();
  if(cs.stage===1)return {title:'A Reporter Is Asking Questions',body:`A journalist is digging into <b>${esc(cs.crime)}</b> at ${esc(S.firm)}.`,choices:[
    {label:'Hire a crisis PR firm',sub:`${fm(0.5*bc)} personal · 60% the story dies`,disabled:()=>S.personal<0.5*bc,fn:()=>{S.personal-=0.5*bc;if(chance(0.6))closeCase(cs,'The story died.');else{cs.stage=2;cs.wait=true;rep(-5);log('The story ran anyway. Reputation −5. Regulators noticed.','bad');}}},
    {label:'Call in a favor',sub:'Spend 2 influence · the editor spikes the story',disabled:()=>S.influence<2,fn:()=>{S.influence-=2;closeCase(cs,'The story was spiked.');}},
    {label:'Stonewall',sub:'Heat +10 · 40% it goes away, otherwise regulators next year',fn:()=>{heat(10);if(chance(0.4))closeCase(cs,'The reporter moved on.');else{cs.stage=2;cs.wait=true;rep(-5);}}},
    {label:'Leak dirt on a rival instead',sub:'Gray · reputation −2, minor evidence, story dies',cls:'gray',fn:()=>{rep(-2);addEvidence('leaking confidential information',1);closeCase(cs,`The press got distracted by a scandal at ${pick(RIVALS).name}.`);}}]};
  if(cs.stage===2)return {title:'Regulators Open an Investigation',body:`The Securities Commission has opened a formal investigation into <b>${esc(cs.crime)}</b>. Reputation −5.`,choices:[
    {label:'Hire top lawyers',sub:`${fm(1.5*bc)} personal · ${S.lawyered?'guaranteed (retainer)':'55% the case closes'}`,disabled:()=>S.personal<1.5*bc,fn:()=>{rep(-5);S.personal-=1.5*bc;const ok=S.lawyered||chance(0.55);S.lawyered=false;if(ok)closeCase(cs,'Your lawyers buried them in paperwork. Case closed.');else{cs.stage=3;cs.wait=true;log('The investigation is escalating.','bad');}}},
    {label:'Cooperate and pay a fine',sub:`${fm(2*bc+0.15*S.personal)} (15% of your money) · reputation −10 · banned from auctions this fund`,disabled:()=>S.personal<2*bc,fn:()=>{rep(-5);S.personal-=Math.min(S.personal,2*bc+0.15*S.personal);rep(-10);S.auctionBan=true;news(`${S.firm} fined over ${cs.crime}.`);closeCase(cs,'Fine paid. Case closed. Auction houses won’t deal with you this fund.');}},
    {label:'Call in big favors',sub:'Spend 4 influence · case dropped',disabled:()=>S.influence<4,fn:()=>{S.influence-=4;closeCase(cs,'Someone in Washington made the case go away.');}},

  const fine=4*bc+0.35*S.personal;

}

function realize(c,net,kind){

}

function pitchDmg(k){const m=fundMoic();return Math.round({numbers:clamp(15+90*(m-1),0,65),story:22,deflect:12,namedrop:8+4*S.conns.length,golf:10+S.rep/5,plan:avgLoad()<=3?30:10,promise:35,apology:25+S.rep/10,fake:60,adviser:45}[k]);}

function playPitch(k){

  else{b.q=pickQuestion();b.hand=pitchHand();}
}

  startAuction:x=>{const o=S.node.offers[+x];

  pull:x=>{const o=S.node.offers[+x];if(S.influence<2)return;S.influence-=2;o.allowed=true;log('A phone call got you into the auction.');},
  walk:()=>{const a=S.auc,o=S.node.offers[a.oi];o.done=true;log(`${a.leader&&a.leader!=='You'?a.leader:'A rival'} won ${o.c.name} at ${fm(a.price)}.`);S.auc=null;},
  confirmBuy:()=>{const b=S.buy,o=S.node.offers[b.oi],c=o.c;const el=document.getElementById('lev');const debt=clamp(+(el?el.value:0),Math.max(0,b.price-S.fund.cash),maxDebt(c,b.price));
    S.fund.cash-=b.price-debt;c.debt=debt;c.cost=b.price-debt;c.owned=true;c.yearsOwned=0;o.done=true;

      if(t.k==='founder'){t.rev=true;sur.push('<b>Motivated Seller</b>: the founder would have taken 12% less. Oh well.');}});

    if(sur.length)queue(info('Post-Closing Surprise',sur.join('<br>')));

    if(b.auction)queue(connRewardModal('Winning that auction got you noticed. Choose one.'));},
  cancelBuy:()=>{if(S.buy.auction){rep(-5);S.node.offers[S.buy.oi].done=true;log('You walked away from a signed deal. Reputation −5.','bad');}S.buy=null;S.phase='node';},
  leave:()=>{startOps();},

  shopConn:x=>{const sh=S.node.shop,k=sh.conns[+x],p=connPrice();if(sh.sold.includes('n'+x)||!needPersonal(p))return;S.conns.push(k);sh.sold.push('n'+x);log(`New connection: ${CONNS[k].n}.`,'good');},
  shopRemove:()=>{const p=0.6*sc()*(hasConn('club')?0.8:1);if(S.personal<p||S.cards.length<=4)return;const uniq=[...new Set(S.cards)];

function playCard(hi,c){
  const k=S.hand[hi],C=CARDS[k],cost=cardCost(k);if(cost>S.bw){log('Not enough actions left this year.','bad');return;}
  if(C.p(c)===false)return;
  if(k==='cut'&&hasConn('mckinsey'))S.mckUsed=true;
  S.bw-=cost;S.hand.splice(hi,1);S.discard.push(k);sel=null;
}
function mergeCos(a,b){
  if(!co(a.id)||!co(b.id))return;
  const tot=a.ebitda+b.ebitda;a.growth=(a.growth*a.ebitda+b.growth*b.ebitda)/tot;a.ebitda=tot;a.debt+=b.debt;a.cost+=b.cost;
  a.platform+=1+b.platform;a.traits=a.traits.concat(b.traits);a.assetValue+=b.assetValue;a.assetKnown=a.assetKnown&&b.assetKnown;
  a.multBonus=Math.max(a.multBonus,b.multBonus);a.inflated=Math.max(a.inflated,b.inflated);a.rateAdj=Math.min(a.rateAdj,b.rateAdj);
  if(!/Holdings$/.test(a.name))a.name=`${a.name.split(' ')[0]} ${a.sector} Holdings`;
  S.companies=S.companies.filter(x=>x!==b);log(`Merged ${b.name} into ${a.name}.`,'good');news(`${S.firm} combines ${b.name} into ${a.name}.`);
}

      ${btn(`Campaign donation · ${fm(1.5*sc()*cm)}`,'donate','',{cls:'gray',sub:'Influence +3, reputation −1',dis:sh.sold.includes('don')||S.personal<1.5*sc()*cm})}</div>`;

    body=`<p>Eighteen holes and a long lunch. Pick one.</p><div class="row">${btn('Charity foursome','retreat','rep',{sub:'Reputation +10'})}${btn('Lay low','retreat','heat',{sub:'Heat −25'})}${btn('Golf with a senator','retreat','inf',{sub:'Influence +3'})}${btn('Golf with investors','retreat','lp',{sub:'Fundraise score +0.08'})}</div>`;
  } else if(t==='exit'){
    body='<p>Strategic buyers are flush with cash. Every sale this year pays 25% more, and every company you own has a strategic buyer.</p>';
  } else body='<p class="muted">Resolving…</p>';
  const leave=t==='retreat'?'':`<div class="row">${btn('Go to operations →','leave','',{cls:'primary',dis:!!S.auc})}</div>`;
  return `<div class="panel"><h2>Year ${S.year}: ${t==='boss'?BOSS[S.fund.n-1].n:NODE_LABEL[t]}</h2>${body}${t==='event'||t==='boss'?'':leave}</div>`+portfolioHTML(false);
}
function bossHTML(){
  const b=S.boss;let h='';
  if(b.kind==='pitch'){
    const cards=b.done?'':b.hand.map(k=>{const P=PITCH[k],d=pitchDmg(k),ans=P.ans.includes(b.q);const dis=k==='adviser'&&S.personal<sc();
      return `<button class="btn cardb ${P.ill?'illegal':''}" data-a="pitch" data-x="${k}" ${dis?'disabled':''}><span class="top"><b>${P.n}</b><span class="cost">−${d}</span></span>${P.ill?'<span class="tag illegal">illegal</span>':''}<span class="desc">${P.d}</span><span class="desc ${ans?'good':'bad'}">${ans?'Answers the question':'Doesn’t answer: doubt +12'}</span>${k==='adviser'?`<span class="desc">Costs ${fm(sc())}</span>`:''}</button>`;}).join('');
    h=`<h2>Boss: The Investor Pitch${b.done?'':` · Round ${b.round} of ${b.max}`}</h2>
      <div><div class="row" style="justify-content:space-between"><b>Investor doubt</b><span class="stat"><span class="v">${b.doubt} / ${b.start}</span></span></div><div class="bar doubt"><i style="width:${clamp(b.doubt/b.start*100,0,100)}%"></i></div></div>
      <p class="small muted">Get doubt to 0 within ${b.max} rounds to win a connection and a +0.20 fundraise boost. Whatever doubt is left counts against your fundraise.</p>
      ${b.done?'':`<p class="boss-q">${QUESTIONS[b.q]}</p><p class="small muted">They’re asking about ${QLABEL[b.q]}. Pick your answer.</p><div class="hand">${cards}</div>`}`;
  } else {
    const c=co(b.coId);
    if(!c&&!b.done){b.done=true;b.msgs.unshift('The company is gone. The fight is over.');}
    const acts=b.done?'':Object.keys(DUEL_ACTS).map(k=>{const D=DUEL_ACTS[k];const ill=['leak','adviser','knight'].includes(k);
      let dis=false,sub=D.d;if(k==='buy'){const x=duelBuyCost();dis=S.fund.cash<x||!!S.frozen;sub+=` Costs ${fm(x)}.`;}if(k==='pill')dis=b.pill;if(k==='adviser'){dis=S.personal<sc();sub+=` Costs ${fm(sc())}.`;}if(k==='read')dis=b.known;
      return btn(D.n,'duel',k,{cls:ill?'illegal':k==='fold'?'gray':'',dis,sub});}).join('');
    h=`<h2>Boss: The Hostile Rival${b.done?'':` · Round ${Math.min(b.round,b.max)} of ${b.max}`}</h2>
      <p>Kestrel Partners is buying up <b>${c?esc(c.name):'your company'}</b>${c?` (${fm(value(c))})`:''}.</p>
      <div><div class="row" style="justify-content:space-between"><b>Kestrel’s stake</b><span class="stat"><span class="v">${b.stake}% / 50%</span></span></div><div class="bar rival"><i style="width:${clamp(b.stake,0,100)}%"></i><span class="mark"></span></div></div>
      <p class="small muted">Keep Kestrel under 50% for ${b.max} rounds, or until they run out of money. Win: the company’s multiple +1 and a connection. Lose: they force a sale at 70% of value.</p>
      ${b.done?'':`<p class="boss-q">${esc(b.tell||'')}</p><div class="row">${acts}</div>`}`;
  }
  return `<div class="panel">${h}${b.done?`<div class="row">${btn('Go to operations →','bossDone','',{cls:'primary'})}</div>`:''}<div class="log">${b.msgs.map(m=>`<div>${esc(m)}</div>`).join('')}</div></div>`+portfolioHTML(false);
}
function buyHTML(){
  const b=S.buy,o=S.node.offers[b.oi],c=o.c;const mx=maxDebt(c,b.price),mn=Math.max(0,b.price-S.fund.cash);const def=Math.max(mn,Math.min(mx,3*c.ebitda));
  return `<div class="panel"><h2>Finance ${esc(c.name)}</h2><p>Price <b>${fm(b.price)}</b>. Banks will lend up to <b>${fm(mx)}</b> (${levCap()}× yearly profit, at most 80% of the price). The rest comes from fund cash (${fm(S.fund.cash)}).</p>
   <p class="small muted">More debt means less of the fund’s money at risk and a bigger return if things go well. It also means higher interest and a bigger chance the bank takes the company in a bad year.</p>
   <label for="lev" class="small muted">How much to borrow</label><input type="range" id="lev" min="${mn}" max="${mx}" step="${Math.max(0.01,(mx-mn)/100)}" value="${def}">
   <div id="levtxt" class="preview"></div>
   <div class="row">${btn('Sign the deal','confirmBuy','',{cls:'primary'})}${btn(b.auction?'Back out (reputation −5)':'Cancel','cancelBuy')}</div></div>`;
}
function levText(){
  const el=document.getElementById('lev'),out=document.getElementById('levtxt');if(!el||!out||!S||!S.buy)return;
  const c=S.node.offers[S.buy.oi].c,d=+el.value,eq=S.buy.price-d,rate=compRate(c,d);const fcf=c.ebitda*0.65-d*rate;const rk=riskOf(c,d),rl=riskLabel(rk);
  out.innerHTML=`<div>Borrow <b>${fm(d)}</b> · debt load <b>${(d/c.ebitda).toFixed(1)}×</b> yearly profit</div><div>From the fund: <b>${fm(eq)}</b></div>
   <div>Interest: <b>${(rate*100).toFixed(1)}%</b> = ${fm(d*rate)} a year · left to pay down debt: <b class="${fcf<0?'bad':''}">${fm(fcf)}</b>${fcf<0?' (debt will grow)':''}</div>
   <div><span class="pill ${rl.cls}">${rl.n}</span> ${Math.round(rk*100)}% chance the bank takes it next year${d/c.ebitda<=2?' · <span class="good">Low debt: +1% growth a year</span>':''}</div>`;
}
function cardHTML(k,a,x,o){
  o=o||{};const C=CARDS[k];const shop=o.price!==undefined;const cost=shop?fm(o.price):`${cardCost(k)} action${cardCost(k)===1?'':'s'}`;
  const dis=o.sold||(shop?S.personal<o.price:cardCost(k)>S.bw);
  return `<button class="btn cardb ${C.tier} ${o.selected?'selected':''}" data-a="${a}" data-x="${x}" ${dis?'disabled':''}>
    <span class="top"><b>${C.n}</b><span class="cost">${o.sold?'Sold':cost}</span></span><span class="tag ${C.tier}">${C.tier==='legal'?(C.t==='co'?'pick a company':'instant'):C.tier}</span><span class="desc">${C.d}</span></button>`;
}
function portfolioHTML(ops){
  if(!S.companies.length)return `<div class="panel"><h2>Portfolio</h2><p class="muted">You don’t own any companies yet.</p></div>`;
  const selK=ops&&sel!==null?S.hand[sel]:null,selC=selK&&CARDS[selK].t==='co'?CARDS[selK]:null;
  return `<div class="panel"><h2>Portfolio · ${S.companies.length} ${S.companies.length===1?'company':'companies'} · your stakes ${fm(nav())}</h2><div class="grid2">${S.companies.map(c=>{
    let act='';
    if(ops){
      if(selC)act=previewHTML(selK,c.id)+`<div class="row">${btn(`Apply ${selC.n}`,'apply',c.id,{cls:'primary'})}</div>`;
      else{
        const pe=salePE(c),st=saleStrat(c),br=saleBreak(c);const canSt=c.strategic||S.exitBoost>0;
        act=btn(`Sell to a PE firm · ${fm(pe-c.debt)}`,'sell',`${c.id}:pe`,{dis:pe<c.debt,sub:'Paid out after repaying debt'});
        if(canSt)act+=btn(`Strategic sale · ${fm(st-c.debt)}`,'sell',`${c.id}:strat`,{cls:'primary',dis:st<c.debt});
        act+=btn(`Break up · ${c.assetKnown?fm(br-c.debt):'value unknown'}`,'sell',`${c.id}:break`,{cls:'gray',sub:'Sell for parts. Reputation −2 to −5'});
        if(S.companies.some(o=>o!==c&&o.sector===c.sector))act+=btn('Merge…','merge',c.id);
        if(value(c)<c.debt)act+=btn('Let the bank take it','keys',c.id,{sub:'Reputation −5'});
        act=`<div class="row">${act}</div>`;
      }
    }
    return `<div class="co ${selC?'target':''}">${coHead(c)}${coStats(c)}${traitsHTML(c)}${c.strategic&&ops?'<p class="small good">A strategic buyer is interested this year.</p>':''}${act}</div>`;}).join('')}</div></div>`;
}
function opsHTML(){
  const hand=S.hand.length?S.hand.map((k,i)=>cardHTML(k,'selcard',i,{selected:sel===i})).join(''):'<p class="muted">No cards left this year.</p>';
  const last=S.year===7;const selK=sel!==null?S.hand[sel]:null;
  let selPanel='';
  if(selK){const C=CARDS[selK];
    selPanel=C.t==='none'?`<div class="co target"><b>${C.n}</b>${previewHTML(selK,null)}<div class="row">${btn(`Play ${C.n}`,'playNow','',{cls:'primary',dis:cardCost(selK)>S.bw})}${btn('Cancel','selcard',sel)}</div></div>`
      :`<p class="small"><b>${C.n}</b> selected. Each company below shows what it would do. Tap the card again to cancel.</p>`;}
  let h=`<div class="panel"><div class="row" style="justify-content:space-between"><h2>Year ${S.year} operations</h2><span><b>${S.bw}</b> action${S.bw===1?'':'s'} left</span></div>
    ${selK?'':'<p class="small muted">Tap a card to see what it would do. Sell or merge companies, then end the year. Unplayed cards go to the discard pile.</p>'}
    <div class="hand">${hand}</div>${selPanel}
    <div class="row">${btn(last?'End year and close the fund':'End year','endYear','',{cls:'primary',sub:last?'Unsold companies go to a fire sale or a continuation fund':`You earn ${fm(0.02*S.fund.size)} in fees · heat cools · companies grow`})}</div></div>`;
  h+=portfolioHTML(true);
  h+=trailHTML();
  if(S.fund.n>=2)h+=lobbyHTML();
  h+=connsHTML();
  return h;
}
function trailHTML(){
  const ht=heatTier();
  return `<div class="panel"><h2>Heat & paper trail</h2><div class="row" style="justify-content:space-between"><b class="${S.heat>=60?'bad':S.heat>=30?'warn':''}">${ht.n} · ${S.heat}</b><span class="small muted">30 reporters · 60 under watch · 90 raid</span></div><div class="bar heat"><i style="width:${S.heat}%"></i></div>
   <p class="small muted">${ht.d} Heat cools by 8 a year.</p>
   ${S.evidence.length?`<div class="tablewrap"><table><tr><th>Evidence</th><th>Severity</th><th class="n">Surfaces this year</th><th class="n">Goes cold in</th></tr>${S.evidence.map(e=>`<tr><td>${esc(e.crime)}</td><td>${SEV[e.sev].n}</td><td class="n">${Math.round(evChance(e)*100)}%</td><td class="n">${evLife(e)-e.age} yr</td></tr>`).join('')}</table></div>`:'<p class="small">Clean, for now.</p>'}
   ${S.cases.length?`<p class="small bad">Open cases: ${S.cases.map(c=>esc(c.crime)).join(', ')}</p>`:''}</div>`;
}
function lobbyHTML(){
  return `<div class="panel"><h2>Capitol Hill · ${S.influence} influence</h2><p class="small muted">Spend influence to push a bill. A bill needs 8 points. Opponents knock 0–2 points off unfinished bills every year. Elections at each fund close can repeal laws (25% each).</p>
   ${Object.keys(LAWS).map(k=>{const p=S.bills[k],stage=S.laws[k]?'Signed':p>=6?'Floor vote':p>=3?'Committee':'Drafted';
     return `<div class="row" style="justify-content:space-between"><div style="min-width:0;flex:1"><b>${LAWS[k].n}</b> <span class="small muted">· ${stage} ${S.laws[k]?'':`${p}/8`}</span><div class="small muted">${LAWS[k].d}</div><div class="bar"><i style="width:${Math.min(100,p/8*100)}%"></i></div></div>${S.laws[k]?'<span class="good small">In force</span>':btn('Push +1','bill',k,{dis:S.influence<1})}</div>`;}).join('')}</div>`;
}
function connsHTML(){
  const deck=[...new Set(S.cards)].map(k=>`${CARDS[k].n}${S.cards.filter(x=>x===k).length>1?' ×'+S.cards.filter(x=>x===k).length:''}`).join(', ');
  return `<div class="panel"><h2>Connections & playbook</h2><ul class="small" style="margin:0;padding-left:18px">${S.conns.map(k=>`<li><b>${CONNS[k].n}</b>: ${CONNS[k].d}</li>`).join('')}</ul>
   <p class="small muted">Playbook (${S.cards.length} cards, ${S.deck.length} in draw pile): ${deck}</p></div>`;
}
function closeHTML(){
  const last=S.fund.n===3;
  return `<div class="panel"><h2>Closing ${FUNDNAMES[S.fund.n-1]}</h2><p class="small muted">${last?'This is your final fund. Everything left is sold at 90% of your stake’s value.':'Unsold companies go to a fire sale at 85% of your stake’s value. Or move them into a continuation fund: your next fund buys them at your own valuation, and this fund books full value. Investors notice (reputation −3, heat +4 each).'}</p>
   ${S.companies.length?S.companies.map(c=>`<div class="co">${coHead(c)}<div class="row">${btn(`Fire sale · ${fm(equity(c)*(last?0.9:0.85))}`,'closeSel',`${c.id}:sell`,{cls:S.closeSel[c.id]==='sell'?'primary':''})}${last?'':btn(`Continuation fund · ${fm(equity(c))}`,'closeSel',`${c.id}:cont`,{cls:S.closeSel[c.id]==='cont'?'primary gray':'gray'})}</div></div>`).join(''):'<p>All companies sold. Clean close.</p>'}
   <div class="row">${btn('Close the fund','finalize','',{cls:'primary'})}</div></div>`;
}
function raiseHTML(){
  const r=S.raise,f=S.fund;
  const rows=r.parts.map(p=>`<tr><td>${p[0]}</td><td class="n">${p[1]>=0?'+':''}${p[1].toFixed(2)}</td></tr>`).join('');
  const verdict=r.outcome==='success'?`<p class="good"><b>Oversubscribed.</b> ${FUNDNAMES[f.n]} closes at ${fm(r.size)}.</p>`:r.outcome==='weak'?`<p class="warn"><b>A tough raise.</b> Investors commit only ${fm(r.size)} to ${FUNDNAMES[f.n]}.</p>`:`<p class="bad"><b>Investors pass.</b> There will be no ${FUNDNAMES[f.n]}.</p>`;
  return `<div class="panel"><h2>${FUNDNAMES[f.n-1]} final results</h2><div class="stats">${stat(T('Return','MOIC'),r.moic.toFixed(2)+'×','',`${fm(f.size)} → ${fm(r.moic*f.size)}`)}${stat(T('Your bonus','carry'),fm(r.carry),r.carry>0?'good':'')}${stat('Fees earned',fm(f.fees))}</div>
   <p class="small muted">Your bonus is 20% of the profit, paid only if the fund returns at least 1.30×.</p>
   <h3>Fundraise for ${FUNDNAMES[f.n]}</h3><div class="tablewrap"><table>${rows}<tr><th>Score</th><th class="n">${r.score.toFixed(2)}</th></tr><tr><td>Target</td><td class="n">${r.target.toFixed(2)}</td></tr></table></div>
   <p class="small muted">Hit the target for a big new fund. Within 80% of it, you get a small one. Below that, the run ends.</p>
   ${verdict}${r.repealed.length?`<p class="bad small">Election results: ${r.repealed.join(', ')} repealed.</p>`:''}
   <div class="row">${btn(r.outcome==='fail'?'See how it ended':`Launch ${FUNDNAMES[f.n]}`,'nextFund','',{cls:'primary'})}</div></div>`;
}
function overHTML(){
  const o=S.outcome;
  return `<div class="panel"><h1>${esc(o.kind)}</h1><p>${esc(o.text)}</p><div class="stats">${stat('Your fortune',fm(S.personal),'good')}${stat('Funds raised',S.funds.length)}${stat('Reputation',S.rep)}</div>
   ${S.funds.length?`<div class="tablewrap"><table><tr><th>Fund</th><th class="n">Size</th><th class="n">Return</th><th class="n">Your bonus</th></tr>${S.funds.map(f=>`<tr><td>${FUNDNAMES[f.n-1]}</td><td class="n">${fm(f.size)}</td><td class="n">${f.moic.toFixed(2)}×</td><td class="n">${fm(f.carry)}</td></tr>`).join('')}</table></div>`:''}
   <div class="paper"><h2>The Ledger</h2><ul style="margin:0;padding-left:18px">${S.news.slice(0,10).map(n=>`<li>${esc(n)}</li>`).join('')||'<li>Nobody wrote about you. That might be a good thing.</li>'}</ul></div>
   <div class="row">${btn('New run','newRun','',{cls:'primary'})}</div></div>`;
}
function titleHTML(){
  let saved=null,hall=[];
  try{saved=localStorage.getItem(SAVE_KEY);hall=JSON.parse(localStorage.getItem(HALL_KEY)||'[]');}catch(e){}
  return `<div class="panel"><h1>PE Tycoon</h1><p>Raise a fund. Buy companies. Fix them, flip them, or strip them for parts. Three funds, seven years each. Retire rich, or go to prison trying.</p>
   ${saved?`<div class="row">${btn('Continue saved run','continue','',{cls:'primary'})}</div>`:''}
   <label for="firmname" class="small muted">Firm name</label><input type="text" id="firmname" maxlength="40" placeholder="Granite Ridge Capital">
   <h3>Choose your founder</h3><div class="grid2">${Object.keys(FOUNDERS).map(k=>btn(FOUNDERS[k].n,'pickFounder',k,{cls:titleFounder===k?'primary':'',sub:FOUNDERS[k].d})).join('')}</div>
   <div class="row">${btn('Start Fund I ($50M)','start','',{cls:'primary'})}</div>
   <details><summary>How to play</summary><ul class="small" style="padding-left:18px">
    <li>Each fund lasts 7 years. Every year, pick a stop on the map: deals, auctions, distressed sales, conferences, retreats, events or exit windows. Year 7 is a boss fight, shown from the start.</li>
    <li>Before buying, pay for diligence to reveal hidden traits. Banks lend part of the price; the rest comes from fund cash. More debt means bigger returns and bigger risk.</li>
    <li>Each year, spend actions on playbook cards to grow profit, then sell. Tap a card to preview exactly what it does. Merge same-sector companies for a bigger multiple.</li>
    <li>Your return is what the fund is worth divided by what investors gave you. Hit the fundraise target to raise a bigger next fund. Your bonus pays only above 1.30×.</li>
    <li>Gray and illegal moves pay big but leave evidence. Evidence can surface for years. Heat makes it surface faster. It’s a gamble that usually ends badly.</li>
    <li>Your money comes from 2% yearly fees and your bonus. It pays for bribes, conferences and lawyers. Your final score is your fortune.</li>
    <li>Tap anything marked ⓘ for an explanation.</li></ul></details>
   ${hall.length?`<h3>Hall of Firms</h3><div class="tablewrap"><table><tr><th>Firm</th><th>Founder</th><th>Ending</th><th class="n">Fortune</th></tr>${hall.slice(0,10).map(h=>`<tr><td>${esc(h.firm)}</td><td>${esc(h.founder)}</td><td>${esc(h.kind)}</td><td class="n">${fm(h.fortune)}</td></tr>`).join('')}</table></div>`:''}
  </div>`;
}
function logHTML(){
  return `<div class="panel"><div class="row" style="justify-content:space-between"><h2>Deal log</h2>${btn('Quit to title','quit','',{sub:'Progress is saved'})}</div><div class="log">${S.log.slice(0,40).map(l=>`<div class="${l.cls}"><span class="y">${l.y}</span>${esc(l.msg)}</div>`).join('')}</div></div>`;
}
function renderModal(){
  const el=document.getElementById('modal');const m=Q[0];
  if(!m){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  el.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>${esc(m.title)}</h2><div>${m.body}</div><div class="choices">${m.choices.map((c,i)=>{const d=typeof c.disabled==='function'?c.disabled():c.disabled;
    return `<button class="btn ${c.cls||''}" data-a="modal" data-x="${i}" ${d?'disabled':''}>${esc(c.label)}${c.sub?`<span class="sub">${esc(c.sub)}</span>`:''}</button>`;}).join('')}</div></div>`;
  const b=el.querySelector('button:not(:disabled)');if(b)b.focus({preventScroll:true});
}
function render(){
  for(let guard=0;guard<10&&!Q.length&&pending;guard++){const p=pending;pending=null;p();}
  if(S&&sel!==null&&(S.phase!=='ops'||sel>=S.hand.length))sel=null;
  const app=document.getElementById('app');
  if(!S){app.innerHTML=titleHTML()+`<footer>v${VERSION}</footer>`;renderModal();return;}
  let main='';
  switch(S.phase){
    case 'map':main=mapHTML();break;
    case 'node':main=nodeHTML();break;
    case 'buy':main=buyHTML();break;
    case 'boss':main=bossHTML();break;
    case 'ops':main=opsHTML();break;
    case 'close':main=closeHTML();break;
    case 'raise':main=raiseHTML();break;
    case 'over':main=overHTML();break;
  }
  app.innerHTML=(S.phase==='over'?'':statusHTML())+main+(S.phase==='over'?'':logHTML())+`<footer>PE Tycoon v${VERSION}</footer>`;
  levText();renderModal();
  if(!Q.length&&!pending&&S.phase!=='over')save();
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const f=A[b.dataset.a];if(!f)return;
  f(b.dataset.x);render();
});
document.addEventListener('input',e=>{if(e.target.id==='lev')levText();});

function start(d){
  if(d&&d.save){try{S=JSON.parse(d.save);}catch(e){S=null;}}
  render();
}
window.claude?.hot?.snapshot?.(()=>({save:S&&!Q.length?JSON.stringify(S):null}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

</html>
