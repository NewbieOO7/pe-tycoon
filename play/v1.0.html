<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>PE Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-column game console. Status strip, then the current phase, portfolio and hand, then the deal log. Plain on purpose: v1 tests mechanics, not looks. */
:root{
  --bg:#eef0ec; --panel:#fbfcfa; --ink:#18201b; --muted:#5b675f; --line:#d3d9d3;
  --accent:#1d6b47; --accent-ink:#ffffff; --good:#1d7a3e; --warn:#8f5b00; --bad:#b42318;
  --chip:#e3e8e3; --sel:#d3eadc; --scrim:rgb(10 16 12 / .55);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1411; --panel:#171e1a; --ink:#e3eae5; --muted:#95a299; --line:#2b362f;
  --accent:#4fbf86; --accent-ink:#0b130e; --good:#62d394; --warn:#e3a94a; --bad:#ff7d6e;
  --chip:#222c26; --sel:#1d3a2a; --scrim:rgb(0 0 0 / .65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1411; --panel:#171e1a; --ink:#e3eae5; --muted:#95a299; --line:#2b362f;
  --accent:#4fbf86; --accent-ink:#0b130e; --good:#62d394; --warn:#e3a94a; --bad:#ff7d6e;
  --chip:#222c26; --sel:#1d3a2a; --scrim:rgb(0 0 0 / .65); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
#app{max-width:980px;margin:0 auto;padding-block:12px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;text-wrap:balance} h1{font-size:24px} h2{font-size:17px} h3{font-size:14px}
p{margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)} .small{font-size:12px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.btn{font:inherit;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;text-align:left}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn .sub{display:block;font-size:12px;opacity:.8;font-weight:400}
.btn.illegal{border-color:var(--bad)} .btn.gray{border-color:var(--warn)}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.tag.illegal{color:var(--bad)} .tag.gray{color:var(--warn)} .tag.legal{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px 10px}
.stat{display:flex;flex-direction:column;min-width:0}
.stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-variant-numeric:tabular-nums;font-weight:600;font-family:var(--mono);font-size:13px}
.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.co{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.co.target{border-color:var(--accent);background:var(--sel)}
.co-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--chip);white-space:nowrap}
.pill.Failing{color:var(--bad)} .pill.Thriving{color:var(--good)}
.traits{display:flex;flex-direction:column;gap:2px;font-size:12px;margin:0;padding:0;list-style:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cardb{display:flex;flex-direction:column;gap:4px;min-height:110px}
.cardb.selected{border-color:var(--accent);background:var(--sel)}
.cardb .top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.cardb .cost{font-family:var(--mono);font-weight:700}
.cardb .desc{font-size:12px;opacity:.85}
.map{display:grid;grid-template-columns:52px repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.map .yr{font-size:11px;color:var(--muted);align-self:center}
.map .node{text-align:center;padding:10px 4px}
.map .node.here{background:var(--sel);border-color:var(--accent)}
.map .boss{grid-column:2 / span 3;text-align:center;font-weight:600}
.log{font-size:12px;display:flex;flex-direction:column;gap:3px;max-height:260px;overflow:auto}
.log .y{font-family:var(--mono);color:var(--muted);margin-right:6px}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.heat>i{background:var(--bad)}
#modal{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal[hidden]{display:none!important}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:520px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
#modal .choices{display:flex;flex-direction:column;gap:8px}
input[type=text]{font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;max-width:320px}
input[type=range]{width:100%}
table{border-collapse:collapse;font-size:12px;width:100%} td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left} td.n{font-family:var(--mono);text-align:right}
.tablewrap{overflow-x:auto}
.paper{border:2px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:6px}
.paper h2{font-family:Georgia,"Times New Roman",serif;font-size:22px;text-align:center;border-bottom:1px solid var(--ink);padding-bottom:6px}
.paper li{font-family:Georgia,"Times New Roman",serif}
details summary{cursor:pointer}
footer{font-size:11px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" hidden></div>

<script>
'use strict';
const VERSION = '1.0';
const SAVE_KEY = 'pe_tycoon_save';
const HALL_KEY = 'pe_tycoon_hall';

/* ---------- state ---------- */
let S = null;          // game state (serializable)
let Q = [];            // modal queue (transient)
let pending = null;    // continuation to run once the modal queue empties
let sel = null;        // selected hand index
let titleFounder = 'banker';

/* ---------- rng & helpers ---------- */
function rand(){S.rs=(S.rs+0x6D2B79F5)|0;let t=S.rs;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
const rf=(a,b)=>a+(b-a)*rand();
const ri=(a,b)=>Math.floor(rf(a,b+1));
const pick=a=>a[Math.floor(rand()*a.length)];
const chance=p=>rand()<p;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function wpick(o){let t=0;for(const k in o)t+=o[k];let r=rand()*t;for(const k in o){r-=o[k];if(r<0)return k;}return Object.keys(o)[0];}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function fm(x){const n=Math.abs(x),s=x<0?'−':'';if(n>=1000)return s+'$'+(n/1000).toFixed(2)+'B';if(n>=100)return s+'$'+n.toFixed(0)+'M';return s+'$'+n.toFixed(1)+'M';}
const pct=x=>(x>=0?'+':'−')+Math.abs(x*100).toFixed(1)+'%';
const sc=()=>S.fund.size/50;
const calYear=()=>2026+(S.fund.n-1)*7+S.year;
const FUNDNAMES=['Fund I','Fund II','Fund III'];

/* ---------- data ---------- */
const SECTORS={
  'Dental':{mult:9,suf:['Dental Partners','Smile Group','Family Dentistry']},
  'Laundromats':{mult:5,suf:['Suds Co.','Wash & Fold','Laundry Centers']},
  'HVAC':{mult:7,suf:['Heating & Air','Comfort Systems','Climate Services']},
  'Software':{mult:12,suf:['Logic','Cloudworks','Data Systems']},
  'Restaurants':{mult:6,suf:['Diner Group','Burger Co.','Pizza Kitchens']},
  'Trucking':{mult:5,suf:['Freight','Haulers','Logistics']},
  'Pet Care':{mult:10,suf:['Pet Resorts','Animal Hospitals','Grooming Co.']},
  'Manufacturing':{mult:6,suf:['Fasteners','Tool & Die','Plastics']}
};
const PREFIX=['Midwest','Summit','Blue Ridge','Lakeside','Ironwood','Sunbelt','Pioneer','Harbor','Copperline','Prairie','Northstar','Bayou','Redwood','Keystone','Cedar Valley','Gulf Coast','Twin Rivers','Old Mill','High Plains','Silver Creek','Granite','Bluewater','Foxhollow','Tri-County'];

const TRAITS={
  cooked:{n:'Cooked Books',bad:true,d:'Reported EBITDA is about 25% inflated.'},
  lawsuit:{n:'Pending Lawsuit',bad:true,d:'A settlement of about 1.5× EBITDA lands in year 2.'},
  keyperson:{n:'Key-Person Risk',bad:true,d:'The founder runs everything. Replacing the CEO backfires, and they may quit.'},
  concentration:{n:'Customer Concentration',bad:true,d:'One customer is a quarter of sales and may leave.'},
  union:{n:'Union Trouble',bad:true,d:'Cost cuts and layoffs trigger strikes.'},
  maintenance:{n:'Deferred Maintenance',bad:true,d:'About 1× EBITDA of surprise repairs in year 1.'},
  realestate:{n:'Hidden Real Estate',bad:false,d:'Owns valuable property. Breakups and sale-leasebacks pay more.'},
  pricing:{n:'Pricing Power',bad:false,d:'Customers tolerate price hikes. Raise Prices is doubled.'},
  patent:{n:'Unused Patent',bad:false,d:'May license for a cash windfall.'},
  loyal:{n:'Loyal Customers',bad:false,d:'Grows about 2% faster than the numbers show.'},
  bloated:{n:'Bloated Costs',bad:false,d:'Fat to trim. Cut Costs is doubled.'},
  founder:{n:'Motivated Seller',bad:false,d:'The founder wants out. Price drops 12% once you know.'}
};

const RIVALS=[
  {name:'Kestrel Partners',bias:0.12,loves:null},
  {name:'Monolith Capital',bias:0,loves:'Manufacturing'},
  {name:'Vantablack Growth',bias:0.04,loves:'Software'}
];

const FOUNDERS={
  banker:{n:'Ex-Investment Banker',lev:5,bw:3,op:0.8,rate:-0.005,conn:'insider',
    deck:['cut','cut','raise','recap','refi','paydown','consult','network','slb'],
    d:'Borrows up to 5× EBITDA at cheaper rates and starts with the Auction Insider. Operational cards are 20% weaker. 3 bandwidth a year.'},
  operator:{n:'Former Operator',lev:3.5,bw:4,op:1.25,rate:0,conn:'guru',
    deck:['cut','cut','raise','raise','ceo','overhaul','consult','network','pivot'],
    d:'Operational cards are 25% stronger and you get 4 bandwidth a year. Starts with the Turnaround Guru. Lenders cap you at 3.5× EBITDA.'}
};

const CONNS={
  banker:{n:'Friendly Banker',d:'+1× EBITDA borrowing limit on every deal.'},
  golf:{n:"Senator's Golf Buddy",d:'The first investigation each fund is quietly dropped.'},
  mckinsey:{n:'Ex-Consultant Associate',d:'Your first Cut Costs each year costs 0 bandwidth.'},
  whisper:{n:'Pension Fund Whisperer',d:'Fundraising targets are 15% lower.'},
  barbarians:{n:'Dog-Eared "Barbarians at the Gate"',d:'Each diligence round reveals 2 traits.'},
  prfirm:{n:'PR Firm on Retainer',d:'The first reporter each fund is handled for free.'},
  cayman:{n:'Cayman Lawyer',d:'Carry +25%. Heat +3 every year.'},
  insider:{n:'Auction Insider',d:"See roughly where the top rival will walk away in auctions."},
  guru:{n:'Turnaround Guru',d:'Shrinking companies you buy get +4% growth.'},
  rolodex:{n:'Rolodex of CFOs',d:'Draw 1 extra card each year.'},
  dog:{n:'Office Dog',d:'Reputation +1 every year.'},
  vulture:{n:'Distressed Debt Desk',d:'Distressed deals are 10% cheaper.'},
  shredder:{n:'Shredder Pro 3000',d:'Evidence goes cold after 3 years instead of 5.'},
  hype:{n:'Hype Machine',d:'Strategic sales in the hot sector pay 10% more.'},
  club:{n:'Club Membership',d:'Conference prices −20% and one extra card on offer.'},
  second:{n:'Second Chair',d:'+1 bandwidth every year.'}
};

const LAWS={
  loophole:{n:'Carried Interest Loophole',d:'Your carry is taxed like a capital gain. Carry ×1.5.'},
  interest:{n:'Interest Deduction Expansion',d:'Interest costs −30% at every company.'},
  antitrust:{n:'Antitrust Relaxation',d:'Clears the final antitrust review. Platform premium doubles.'}
};

const OFF_NAMES=['Dale Pruitt','Anne Holloway','Wade Kimball','Rita Vasquez','Hugh Barnaby','Lorraine Cobb','Gus Feeney','Priya Natarajan','Bo Whitlock','Marjorie Tull','Felix Ortega','Constance Reed'];
const OFF_TRAITS={
  greedy:{n:'Greedy',d:'Takes the money and delivers.'},
  unreliable:{n:'Unreliable',d:'Takes the money. Delivers nothing.'},
  bought:{n:'Already Bought',d:'Works for a rival firm.'},
  honest:{n:'Honest',d:'Will report you.'},
  sting:{n:'Wired',d:'Cooperating with prosecutors.'},
  escalator:{n:'Escalator',d:'Delivers, then keeps asking for more.'}
};

/* ---------- small state helpers ---------- */
const hasConn=k=>S.conns.includes(k);
const has=(c,k)=>c.traits.some(t=>t.k===k);
function trig(c,k){const t=c.traits.find(t=>t.k===k);if(t)t.rev=true;return !!t;}
function dropTrait(c,k){c.traits=c.traits.filter(t=>t.k!==k);}
const OPM=()=>FOUNDERS[S.founder].op;
function rep(d){S.rep=clamp(S.rep+d,0,100);}
function heat(d){S.heat=clamp(S.heat+d,0,100);}
function log(msg,cls){S.log.unshift({y:`${FUNDNAMES[S.fund.n-1]} Y${S.year}`,msg,cls:cls||''});if(S.log.length>80)S.log.length=80;}
function news(s){S.news.unshift(`${calYear()}: ${s}`);}
function addEvidence(crime){S.evidence.push({id:S.uid++,crime,age:0});}
const co=id=>S.companies.find(c=>c.id===id);
const bribeCost=()=>0.8*sc();
function levCap(){return FOUNDERS[S.founder].lev+(hasConn('banker')?1:0);}

/* ---------- valuation ---------- */
function health(c){return c.growth<0?'Failing':c.growth>=0.08?'Thriving':'Steady';}
function mult(c){
  let m=SECTORS[c.sector].mult*S.mkt;
  if(c.sector===S.hot)m*=1.25; if(c.sector===S.cold)m*=0.8;
  const h=health(c); if(h==='Failing')m*=0.65; else if(h==='Thriving')m*=1.2;
  m+=1.5*Math.log10(Math.max(c.ebitda,0.5));
  m+=c.multBonus;
  if(c.platform>=2)m+=S.laws.antitrust?2:1;
  return Math.max(2,m);
}
function value(c){return Math.max(0,c.ebitda)*mult(c)*(1+(c.inflated||0));}
function equity(c){return Math.max(0,value(c)-c.debt);}
function nav(){return S.companies.reduce((s,c)=>s+equity(c),0);}
function fundMoic(){const f=S.fund;return (f.cash+f.dist+nav())/f.size;}
function largest(){return S.companies.slice().sort((a,b)=>value(b)-value(a))[0]||null;}

/* ---------- companies ---------- */
function genName(sector){
  for(let i=0;i<30;i++){const n=`${pick(PREFIX)} ${pick(SECTORS[sector].suf)}`;if(!S.usedNames.includes(n)){S.usedNames.push(n);return n;}}
  return `${pick(PREFIX)} ${sector} #${S.uid}`;
}
function genCompany(h,extraBad){
  const sector=pick(Object.keys(SECTORS));
  const g={Failing:[-0.12,-0.03],Steady:[0.01,0.06],Thriving:[0.08,0.16]}[h];
  const e={Failing:[0.012,0.04],Steady:[0.02,0.06],Thriving:[0.02,0.05]}[h];
  const c={id:S.uid++,name:genName(sector),sector,ebitda:S.fund.size*rf(e[0],e[1]),growth:rf(g[0],g[1]),
    multBonus:0,debt:0,rateAdj:0,platform:0,traits:[],assetKnown:false,owned:false,yearsOwned:0,cost:0,
    strategic:false,inflated:0,slb:false,aiwash:0};
  const bad=['cooked','lawsuit','keyperson','concentration','union','maintenance'];
  const good=['realestate','pricing','patent','loyal','bloated','founder'];
  const nb={Failing:2,Steady:1,Thriving:chance(0.5)?1:0}[h]+(extraBad||0);
  let ng={Failing:chance(0.5)?1:0,Steady:1,Thriving:1}[h]; if(chance(0.3))ng++;
  shuffle(bad).slice(0,nb).forEach(k=>c.traits.push({k,rev:false}));
  shuffle(good).slice(0,ng).forEach(k=>c.traits.push({k,rev:false}));
  c.traits=shuffle(c.traits);
  const v=value(c);
  c.assetValue=v*({Failing:rf(0.9,1.5),Steady:rf(0.35,0.75),Thriving:rf(0.2,0.45)}[h])+(has(c,'realestate')?v*0.6:0);
  if(has(c,'cooked'))c.ebitda/=0.75;
  return c;
}
function makeOffer(c,kind,premium){const o={c,kind,premium,price:0,dd:0,ddMax:kind==='auction'?1:9,done:false,disc:false};recalcOffer(o);return o;}
function recalcOffer(o){o.price=value(o.c)*o.premium*(o.disc?0.88:1);}
function maxDebt(c,price){return Math.min(levCap()*c.ebitda,0.8*price);}
function canFinance(c,price){return price-maxDebt(c,price)<=S.fund.cash+1e-9;}
function ddCost(o){return 0.15*sc()+0.01*o.price;}

/* ---------- cards ---------- */
function strike(c){trig(c,'union');c.ebitda*=0.9;c.growth-=0.01;log(`Workers at ${c.name} walked out. EBITDA −10%, growth −1%.`,'bad');}
function needCash(x){if(S.fund.cash<x){log(`Not enough fund cash (${fm(x)} needed).`,'bad');return false;}S.fund.cash-=x;return true;}
function needPersonal(x){if(S.personal<x){log(`Not enough personal money (${fm(x)} needed).`,'bad');return false;}S.personal-=x;return true;}
const CARDS={
  cut:{n:'Cut Costs',c:1,t:'co',r:'common',tier:'legal',d:'EBITDA +8%. Doubled with Bloated Costs. Union Trouble causes a strike.',
    p:c=>{let g=0.08*OPM();if(trig(c,'bloated'))g*=2;c.ebitda*=1+g;log(`Cut costs at ${c.name}: EBITDA ${pct(g)}.`);if(has(c,'union'))strike(c);}},
  raise:{n:'Raise Prices',c:1,t:'co',r:'common',tier:'legal',d:'EBITDA +6%. Doubled with Pricing Power; otherwise 25% chance growth −1%.',
    p:c=>{let g=0.06*OPM();if(trig(c,'pricing'))g*=2;else if(chance(0.25)){c.growth-=0.01;log(`Some ${c.name} customers left over the price hike. Growth −1%.`,'bad');}c.ebitda*=1+g;log(`Raised prices at ${c.name}: EBITDA ${pct(g)}.`);}},
  ceo:{n:'Replace the CEO',c:2,t:'co',r:'common',tier:'legal',d:'Growth +3% (to at least +2%), EBITDA +3%. Backfires with Key-Person Risk.',
    p:c=>{if(trig(c,'keyperson')){c.ebitda*=0.8;dropTrait(c,'keyperson');log(`The founder of ${c.name} left with the customer list. EBITDA −20%.`,'bad');return;}
      c.growth=Math.max(c.growth+0.03*OPM(),0.02);c.ebitda*=1.03;log(`New CEO at ${c.name}. Growth now ${pct(c.growth)}.`);}},
  overhaul:{n:'Process Overhaul',c:2,t:'co',r:'common',tier:'legal',d:'Growth +3%.',
    p:c=>{c.growth+=0.03*OPM();log(`Process overhaul at ${c.name}. Growth now ${pct(c.growth)}.`);}},
  consult:{n:'Hire Consultants',c:1,t:'co',r:'common',tier:'legal',d:'Reveal every hidden trait and the breakup value. EBITDA +3%.',
    p:c=>{c.traits.forEach(t=>t.rev=true);c.assetKnown=true;c.ebitda*=1.03;log(`Consultants finished their deck on ${c.name}. Everything is on the table.`);}},
  recap:{n:'Dividend Recap',c:1,t:'co',r:'common',tier:'gray',d:'Borrow 1.5× EBITDA more and pay it straight to the fund. Reputation −2.',
    p:c=>{const nd=1.5*c.ebitda;if((c.debt+nd)/c.ebitda>levCap()+1.5){log(`Lenders refuse more debt for ${c.name}.`,'bad');return false;}
      c.debt+=nd;S.fund.dist+=nd;rep(-2);log(`Dividend recap at ${c.name}: ${fm(nd)} paid to the fund.`);}},
  slb:{n:'Sale-Leaseback',c:1,t:'co',r:'common',tier:'gray',d:'Sell the property and rent it back: cash out 35% of breakup value. EBITDA −8%. Once per company.',
    p:c=>{if(c.slb){log(`${c.name} has nothing left to sell and lease back.`,'bad');return false;}
      let cash=c.assetValue*0.35;if(trig(c,'realestate'))cash*=1.3;c.assetValue-=cash;c.slb=true;c.assetKnown=true;c.ebitda*=0.92;S.fund.dist+=cash;
      log(`Sale-leaseback at ${c.name}: ${fm(cash)} to the fund.`);}},
  refi:{n:'Refinance',c:1,t:'co',r:'common',tier:'legal',d:'Interest rate −1.5% at this company (down to −3%).',

function cardCost(k){if(k==='cut'&&hasConn('mckinsey')&&!S.mckUsed)return 0;return CARDS[k].c;}
function draw(n){for(let i=0;i<n;i++){if(!S.deck.length){S.deck=shuffle(S.discard);S.discard=[];}if(!S.deck.length)break;S.hand.push(S.deck.pop());}}
function addCard(k){S.cards.push(k);S.discard.push(k);}
function removeCard(k){const i=S.cards.indexOf(k);if(i<0)return;S.cards.splice(i,1);for(const pile of [S.deck,S.discard,S.hand]){const j=pile.indexOf(k);if(j>=0){pile.splice(j,1);return;}}}
function draftCards(n,rareOnly){
  const w={common:6,uncommon:3,rare:1};const out=[];
  const keys=Object.keys(CARDS).filter(k=>!rareOnly||CARDS[k].r!=='common');
  for(let t=0;t<60&&out.length<n;t++){const o={};keys.forEach(k=>{if(!out.includes(k))o[k]=w[CARDS[k].r];});out.push(wpick(o));}
  return out;
}
function draftConns(n){return shuffle(Object.keys(CONNS).filter(k=>!S.conns.includes(k))).slice(0,n);}

/* ---------- modals ---------- */
const queue=m=>Q.push(m);
const next=m=>Q.unshift(m);
function info(title,body){return {title,body,choices:[{label:'Continue'}]};}
function cardRewardModal(why){
  const opts=draftCards(3);
  return {title:'Add a Play to Your Playbook',body:`${why} Pick one card for your deck, or skip.`,
    choices:opts.map(k=>({label:CARDS[k].n,sub:`${CARDS[k].c} bandwidth · ${CARDS[k].d}`,cls:CARDS[k].tier,fn:()=>{addCard(k);log(`Added ${CARDS[k].n} to your playbook.`);}})).concat([{label:'Skip'}])};
}
function connRewardModal(){
  const opts=draftConns(3);
  if(!opts.length)return info('Connections','You already know everyone worth knowing.');
  return {title:'You Made a Connection',body:'Winning that auction got you noticed. Choose one.',
    choices:opts.map(k=>({label:CONNS[k].n,sub:CONNS[k].d,fn:()=>{S.conns.push(k);log(`New connection: ${CONNS[k].n}.`,'good');}}))};
}

/* ---------- bribery ---------- */
function genOfficials(){const names=shuffle(OFF_NAMES);return ['Zoning Commissioner','Regulator','Senator'].map((role,i)=>({id:i,name:names[i],role,trait:wpick({greedy:35,unreliable:15,bought:15,honest:15,sting:10,escalator:10}),known:false,demand:false}));}
function bribeModal(o){
  const bc=bribeCost();const offs=S.officials.filter(x=>!o.role||x.role===o.role);const choices=[];
  offs.forEach(of=>{
    if(!of.known)choices.push({label:`Background check on ${of.name}`,sub:`${fm(bc*0.25)} personal · learn what they’re really like`,disabled:()=>S.personal<bc*0.25,
      fn:()=>{S.personal-=bc*0.25;of.known=true;next(bribeModal(o));}});
    choices.push({label:`Pay ${of.name}, ${of.role}`,sub:`${fm(bc)} personal · ${of.known?OFF_TRAITS[of.trait].n+': '+OFF_TRAITS[of.trait].d:'character unknown'}`,cls:'illegal',
      disabled:()=>S.personal<bc,fn:()=>resolveBribe(of,bc,o)});
  });
  choices.push({label:'Back off',fn:()=>{o.onBackoff&&o.onBackoff();}});
  return {title:'Envelope of Cash',body:`${o.purpose}<br><span class="muted small">You have ${fm(S.personal)} of personal money. Every bribe that lands leaves evidence.</span>`,choices};
}
function resolveBribe(of,bc,o){
  S.personal-=bc;of.known=true;let msg='';
  switch(of.trait){
    case 'greedy':addEvidence('bribery');heat(4);msg=`${of.name} took the envelope and delivered.`;o.onSuccess(of);break;
    case 'escalator':addEvidence('bribery');heat(4);of.demand=true;msg=`${of.name} delivered. Then smiled and said, “See you next year.”`;o.onSuccess(of);break;
    case 'unreliable':addEvidence('bribery');msg=`${of.name} took the money and did nothing.`;o.onFail&&o.onFail();break;
    case 'bought':heat(15);S.rivalBoost=true;msg=`${of.name} already works for ${pick(RIVALS).name}. They know your playbook now (rivals bid harder at the next auction). Heat +15.`;o.onFail&&o.onFail();break;
    case 'honest':heat(20);msg=`${of.name} refused and called a reporter. Heat +20.`;o.onFail&&o.onFail();openCase('attempted bribery',1);break;
    case 'sting':heat(25);msg=`${of.name} was wearing a wire. Heat +25.`;o.onFail&&o.onFail();openCase('bribery, on tape',2);break;
  }
  log(msg,of.trait==='greedy'||of.trait==='escalator'?'warn':'bad');
  next(info('The Envelope',msg));
}
function bribeCard(){
  queue(bribeModal({purpose:'Who gets the envelope? A zoning commissioner fast-tracks permits at your largest company (EBITDA +10%). A regulator makes problems go away (Heat −25, a reporter loses interest). A senator delivers votes (Influence +4).',
    onSuccess:of=>{
      if(of.role==='Zoning Commissioner'){const c=largest();if(c){c.ebitda*=1.1;log(`Permits for ${c.name} came through overnight. EBITDA +10%.`);}}
      else if(of.role==='Regulator'){heat(-25);const cs=S.cases.find(x=>x.stage===1);if(cs)closeCase(cs,'The reporter’s source stopped returning calls.');}
      else{S.influence+=4;}
    }}));
}

/* ---------- legal trouble ---------- */
function openCase(crime,stage){
  stage=stage||1;
  if(hasConn('golf')&&!S.golfUsed){S.golfUsed=true;log(`A look into ${crime} was quietly dropped. Your golf buddy made a call.`,'good');return;}
  if(stage===1&&hasConn('prfirm')&&!S.prUsed){S.prUsed=true;log(`A reporter asked about ${crime}. Your PR firm buried it.`,'good');return;}
  const cs={id:S.uid++,crime,stage};S.cases.push(cs);queue(caseModal(cs));
}
function closeCase(cs,msg){S.cases=S.cases.filter(x=>x!==cs);if(msg)log(msg,'good');}
function caseModal(cs){
  const bc=bribeCost();
  if(cs.stage===1)return {title:'A Reporter Is Asking Questions',body:`A journalist is digging into <b>${esc(cs.crime)}</b> at ${esc(S.firm)}.`,choices:[
    {label:'Hire a crisis PR firm',sub:`${fm(0.5*bc)} personal · 65% the story dies`,disabled:()=>S.personal<0.5*bc,fn:()=>{S.personal-=0.5*bc;if(chance(0.65))closeCase(cs,'The story died.');else{cs.stage=2;cs.wait=true;log('The story ran anyway. Regulators noticed.','bad');}}},
    {label:'Stonewall',sub:'Heat +10 · 50% it goes away, otherwise regulators get involved next year',fn:()=>{heat(10);if(chance(0.5))closeCase(cs,'The reporter moved on.');else{cs.stage=2;cs.wait=true;}}},
    {label:'Leak dirt on a rival instead',sub:'Gray · reputation −2, evidence +1, story dies',cls:'gray',fn:()=>{rep(-2);addEvidence('leaking confidential information');closeCase(cs,`The press got distracted by a scandal at ${pick(RIVALS).name}.`);}}]};
  if(cs.stage===2)return {title:'Regulators Open an Investigation',body:`The Securities Commission has opened a formal investigation into <b>${esc(cs.crime)}</b>.`,choices:[
    {label:'Hire top lawyers',sub:`${fm(1.5*bc)} personal · ${S.lawyered?'guaranteed (retainer)':'60% the case closes'}`,disabled:()=>S.personal<1.5*bc,fn:()=>{S.personal-=1.5*bc;const ok=S.lawyered||chance(0.6);S.lawyered=false;if(ok)closeCase(cs,'Your lawyers buried them in paperwork. Case closed.');else{cs.stage=3;cs.wait=true;log('The investigation is escalating.','bad');}}},
    {label:'Cooperate and pay a fine',sub:`${fm(2*bc)} personal · reputation −8 · case closes`,disabled:()=>S.personal<2*bc,fn:()=>{S.personal-=2*bc;rep(-8);news(`${S.firm} fined over ${cs.crime}.`);closeCase(cs,'Fine paid. Case closed.');}},
    {label:'Obstruct',sub:'Illegal · 50% the case collapses, otherwise a subpoena now, evidence +1, heat +15',cls:'illegal',fn:()=>{if(chance(0.5))closeCase(cs,'Key documents went missing. The case collapsed.');else{addEvidence('obstruction of justice');heat(15);cs.stage=3;next(caseModal(cs));}}}]};
  return {title:'Subpoena',body:`Prosecutors want you to testify about <b>${esc(cs.crime)}</b>.`,choices:[
    {label:'Blame your COO',sub:S.fallGuys<2?'Reputation −12 · case closes · works twice per career':'Nobody left to blame',disabled:()=>S.fallGuys>=2,fn:()=>{S.fallGuys++;rep(-12);news(`${S.firm} COO resigns amid ${cs.crime} probe.`);closeCase(cs,'Your COO took the fall.');}},
    {label:'Settle without admitting wrongdoing',sub:`${fm(4*bc+0.1*S.personal)} personal · reputation −15`,disabled:()=>S.personal<4*bc+0.1*S.personal,fn:()=>{S.personal-=4*bc+0.1*S.personal;rep(-15);news(`${S.firm} settles ${cs.crime} charges, neither admitting nor denying wrongdoing.`);closeCase(cs,'Settled.');}},
    {label:'Go to trial',sub:'45% acquittal (reputation −5). Otherwise prison.',fn:()=>{if(chance(0.45)){rep(-5);news(`${S.firm} founder acquitted of ${cs.crime}.`);closeCase(cs,'Acquitted!');}else{news(`${S.firm} founder convicted of ${cs.crime}.`);gameOver('Convicted',`The jury did not buy it. You were convicted of ${cs.crime}.`);}}}]};
}

/* ---------- covenant & disposal ---------- */
function breachModal(c){
  const need=Math.max(0,c.debt-5*c.ebitda);
  return {title:`${c.name} Breached Its Covenants`,body:`Debt is ${(c.debt/c.ebitda).toFixed(1)}× EBITDA and lenders allow 7×. Put in equity to bring it down to 5×, or hand the company to the lenders.`,choices:[
    {label:`Inject ${fm(need)} from the fund`,sub:`You have ${fm(S.fund.cash)} of fund cash`,disabled:()=>S.fund.cash<need,fn:()=>{if(!co(c.id))return;S.fund.cash-=need;c.debt-=need;c.cost+=need;log(`Injected ${fm(need)} into ${c.name}.`);}},
    {label:'Hand the keys to the lenders',sub:'You lose the company. Reputation −5.',fn:()=>{if(co(c.id))handKeys(c);}}]};
}
function handKeys(c){S.companies=S.companies.filter(x=>x!==c);rep(-5);S.fund.exits.push({name:c.name,moic:0,net:0});news(`${c.name} collapses under ${S.firm}’s debt.`);log(`Lost ${c.name} to its lenders.`,'bad');}
function salePE(c){return value(c)*0.97;}
function saleStrat(c){return value(c)*(1.15+S.exitBoost)*(c.sector===S.hot&&hasConn('hype')?1.1:1);}
function saleBreak(c){return c.assetValue*0.95;}
function realize(c,net,kind){
  S.fund.dist+=net;S.companies=S.companies.filter(x=>x!==c);
  const m=c.cost>0?net/c.cost:0;S.fund.exits.push({name:c.name,moic:m,net});
  if(kind==='break'){rep(c.growth<0?-2:-5);news(`${c.name} broken up and sold for parts. ${ri(60,500)*Math.ceil(Math.sqrt(sc()))} jobs lost.`);}
  else news(`${S.firm} sells ${c.name} to ${kind==='pe'?pick(RIVALS).name:kind==='family'?'the founding family':'a strategic buyer'} for ${fm(net+c.debt)}.`);
  log(`Sold ${c.name}: ${fm(net)} to the fund (${m.toFixed(2)}× on equity).`,'good');
}

function runEvent(){
  const ok=EVENTS.filter(e=>!e.need||(e.need==='co'&&S.companies.length)||(e.need==='evidence'&&S.evidence.length));

/* ---------- map ---------- */
const NODE_LABEL={deal:'Deal',auction:'Auction',distressed:'Distressed',conference:'Conference',retreat:'Golf Retreat',event:'Event',exit:'Exit Window'};
const NODE_DESC={deal:'Two companies for sale at fair prices.',auction:'One great company. Bid against rivals. Winning earns a connection.',distressed:'Two broken companies, cheap. Many hidden problems.',conference:'Spend personal money on cards and connections.',retreat:'Recover reputation, cool heat, or charm investors.',event:'Something happens. You choose how to respond.',exit:'Strategic buyers are hunting: every sale this year pays 25% more.'};
const BOSS=[{n:'LP Annual Meeting',d:'Your investors want answers before the fundraise.'},{n:'Rate Shock',d:'Rates +3 points, valuations −20%, EBITDA −10%. Lenders check covenants.'},{n:'Antitrust Review',d:'Regulators review your largest company before the final close.'}];
function genMap(){
  const rows=[];
  for(let y=0;y<6;y++){const row=[];for(let l=0;l<3;l++){let t=y===0?pick(['deal','deal','distressed']):wpick({deal:30,auction:12,distressed:14,conference:12,retreat:8,event:18,exit:8});if(y<2&&t==='exit')t='deal';row.push(t);}
    if(y===3&&!row.includes('conference'))row[ri(0,2)]='conference';rows.push(row);}
  return rows;
}
const reachable=l=>S.year===1||S.pos===null||Math.abs(l-S.pos)<=1;

/* ---------- flow ---------- */
function startRun(firm,founder){
  S={v:VERSION,rs:(Date.now()^Math.floor(Math.random()*1e9))|0,uid:1,firm,founder,phase:'map',rep:50,heat:0,influence:0,personal:0,
    conns:[FOUNDERS[founder].conn],cards:FOUNDERS[founder].deck.slice(),deck:[],discard:[],hand:[],bw:0,companies:[],evidence:[],cases:[],officials:[],
    bills:{loophole:0,interest:0,antitrust:0},laws:{},log:[],news:[],funds:[],usedNames:[],fallGuys:0,lpBonus:0,markup:0,exitBoost:0,
    rivalHandicap:false,rivalBoost:false,lawyered:false,mckUsed:false,golfUsed:false,prUsed:false,rate:0.07,mkt:1,hot:null,cold:null,year:1,fund:{n:1,size:50}};
  startFund(1,50,[]);
}
function rotateHype(){const k=shuffle(Object.keys(SECTORS));S.hot=k[0];S.cold=k[1];}
function startFund(n,size,cont){
  S.fund={n,size,cash:size,dist:0,fees:0,exits:[]};S.year=1;S.pos=null;S.path=[];S.map=genMap();S.officials=genOfficials();
  S.rate=0.07+rf(-0.01,0.01);S.mkt=1;rotateHype();S.deck=shuffle(S.cards);S.discard=[];S.hand=[];
  S.lpBonus=0;S.markup=0;S.golfUsed=false;S.prUsed=false;S.exitBoost=0;S.node=null;
  cont.forEach(c=>{const eq=equity(c);S.fund.cash=Math.max(0,S.fund.cash-eq);c.cost=eq;S.companies.push(c);});
  S.phase='map';log(`${FUNDNAMES[n-1]} closed at ${fm(size)}. Seven years to put it to work.`,'good');
}
function enterNode(t){
  S.node={type:t};
  switch(t){
    case 'deal':S.node.offers=[0,1].map(()=>makeOffer(genCompany(wpick({Steady:50,Thriving:25,Failing:25})),'deal',rf(1.0,1.1)));break;
    case 'distressed':S.node.offers=[0,1].map(()=>makeOffer(genCompany('Failing',chance(0.5)?1:0),'distressed',rf(0.65,0.8)*(hasConn('vulture')?0.9:1)));break;
    case 'auction':{
      const c=genCompany(chance(0.6)?'Thriving':'Steady');if(!c.traits.some(t=>!TRAITS[t.k].bad))c.traits.push({k:'loyal',rev:false});
      const o=makeOffer(c,'auction',0.9);const v=value(c);
      o.rivals=RIVALS.map(r=>({name:r.name,limit:v*(rf(0.95,1.3)+r.bias+(r.loves===c.sector?0.15:0)+(S.rivalBoost?0.1:0)),in:true}));
      S.rivalBoost=false;
      if(S.rivalHandicap){o.rivals.sort((a,b)=>b.limit-a.limit);const gone=o.rivals.shift();o.note=`${gone.name}’s financing fell through. They’re out.`;S.rivalHandicap=false;}
      S.node.offers=[o];break;}
    case 'conference':S.node.shop={cards:draftCards(hasConn('club')?4:3),conns:draftConns(2),sold:[]};break;
    case 'exit':S.exitBoost=0.25;S.companies.forEach(c=>c.strategic=true);break;
    case 'event':runEvent();pending=startOps;break;
    case 'boss':runBoss();pending=startOps;break;
  }
  S.phase='node';
}
function runBoss(){
  const n=S.fund.n;
  if(n===1){queue({title:'LP Annual Meeting',body:`Your investors want the numbers. Fund MOIC right now is <b>${fundMoic().toFixed(2)}×</b>. The fundraise is at year’s end.`,choices:[
    {label:'Tell the truth',sub:'Reputation +3',fn:()=>rep(3)},
    {label:'Mark up the unrealized portfolio',sub:'Illegal · fundraise score +0.15, evidence +1, heat +10',cls:'illegal',fn:()=>{S.markup=0.15;addEvidence('valuation fraud');heat(10);}},
    {label:'Wine and dine them',sub:`${fm(1.5*sc())} personal · fundraise score +0.07`,disabled:()=>S.personal<1.5*sc(),fn:()=>{S.personal-=1.5*sc();S.lpBonus+=0.07;}}]});}
  else if(n===2){
    S.rate+=0.03;S.mkt=clamp(S.mkt*0.8,0.5,1.4);S.companies.forEach(c=>c.ebitda*=0.9);
    queue(info('Rate Shock','Rates jumped 3 points overnight. Valuations are down 20% and every company lost 10% of its EBITDA. Lenders are checking covenants.'));
    S.companies.filter(c=>c.debt/c.ebitda>7).forEach(c=>queue(breachModal(c)));
  } else {
    const c=largest();
    if(!c){queue(info('Antitrust Review','Regulators wanted to review your largest company. You don’t own any. They leave disappointed.'));return;}
    if(S.laws.antitrust){queue(info('Antitrust Review',`Thanks to the Antitrust Relaxation Act, the review of ${esc(c.name)} took one afternoon. Cleared.`));return;}
    const lose=()=>{c.multBonus-=2;c.growth-=0.02;news(`Regulators block ${c.name} expansion.`);log(`${c.name} lost its antitrust review. Multiple −2, growth −2%.`,'bad');};
    queue({title:'Antitrust Review',body:`Regulators are reviewing <b>${esc(c.name)}</b> (${fm(value(c))}). If they rule against you, its multiple drops by 2 and growth by 2%.`,choices:[
      {label:'Fight in court',sub:'50% cleared',fn:()=>{if(chance(0.5))log(`${c.name} cleared antitrust review.`,'good');else lose();}},
      {label:'Call in favors',sub:'Spend 5 influence · cleared',disabled:()=>S.influence<5,fn:()=>{S.influence-=5;log('The review was quietly closed.','good');}},
      {label:'Pay off the regulator',sub:'Illegal · opens a bribe',cls:'illegal',fn:()=>{next(bribeModal({role:'Regulator',purpose:`Pay the regulator to clear ${esc(c.name)}?`,onSuccess:()=>log(`${c.name} cleared antitrust review.`,'good'),onFail:lose,onBackoff:lose}));}},
      {label:'Divest it now',sub:`Sell for 85% of value: ${fm(value(c)*0.85-c.debt)} to the fund`,disabled:()=>value(c)*0.85<c.debt,fn:()=>realize(c,value(c)*0.85-c.debt,'pe')}]});
  }
}
function startOps(){S.phase='ops';S.node=null;S.buy=null;S.auc=null;S.bw=FOUNDERS[S.founder].bw+(hasConn('second')?1:0);draw(5+(hasConn('rolodex')?1:0));}
function endYear(){
  S.discard.push(...S.hand);S.hand=[];sel=null;
  const f=S.fund;
  // cases waiting from last year advance first
  S.cases.filter(cs=>cs.wait).forEach(cs=>{cs.wait=false;queue(caseModal(cs));});
  for(const c of S.companies.slice()){
    c.yearsOwned++;
    c.ebitda*=1+c.growth+rf(-0.03,0.03)*(c.growth<0?1.6:1);
    if(c.growth>0.1)c.growth-=0.008;c.growth+=rf(-0.008,0.008);
    const rate=Math.max(0.02,S.rate+c.rateAdj+FOUNDERS[S.founder].rate)*(S.laws.interest?0.7:1);
    const fcf=c.ebitda*0.65-c.debt*rate;
    if(fcf>=0){const pay=Math.min(c.debt,fcf);c.debt-=pay;if(fcf>pay)f.dist+=fcf-pay;}else c.debt-=fcf;
    c.assetValue*=1.02;
    if(has(c,'maintenance')&&c.yearsOwned===1){c.debt+=c.ebitda;dropTrait(c,'maintenance');log(`Deferred Maintenance at ${c.name}: ${fm(c.ebitda)} of emergency repairs added to its debt.`,'bad');}
    if(has(c,'lawsuit')&&c.yearsOwned===2){const a=1.5*c.ebitda;c.debt+=a;dropTrait(c,'lawsuit');log(`Pending Lawsuit at ${c.name}: ${fm(a)} settlement added to its debt.`,'bad');}
    if(has(c,'keyperson')&&chance(0.12)){c.ebitda*=0.85;dropTrait(c,'keyperson');log(`Key-Person Risk at ${c.name}: the founder quit. EBITDA −15%.`,'bad');}
    if(has(c,'concentration')&&chance(0.18)){c.ebitda*=0.75;dropTrait(c,'concentration');log(`Customer Concentration at ${c.name}: the biggest customer left. EBITDA −25%.`,'bad');}
    if(has(c,'patent')&&chance(0.25)){const a=0.6*c.ebitda;f.dist+=a;dropTrait(c,'patent');log(`Unused Patent at ${c.name} licensed for ${fm(a)}.`,'good');}
    c.strategic=chance(0.3);
  }
  const fee=0.02*f.size,fromCash=Math.min(f.cash,fee);f.cash-=fromCash;f.dist-=fee-fromCash;f.fees+=fee;S.personal+=fee;
  if(hasConn('dog'))rep(1);
  if(hasConn('cayman'))heat(3);
  const life=hasConn('shredder')?3:5;
  for(const e of S.evidence.slice()){
    e.age++;
    if(e.age>=life){S.evidence=S.evidence.filter(x=>x!==e);log(`The ${e.crime} trail went cold.`,'good');}
    else if(chance(0.04+S.heat/250)){S.evidence=S.evidence.filter(x=>x!==e);openCase(e.crime,1);}
  }
  heat(-8);
  S.officials.filter(o=>o.demand).forEach(of=>{const bc=bribeCost();queue({title:`${of.name} Wants Another Envelope`,body:`The ${of.role.toLowerCase()} you paid off wants ${fm(2*bc)} more. Or they start talking.`,choices:[
    {label:'Pay up',sub:`${fm(2*bc)} personal · Illegal · evidence +1`,cls:'illegal',disabled:()=>S.personal<2*bc,fn:()=>{S.personal-=2*bc;addEvidence('bribery');of.demand=chance(0.5);}},
    {label:'Refuse',sub:'They go to the regulators',fn:()=>{of.demand=false;openCase('bribery',2);}}]});});
  S.rate=clamp(S.rate+rf(-0.005,0.006),0.02,0.15);S.mkt=clamp(S.mkt+rf(-0.05,0.05),0.6,1.4);
  if(S.year%2===0)rotateHype();
  if(S.fund.n>=2)for(const k in S.bills)if(!S.laws[k]&&S.bills[k]>0)S.bills[k]=Math.max(0,S.bills[k]-ri(0,2));
  S.companies.filter(c=>c.debt/c.ebitda>7).forEach(c=>queue(breachModal(c)));
  S.exitBoost=0;
  pending=()=>{
    if(S.phase==='over')return;
    if(S.rep<=0){gameOver('Blacklisted','Your reputation hit zero. No investor will return your calls.');return;}
    if(S.year>=7){S.phase='close';S.closeSel={};S.companies.forEach(c=>S.closeSel[c.id]='sell');}
    else{S.year++;S.mckUsed=false;S.phase='map';}
  };
}
function finalizeClose(){
  const f=S.fund,last=f.n===3,cont=[];
  for(const c of S.companies){
    if(!last&&S.closeSel[c.id]==='cont'){f.dist+=equity(c);cont.push(c);rep(-3);heat(4);news(`${S.firm} moves ${c.name} into a continuation fund, at its own valuation.`);}
    else{const p=equity(c)*(last?0.9:0.85);f.dist+=p;f.exits.push({name:c.name,moic:c.cost>0?p/c.cost:0,net:p});news(`${c.name} sold in ${S.firm}’s end-of-fund fire sale.`);}
  }
  S.companies=[];
  const total=f.cash+f.dist,moic=total/f.size;
  let carry=0;if(moic>=1.3)carry=0.2*(total-f.size)*(S.laws.loophole?1.5:1)*(hasConn('cayman')?1.25:1);
  S.personal+=carry;
  S.funds.push({n:f.n,size:f.size,moic,carry,fees:f.fees});
  if(last){gameOver('Retired',`You closed ${FUNDNAMES[2]} at ${moic.toFixed(2)}× and retired to a ranch in Montana.`);return;}
  const target=[1.35,1.55][f.n-1]*(hasConn('whisper')?0.85:1);
  const parts=[['Fund MOIC',moic],['Reputation',(S.rep-50)/200],['Heat',-S.heat/400],['Open cases',-0.08*S.cases.length],['Investor dinners',S.lpBonus],['Marked-up valuations',S.markup]];
  const score=parts.reduce((s,p)=>s+p[1],0);
  let outcome,size;
  if(score>=target){outcome='success';size=f.size*6*Math.pow(Math.min(2,score/target),1.5);}
  else if(score>=0.8*target){outcome='weak';size=f.size*3;}
  else{outcome='fail';size=0;}
  const repealed=[];
  if(f.n>=2)for(const k in S.laws)if(chance(0.25)){delete S.laws[k];S.bills[k]=0;repealed.push(LAWS[k].n);}
  S.raise={moic,carry,parts,score,target,outcome,size,cont,repealed};S.phase='raise';
}
function gameOver(kind,text){
  S.phase='over';S.outcome={kind,text};Q=[];pending=null;
  try{const h=JSON.parse(localStorage.getItem(HALL_KEY)||'[]');h.push({firm:S.firm,founder:FOUNDERS[S.founder].n,fortune:S.personal,kind,funds:S.funds.length,date:new Date().toISOString().slice(0,10),v:VERSION});h.sort((a,b)=>b.fortune-a.fortune);localStorage.setItem(HALL_KEY,JSON.stringify(h.slice(0,20)));}catch(e){}
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
}

const A={
  pickFounder:x=>{titleFounder=x;},

    const hidden=shuffle(o.c.traits.filter(t=>!t.rev)).slice(0,hasConn('barbarians')?2:1);

  startAuction:x=>{const o=S.node.offers[+x];S.auc={oi:+x,price:o.price,leader:null,step:value(o.c)*0.05,msgs:[]};if(o.note)S.auc.msgs.push(o.note);},

  confirmBuy:()=>{const b=S.buy,o=S.node.offers[b.oi],c=o.c;const el=document.getElementById('lev');const debt=clamp(+(el?el.value:0),Math.max(0,b.price-S.fund.cash),maxDebt(c,b.price));
    S.fund.cash-=b.price-debt;c.debt=debt;c.cost=b.price-debt;c.owned=true;c.yearsOwned=0;o.done=true;

      if(t.k==='founder'){t.rev=true;sur.push('<b>Motivated Seller</b>: the founder would have taken 12% less. Oh well.');}});
    if(has(c,'loyal'))c.growth+=0.02;

  cancelBuy:()=>{if(S.buy.auction){rep(-5);S.node.offers[S.buy.oi].done=true;log('You walked away from a signed deal. Reputation −5.','bad');}S.buy=null;S.phase='node';},
  leave:()=>{startOps();},
  retreat:x=>{if(x==='rep')rep(10);else if(x==='heat')heat(-25);else S.lpBonus+=0.08;startOps();},

    queue({title:'Fire a Junior Associate',body:`Remove one card from your playbook for ${fm(p)}.`,choices:uniq.map(k=>({label:CARDS[k].n,sub:CARDS[k].d,fn:()=>{S.personal-=p;removeCard(k);log(`Removed ${CARDS[k].n} from your playbook.`);}})).concat([{label:'Never mind'}])});},
  donate:()=>{const p=1.5*sc()*(hasConn('club')?0.8:1);if(!needPersonal(p))return;S.influence+=3;rep(-1);S.node.shop.sold.push('don');log('Campaign donation made. Influence +3.');},

    if(gross<c.debt){log(`Selling ${c.name} that way would not cover its debt.`,'bad');return;}c.assetKnown=true;realize(c,gross-c.debt,kind);},
  keys:x=>{const c=co(+x);if(c)handKeys(c);},
  merge:x=>{const a=co(+x);const others=S.companies.filter(c=>c!==a&&c.sector===a.sector);
    queue({title:`Merge Into ${a.name}`,body:'Fold another company in this sector into it. Combined EBITDA earns a bigger size premium, and 2+ merged companies get a platform premium.',
      choices:others.map(b=>({label:b.name,sub:`EBITDA ${fm(b.ebitda)} · debt ${fm(b.debt)}`,fn:()=>mergeCos(a,b)})).concat([{label:'Cancel'}])});},
  bill:x=>{if(S.influence<1||S.laws[x])return;S.influence--;S.bills[x]++;if(S.bills[x]>=8){S.laws[x]=true;log(`${LAWS[x].n} signed into law.`,'good');news(`Congress passes the ${LAWS[x].n}. ${S.firm} lobbyists celebrate.`);}},
  endYear:()=>{endYear();},
  closeSel:x=>{const [id,v]=x.split(':');S.closeSel[id]=v;},
  finalize:()=>{finalizeClose();},
  nextFund:()=>{const r=S.raise;if(r.outcome==='fail'){gameOver('Fundraise Failed',`Investors passed on ${FUNDNAMES[S.fund.n]}. ${S.firm} winds down.`);return;}
    r.repealed.forEach(n=>log(`Election: the ${n} was repealed.`,'bad'));startFund(S.fund.n+1,r.size,r.cont);S.raise=null;},
  modal:x=>{const m=Q.shift();const ch=m&&m.choices[+x];if(ch&&ch.fn)ch.fn();},
  newRun:()=>{S=null;}
};
function playCard(hi,c){
  const k=S.hand[hi],C=CARDS[k],cost=cardCost(k);if(cost>S.bw)return;
  if(C.p(c)===false)return;
  if(k==='cut'&&hasConn('mckinsey'))S.mckUsed=true;
  S.bw-=cost;S.hand.splice(hi,1);S.discard.push(k);sel=null;
}
function mergeCos(a,b){
  if(!co(a.id)||!co(b.id))return;
  const tot=a.ebitda+b.ebitda;a.growth=(a.growth*a.ebitda+b.growth*b.ebitda)/tot;a.ebitda=tot;a.debt+=b.debt;a.cost+=b.cost;
  a.platform+=1+b.platform;a.traits=a.traits.concat(b.traits);a.assetValue+=b.assetValue;a.assetKnown=a.assetKnown&&b.assetKnown;
  a.multBonus=Math.max(a.multBonus,b.multBonus);a.inflated=Math.max(a.inflated,b.inflated);a.rateAdj=Math.min(a.rateAdj,b.rateAdj);
  if(!/Holdings$/.test(a.name))a.name=`${a.name.split(' ')[0]} ${a.sector} Holdings`;
  S.companies=S.companies.filter(x=>x!==b);log(`Merged ${b.name} into ${a.name}.`,'good');news(`${S.firm} combines ${b.name} into ${a.name}.`);
}

  return `<div class="panel"><h1>${esc(o.kind)}</h1><p>${esc(o.text)}</p><div class="stats">${stat('Personal fortune',fm(S.personal),'good')}${stat('Funds raised',S.funds.length)}${stat('Reputation',S.rep)}</div>
   ${S.funds.length?`<div class="tablewrap"><table><tr><th>Fund</th><th>Size</th><th>MOIC</th><th>Carry</th></tr>${S.funds.map(f=>`<tr><td>${FUNDNAMES[f.n-1]}</td><td class="n">${fm(f.size)}</td><td class="n">${f.moic.toFixed(2)}×</td><td class="n">${fm(f.carry)}</td></tr>`).join('')}</table></div>`:''}
   <div class="paper"><h2>The Ledger</h2><ul style="margin:0;padding-left:18px">${S.news.slice(0,10).map(n=>`<li>${esc(n)}</li>`).join('')||'<li>Nobody wrote about you. That might be a good thing.</li>'}</ul></div>
   <div class="row">${btn('New run','newRun','',{cls:'primary'})}</div></div>`;
}
function titleHTML(){
  let saved=null,hall=[];
  try{saved=localStorage.getItem(SAVE_KEY);hall=JSON.parse(localStorage.getItem(HALL_KEY)||'[]');}catch(e){}
  return `<div class="panel"><h1>PE Tycoon</h1><p>Raise a fund. Buy companies. Fix them, flip them, or strip them for parts. Three funds, seven years each. Retire rich, or go to prison trying.</p>
   ${saved?`<div class="row">${btn('Continue saved run','continue','',{cls:'primary'})}</div>`:''}
   <label for="firmname" class="small muted">Firm name</label><input type="text" id="firmname" maxlength="40" placeholder="Granite Ridge Capital">
   <h3>Choose your founder</h3><div class="grid2">${Object.keys(FOUNDERS).map(k=>btn(FOUNDERS[k].n,'pickFounder',k,{cls:titleFounder===k?'primary':'',sub:FOUNDERS[k].d})).join('')}</div>
   <div class="row">${btn('Start Fund I ($50M)','start','',{cls:'primary'})}</div>
   <details><summary>How to play</summary><ul class="small" style="padding-left:18px">
    <li>Each fund lasts 7 years. Every year, pick a node on the map: deals, auctions, distressed sales, conferences, retreats, events or exit windows. Year 7 is a boss.</li>
    <li>Before buying, pay for diligence to reveal hidden traits. Lenders fund part of the price; the rest comes from fund cash.</li>
    <li>In operations, spend bandwidth on playbook cards to grow EBITDA, then sell. Merge same-sector companies for a bigger multiple.</li>
    <li>Fund MOIC is (cash + returned + equity value) ÷ fund size. Hit the fundraise target to raise a bigger next fund. Carry pays only above 1.30×.</li>
    <li>Gray and illegal moves pay well but build heat and evidence. Evidence can surface for years.</li>
    <li>Personal money comes from 2% yearly fees and carry. It pays for bribes, conferences and legal defense. Your final score is your personal fortune.</li></ul></details>
   ${hall.length?`<h3>Hall of Firms</h3><div class="tablewrap"><table><tr><th>Firm</th><th>Founder</th><th>Ending</th><th>Fortune</th></tr>${hall.slice(0,10).map(h=>`<tr><td>${esc(h.firm)}</td><td>${esc(h.founder)}</td><td>${esc(h.kind)}</td><td class="n">${fm(h.fortune)}</td></tr>`).join('')}</table></div>`:''}
  </div>`;
}
function logHTML(){
  return `<div class="panel"><div class="row" style="justify-content:space-between"><h2>Deal log</h2>${btn('Quit to title','quit','',{sub:'Progress is saved'})}</div><div class="log">${S.log.slice(0,40).map(l=>`<div class="${l.cls}"><span class="y">${l.y}</span>${esc(l.msg)}</div>`).join('')}</div></div>`;
}
function renderModal(){
  const el=document.getElementById('modal');const m=Q[0];
  if(!m){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  el.innerHTML=`<div class="box" role="dialog" aria-modal="true"><h2>${esc(m.title)}</h2><div>${m.body}</div><div class="choices">${m.choices.map((c,i)=>{const d=typeof c.disabled==='function'?c.disabled():c.disabled;
    return `<button class="btn ${c.cls||''}" data-a="modal" data-x="${i}" ${d?'disabled':''}>${esc(c.label)}${c.sub?`<span class="sub">${esc(c.sub)}</span>`:''}</button>`;}).join('')}</div></div>`;
  const b=el.querySelector('button:not(:disabled)');if(b)b.focus({preventScroll:true});
}
function render(){
  for(let guard=0;guard<10&&!Q.length&&pending;guard++){const p=pending;pending=null;p();}
  if(S&&(sel!==null&&(S.phase!=='ops'||sel>=S.hand.length||CARDS[S.hand[sel]].t!=='co')))sel=null;
  const app=document.getElementById('app');
  if(!S){app.innerHTML=titleHTML()+`<footer>v${VERSION}</footer>`;renderModal();return;}
  let main='';
  switch(S.phase){
    case 'map':main=mapHTML();break;
    case 'node':main=nodeHTML();break;
    case 'buy':main=buyHTML();break;
    case 'ops':main=opsHTML();break;
    case 'close':main=closeHTML();break;
    case 'raise':main=raiseHTML();break;
    case 'over':main=overHTML();break;
  }
  app.innerHTML=(S.phase==='over'?'':statusHTML())+main+(S.phase==='over'?'':logHTML())+`<footer>PE Tycoon v${VERSION}</footer>`;
  levText();renderModal();
  if(!Q.length&&!pending&&S.phase!=='over')save();
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const f=A[b.dataset.a];if(!f)return;
  f(b.dataset.x);render();
});
document.addEventListener('input',e=>{if(e.target.id==='lev')levText();});

function start(d){
  if(d&&d.save){try{S=JSON.parse(d.save);}catch(e){S=null;}}
  render();
}
window.claude?.hot?.snapshot?.(()=>({save:S&&!Q.length?JSON.stringify(S):null}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
</html>
