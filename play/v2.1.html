<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>PE Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: a phone-width board game. Sticky HUD on top, the current screen in the middle, the hand tray and four tabs fixed at the bottom. Chunky ink outlines, offset shadows and bright game-piece colors, one look on purpose. */
:root{
  --board:#2f8f83; --board-dk:#24716a; --ink:#24180f; --paper:#fff8e6; --paper-2:#f6ead0;
  --sun:#ffd84a; --mint:#8fe3c6; --lime:#c4eb7a; --coral:#ff8a72; --pink:#ffb8dc; --sky:#a9c8ff; --lilac:#c9b2ff; --grape:#7a3fd0;
  --good:#1a7f45; --bad:#c42f18; --warn:#a86200; --muted:#6b5a3a;
  --display:"Lilita One", "Arial Black", Impact, sans-serif;
  --body:"Nunito", "Trebuchet MS", system-ui, sans-serif;
  --tray-h:236px; --tabs-h:62px;
  color-scheme:light;
}
html,body{background:var(--board);color:var(--ink)}
body{font-family:var(--body);font-size:14px;line-height:1.4;font-weight:600;
  background-color:var(--board);background-image:radial-gradient(rgb(255 255 255/.07) 1.5px,transparent 1.5px);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sun)}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance}
h2{font-size:19px;display:flex;align-items:center;gap:6px} h3{font-size:15px}
p{margin:0} ul{margin:0;padding-left:18px}
.small{font-size:12px} .muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.mono{font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center} .row.tight{gap:5px} .between{justify-content:space-between}
.ic{width:20px;height:20px;flex:none}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.main{display:flex;flex-direction:column;gap:12px;padding-block:12px calc(var(--tabs-h) + 24px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.has-tray .main{padding-bottom:calc(var(--tray-h) + var(--tabs-h) + 24px + env(safe-area-inset-bottom,0px))}
footer{font-size:11px;color:var(--paper);opacity:.7;text-align:center}

/* panels & buttons */
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{font:inherit;font-weight:800;color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:9px 12px;cursor:pointer;text-align:left;display:inline-flex;flex-direction:column;justify-content:center;gap:1px;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible,.tab:focus-visible,g[data-a]:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.btn .sub{font-size:11.5px;font-weight:600;opacity:.85}
.btn.primary{background:var(--sun)} .btn.gray{background:#ffe1a6} .btn.illegal{background:var(--coral)} .btn.danger{background:var(--coral)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline}
.btn.sm{padding:5px 9px;font-size:12px;flex-direction:row;align-items:center;gap:4px} .btn.sm .ic{width:15px;height:15px}
.btn.wide{width:100%;text-align:center;align-items:center;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.02em}
.btn.round{width:44px;height:44px;border-radius:50%;padding:0;align-items:center;font-family:var(--display);font-size:24px;font-weight:400;flex:none}
.acts{display:flex;flex-direction:column;gap:8px}
.pill{font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--paper-2);border:2px solid var(--ink);white-space:nowrap;display:inline-block}
.pill.Safe{background:var(--mint)} .pill.Risky{background:var(--sun)} .pill.Danger{background:var(--coral)} .pill.out{opacity:.4;text-decoration:line-through}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px} td,th{padding:5px 6px;border-bottom:2px dashed rgb(36 24 15/.2);text-align:left} .n{text-align:right;font-variant-numeric:tabular-nums}
details{border-top:2px dashed rgb(36 24 15/.2);padding-top:6px} details summary{cursor:pointer;font-weight:800}
input[type=text]{font:inherit;padding:10px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);width:100%}
.hint{background:var(--sky);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.hint-t{font-family:var(--display);font-weight:400;font-size:15px}

/* HUD */
.hud{position:relative;z-index:20;background:var(--sun);border-bottom:3px solid var(--ink);padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.hud-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.firm{font-family:var(--display);font-size:19px;line-height:1.05;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11px;font-weight:800;white-space:nowrap;background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:1px 8px}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.chip{font:inherit;color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:10px;box-shadow:0 2px 0 var(--ink);padding:2px 5px 3px;display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;min-width:0;overflow:hidden}
.chip .ck{font-size:8.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:800;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip .cv{font-family:var(--display);font-size:15px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.good .cv{color:var(--good)} .chip.bad .cv{color:var(--bad)} .chip.warn .cv{color:var(--warn)}
.relics{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted)}
.relic{flex:none;width:30px;height:30px;border-radius:50%;background:var(--lilac);border:2.5px solid var(--ink);box-shadow:0 2px 0 var(--ink);display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.relic .ic{width:17px;height:17px}
.hotcold{margin-left:auto;font-size:11px;white-space:nowrap}

/* tabs & tray */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto}
.tab{position:relative;font:inherit;font-weight:800;font-size:11px;color:var(--paper);background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;border-radius:10px}
.tab.on{color:var(--ink);background:var(--sun)}
.tab .dot{position:absolute;top:2px;right:calc(50% - 18px);width:11px;height:11px;border-radius:50%;background:var(--coral);border:2px solid var(--ink)}
.tray{position:fixed;left:0;right:0;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px));z-index:24;max-width:560px;margin:0 auto;background:var(--board-dk);border-top:3px solid var(--ink);padding:8px 0 10px;display:flex;flex-direction:column;gap:8px}
.tray-head{display:flex;gap:8px;align-items:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));color:var(--paper)}
.tray-head .end{margin-left:auto;padding:7px 14px;font-family:var(--display);font-weight:400;font-size:16px}
.bw{width:46px;height:46px;border-radius:50%;background:var(--grape);color:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;line-height:1;flex:none}
.bw small{font-family:var(--body);font-size:8px;font-weight:800;text-transform:uppercase}
.selbar{margin:0 12px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;max-height:45vh;overflow:auto}
.hand{display:flex;gap:9px;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));scroll-snap-type:x proximity}
.hand.wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px;overflow:visible;padding:12px 2px 4px}
.hand.wrap .card{width:100%;min-height:150px;padding:12px 5px 8px}
.hand.wrap .card .nm{font-size:12.5px} .hand.wrap .card .tx{font-size:10px} .hand.wrap .card .art{width:40px;height:34px}
.hand.wrap .card .cost.price{right:-4px;font-size:10px}
/* compact hand in the tray: name, type and a three-line effect */
.tray .card{width:98px;min-height:0;padding:10px 6px 7px;gap:3px}
.tray .card .art{width:36px;height:30px;border-radius:8px} .tray .card .art .ic{width:18px;height:18px}
.tray .card .nm{font-size:12.5px} .tray .card .ty{font-size:8px}
.tray .card .tx{font-size:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tray .card .cost{width:24px;min-width:24px;height:24px;font-size:13px;top:-7px;left:-7px}
.tray.min .hand,.tray.picking .hand{display:none}
.selbar .sel-hint{font-size:12px}
.hand .empty{color:var(--paper)}

/* cards */
.card{position:relative;flex:none;width:112px;min-height:160px;font:inherit;color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:10px 7px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;scroll-snap-align:start;touch-action:pan-x;transition:transform .12s;user-select:none;-webkit-user-select:none}
.card:disabled{cursor:default}
.tray .card:disabled{opacity:.55}
.card.t-ops{background:var(--sun)} .card.t-fin{background:var(--mint)} .card.t-pr{background:var(--pink)} .card.t-pol{background:var(--sky)} .card.t-shady{background:var(--coral)}
.card.sel{transform:translateY(-10px) rotate(-2deg);box-shadow:0 9px 0 var(--ink)}
.card.tier-illegal{background-image:repeating-linear-gradient(-45deg,transparent 0 9px,rgb(36 24 15/.08) 9px 12px)}
.card .cost{position:absolute;top:-9px;left:-9px;min-width:28px;height:28px;padding:0 4px;border-radius:99px;background:var(--grape);color:#fff;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:15px}
.card .cost.price{font-family:var(--body);font-size:10.5px;font-weight:800;left:auto;right:-6px}
.card .art{width:46px;height:40px;border-radius:10px;background:var(--paper);border:2.5px solid var(--ink);display:grid;place-items:center}
.card .art .ic{width:24px;height:24px}
.card .nm{font-family:var(--display);font-size:13.5px;line-height:1.05}
.card .ty{font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.card .tx{font-size:10.5px;line-height:1.25;font-weight:700}
.stackwrap{position:relative;min-width:0} .stackwrap .count{position:absolute;bottom:-6px;right:-6px;background:var(--ink);color:var(--paper);border-radius:99px;padding:1px 7px;font-size:11px;font-weight:800}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;opacity:.92}
.ghost .card{box-shadow:0 14px 0 rgb(36 24 15/.5)}

/* company sheets */
.sheet{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.sheet.target{border-style:dashed} .sheet.dropping{background:var(--sun);transform:scale(1.01)}
.sh-head{display:flex;gap:10px;align-items:center}
.sh-head h3{font-size:17px;line-height:1.1}
.sec-ic{width:40px;height:40px;border-radius:12px;background:var(--lilac);border:2.5px solid var(--ink);display:grid;place-items:center;flex:none}
.sec-ic.sm{width:30px;height:30px;border-radius:9px} .sec-ic.sm .ic{width:16px;height:16px}
.stamp{font-family:var(--display);font-size:13px;padding:3px 9px;border:2.5px solid var(--ink);border-radius:8px;transform:rotate(4deg);flex:none}
.stamp.h-Failing{background:var(--coral)} .stamp.h-Steady{background:var(--sky)} .stamp.h-Thriving{background:var(--lime)}
.kvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kv{font:inherit;color:var(--ink);text-align:left;background:var(--paper-2);border:2px solid var(--ink);border-radius:10px;padding:4px 7px;display:flex;flex-direction:column;min-width:0;cursor:pointer}
div.kv{cursor:default}
.kv .ck{font-size:9px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv .cv{font-family:var(--display);font-size:16px;line-height:1.15;font-variant-numeric:tabular-nums}
.spark{width:100%;height:38px;display:block}
.gauge{display:flex;flex-direction:column;gap:4px}
.gl{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.lnk{font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-align:left;display:inline-flex;gap:5px;align-items:center}
.gbar{position:relative;height:14px;border:2.5px solid var(--ink);border-radius:99px;background:var(--paper-2);overflow:hidden}
.gbar i{position:absolute;inset:0 auto 0 0;border-right:2.5px solid var(--ink)}
.gbar i.Safe{background:var(--mint)} .gbar i.Risky{background:var(--sun)} .gbar i.Danger{background:var(--coral)}
.gmark{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ink)}
.traits{display:flex;flex-wrap:wrap;gap:5px}
.trait{font:inherit;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;border:2px solid var(--ink);cursor:pointer;color:var(--ink)}
.trait.good{background:var(--mint)} .trait.bad{background:var(--coral)}
.preview{background:var(--paper-2);border:2px dashed var(--ink);border-radius:12px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.preview b{font-variant-numeric:tabular-nums}
.minis{display:flex;flex-direction:column;gap:6px}
.mini{display:flex;gap:8px;align-items:center;font:inherit;color:var(--ink);background:none;border:0;padding:0;text-align:left;cursor:default}
button.mini{cursor:pointer}
.mini b{font-size:13px}

/* screens */
.screen-title{display:flex;align-items:center;gap:8px;color:var(--paper);font-family:var(--display);font-size:22px;text-shadow:0 2px 0 var(--ink)}
.screen-title .ic{width:26px;height:26px}
.board{background:var(--board-dk);color:var(--paper)}
.board h2{color:var(--paper)}
.map{width:100%;height:auto;display:block}
.map .edge{stroke:rgb(255 248 230/.35);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round}
.map .edge.taken{stroke:var(--sun);stroke-dasharray:none;stroke-width:5}
.map .node circle:first-child,.map .node rect:first-child{stroke:var(--ink);stroke-width:3}
.map .node.gone{opacity:.35} .map .node.done circle:first-child{stroke:var(--sun);stroke-width:4}
.map .node.can{cursor:pointer}
.map .ring{fill:none;stroke:var(--sun);stroke-width:3;stroke-dasharray:5 4;animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.map .nl{font-family:var(--body);font-size:10.5px;font-weight:800;fill:var(--paper);text-anchor:middle}
.map .yr{font-family:var(--display);font-size:13px;fill:var(--paper)}
.map .mood{font-family:var(--body);font-size:10px;font-weight:800;fill:rgb(255 248 230/.75)}
.map .mood.good{fill:var(--lime)} .map .mood.bad{fill:var(--coral)} .map .mood.warn{fill:var(--sun)}
.map .bt{font-family:var(--body);font-size:9px;font-weight:800;fill:var(--ink);text-anchor:middle;letter-spacing:.08em}
.map .bn{font-family:var(--display);font-size:15px;fill:var(--ink);text-anchor:middle}
.bossbox{background:var(--coral);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:12px}
.bossbox b{font-family:var(--display);font-weight:400;font-size:15px}
.legend{color:var(--paper);display:flex;flex-direction:column;gap:2px}
.sticky-go{background:transparent;border:0;box-shadow:none;padding:0}
.arena{background:var(--paper)}
.meter{display:flex;flex-direction:column;gap:4px}
.mbar{position:relative;height:20px;border:3px solid var(--ink);border-radius:99px;background:var(--paper-2);overflow:hidden}
.mbar i{position:absolute;inset:0 auto 0 0;background:var(--coral);border-right:3px solid var(--ink);transition:width .4s}
.mbar.thin{height:10px;border-width:2px} .mbar.thin i{background:var(--grape);border-right-width:2px}
.mbar.heat i{background:linear-gradient(90deg,var(--sun),var(--coral))}
.mbar .half{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:3px solid var(--ink)}
.mbar .tick{position:absolute;top:0;bottom:0;border-left:2px dashed var(--ink)}
.intent{background:var(--sun);border:3px solid var(--ink);border-radius:14px;padding:9px 11px;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.iq{font-family:var(--display);font-size:16px;line-height:1.2}
.bigline{display:flex;align-items:baseline;gap:10px}.bigline span{font-family:var(--display);font-size:30px}.bigline small{font-weight:800}
.log{font-size:12px;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.log.big{max-height:none}
.log .y{font-weight:800;color:var(--muted);margin-right:6px;font-size:10.5px}
.bill{display:flex;gap:8px;align-items:center;border-top:2px dashed rgb(36 24 15/.2);padding-top:8px}
.verdict{font-family:var(--display);font-size:18px;border:3px solid var(--ink);border-radius:14px;padding:10px 12px}
.verdict.good{background:var(--lime);color:var(--ink)} .verdict.warn{background:var(--sun);color:var(--ink)} .verdict.bad{background:var(--coral);color:var(--ink)}
.paper{background:#fffdf6;border:3px solid var(--ink);border-radius:6px;box-shadow:0 5px 0 var(--ink);padding:12px;transform:rotate(-.6deg)}
.paper .mast{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:26px;text-align:center;border-bottom:3px double var(--ink);padding-bottom:4px;margin-bottom:8px;letter-spacing:.02em}
.paper li{font-family:Georgia,"Times New Roman",serif;font-weight:400;margin-bottom:4px}
.report{display:flex;flex-direction:column;gap:3px;font-size:13px;margin-top:8px}
.over{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px}
.over-k{font-family:var(--display);font-size:38px;line-height:1;color:var(--grape)}

/* title */
.title-mode .main,.title-mode{padding-top:0}
.app.title-mode{padding-block:20px 40px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));gap:14px}
.title{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 6px;text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.85;transform:rotate(-3deg)}
.logo span{font-family:var(--display);color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.logo span:first-child{font-size:64px} .logo span:last-child{font-size:58px;color:var(--paper)}
.tag{color:var(--paper);max-width:34ch;font-weight:700}
.founders{display:grid;grid-template-columns:1fr;gap:8px}
.founder{font:inherit;color:var(--ink);text-align:left;background:var(--paper-2);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:10px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;cursor:pointer}
.founder .sec-ic{grid-row:span 2}
.founder.on{background:var(--sun)}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgb(36 24 15/.6);display:flex;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#modal[hidden]{display:none!important}
#modal .box{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;max-width:536px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;animation:pop .18s ease-out}
#modal h2{font-size:22px}
#modal .choices{display:flex;flex-direction:column;gap:8px}
@keyframes pop{from{transform:translateY(16px) scale(.98);opacity:.6}}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.float{position:fixed;transform:translate(-50%,-4px);font-family:var(--display);font-size:16px;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;animation:rise 1.1s ease-out forwards;white-space:nowrap}
.float.up{color:var(--lime)} .float.down{color:var(--coral)}
@keyframes rise{to{transform:translate(-50%,-40px);opacity:0}}
.stampfx{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-8deg);background:var(--lime);border:4px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink);padding:10px 22px;display:flex;flex-direction:column;align-items:center;animation:stamp 1.3s ease-out forwards}
.stampfx.bad{background:var(--coral)}
.stampfx b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1}
.stampfx span{font-weight:800;font-size:13px}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-8deg) scale(2);opacity:0}15%{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.float,.stampfx{display:none}}
</style>

<body>
<div id="app" class="app"></div>
<div id="modal" hidden></div>
<div id="fx" aria-hidden="true"></div>

<script>
'use strict';
const VERSION = '2.1';
const SAVE_KEY = 'pe_tycoon_save_v20';
const HALL_KEY = 'pe_tycoon_hall';

/* ---------- state ---------- */
let S = null;          // game state (serializable)
let Q = [];            // modal queue (transient)
let pending = null;    // continuation to run once the modal queue empties
let sel = null;        // selected hand index
let PREVIEW = false;   // true while simulating a card for its preview
let titleFounder = 'banker';

/* ---------- rng & helpers ---------- */
function rand(){if(PREVIEW)return 0.5;S.rs=(S.rs+0x6D2B79F5)|0;let t=S.rs;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
const rf=(a,b)=>a+(b-a)*rand();
const ri=(a,b)=>Math.floor(rf(a,b+1));
const pick=a=>a[Math.floor(rand()*a.length)];
const chance=p=>rand()<p;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function wpick(o){let t=0;for(const k in o)t+=o[k];let r=rand()*t;for(const k in o){r-=o[k];if(r<0)return k;}return Object.keys(o)[0];}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function fm(x){const n=Math.abs(x),s=x<0?'−':'';if(n>=1000)return s+'$'+(n/1000).toFixed(2)+'B';if(n>=100)return s+'$'+n.toFixed(0)+'M';return s+'$'+n.toFixed(1)+'M';}
const pct=x=>(x>=0?'+':'−')+Math.abs(x*100).toFixed(1)+'%';
const sc=()=>S.fund.size/50;
const calYear=()=>2026+(S.fund.n-1)*7+S.year;
const FUNDNAMES=['Fund I','Fund II','Fund III'];
const T=(label,real)=>`${label}<span class="term">${real}</span>`;

/* ---------- data ---------- */
const SECTORS={
  'Dental':{mult:9,suf:['Dental Partners','Smile Group','Family Dentistry']},
  'Laundromats':{mult:5,suf:['Suds Co.','Wash & Fold','Laundry Centers']},
  'HVAC':{mult:7,suf:['Heating & Air','Comfort Systems','Climate Services']},
  'Software':{mult:12,suf:['Logic','Cloudworks','Data Systems']},
  'Restaurants':{mult:6,suf:['Diner Group','Burger Co.','Pizza Kitchens']},
  'Trucking':{mult:5,suf:['Freight','Haulers','Logistics']},
  'Pet Care':{mult:10,suf:['Pet Resorts','Animal Hospitals','Grooming Co.']},
  'Manufacturing':{mult:6,suf:['Fasteners','Tool & Die','Plastics']}
};
const PREFIX=['Midwest','Summit','Blue Ridge','Lakeside','Ironwood','Sunbelt','Pioneer','Harbor','Copperline','Prairie','Northstar','Bayou','Redwood','Keystone','Cedar Valley','Gulf Coast','Twin Rivers','Old Mill','High Plains','Silver Creek','Granite','Bluewater','Foxhollow','Tri-County'];

const TRAITS={
  cooked:{n:'Cooked Books',bad:true,d:'Reported profit is about 25% inflated.'},
  lawsuit:{n:'Pending Lawsuit',bad:true,d:'A settlement of about 1.5× yearly profit lands in year 2.'},
  keyperson:{n:'Key-Person Risk',bad:true,d:'The founder runs everything. Replacing the CEO backfires, and they may quit.'},
  concentration:{n:'Customer Concentration',bad:true,d:'One customer is a quarter of sales and may leave.'},
  union:{n:'Union Trouble',bad:true,d:'Cost cuts and layoffs trigger strikes.'},
  maintenance:{n:'Deferred Maintenance',bad:true,d:'About 1× yearly profit of surprise repairs in year 1.'},
  realestate:{n:'Hidden Real Estate',bad:false,d:'Owns valuable property. Breakups and sale-leasebacks pay more.'},
  pricing:{n:'Pricing Power',bad:false,d:'Customers tolerate price hikes. Raise Prices is doubled.'},
  patent:{n:'Unused Patent',bad:false,d:'May license for a cash windfall.'},
  loyal:{n:'Loyal Customers',bad:false,d:'Grows about 2% faster than the numbers show.'},
  bloated:{n:'Bloated Costs',bad:false,d:'Fat to trim. Cut Costs is doubled.'},
  founder:{n:'Motivated Seller',bad:false,d:'The founder wants out. Price drops 12% once you know.'}
};

const RIVALS=[
  {name:'Kestrel Partners',bias:0.12,loves:null},
  {name:'Monolith Capital',bias:0,loves:'Manufacturing'},
  {name:'Vantablack Growth',bias:0.04,loves:'Software'}
];

const FOUNDERS={
  banker:{n:'Ex-Investment Banker',lev:5,bw:3,op:0.8,rate:-0.005,conn:'insider',
    deck:['cut','cut','raise','recap','refi','paydown','consult','network','slb'],
    d:'Banks lend you up to 5× a company’s yearly profit, at 0.5% less interest. Starts with the Auction Insider. Operational cards are 20% weaker. 3 actions a year.'},
  operator:{n:'Former Operator',lev:3.5,bw:4,op:1.25,rate:0,conn:'guru',
    deck:['cut','cut','raise','raise','ceo','overhaul','consult','network','pivot'],
    d:'Operational cards are 25% stronger and you get 4 actions a year. Starts with the Turnaround Guru. Banks lend at most 3.5× yearly profit.'}
};

const CONNS={
  banker:{n:'Friendly Banker',d:'Banks lend 1× yearly profit more on every deal.'},
  golf:{n:"Senator's Golf Buddy",d:'The first investigation each fund is quietly dropped.'},
  mckinsey:{n:'Ex-Consultant Associate',d:'Your first Cut Costs each year costs 0 actions.'},
  whisper:{n:'Pension Fund Whisperer',d:'Fundraising targets are 15% lower.'},
  barbarians:{n:'Dog-Eared "Barbarians at the Gate"',d:'Each diligence round reveals 2 traits.'},
  prfirm:{n:'PR Firm on Retainer',d:'The first reporter each fund is handled for free.'},
  cayman:{n:'Cayman Lawyer',d:'Your bonus +25%. Heat +3 every year.'},
  insider:{n:'Auction Insider',d:"See roughly where the top rival will walk away in auctions and takeover fights."},
  guru:{n:'Turnaround Guru',d:'Shrinking companies you buy get +4% growth.'},
  rolodex:{n:'Rolodex of CFOs',d:'Draw 1 extra card each year.'},
  dog:{n:'Office Dog',d:'Reputation +1 every year.'},
  vulture:{n:'Distressed Debt Desk',d:'Distressed deals are 10% cheaper.'},
  shredder:{n:'Shredder Pro 3000',d:'Evidence goes cold 2 years sooner.'},
  hype:{n:'Hype Machine',d:'Strategic sales in the hot sector pay 10% more.'},
  club:{n:'Club Membership',d:'Conference prices −20% and one extra card on offer.'},
  second:{n:'Second Chair',d:'+1 action every year.'}
};

const LAWS={
  loophole:{n:'Carried Interest Loophole',d:'Your bonus is taxed like a capital gain. Bonus ×1.5.'},
  interest:{n:'Interest Deduction Expansion',d:'Interest costs −30% at every company.'},
  antitrust:{n:'Antitrust Relaxation',d:'Antitrust reviews clear automatically. Platform premium doubles.'}
};

const OFF_NAMES=['Dale Pruitt','Anne Holloway','Wade Kimball','Rita Vasquez','Hugh Barnaby','Lorraine Cobb','Gus Feeney','Priya Natarajan','Bo Whitlock','Marjorie Tull','Felix Ortega','Constance Reed'];
const OFF_TRAITS={
  greedy:{n:'Greedy',d:'Takes the money and delivers.'},
  unreliable:{n:'Unreliable',d:'Takes the money. Delivers nothing.'},
  bought:{n:'Already Bought',d:'Works for a rival firm.'},
  honest:{n:'Honest',d:'Will report you.'},
  sting:{n:'Wired',d:'Cooperating with prosecutors.'},
  escalator:{n:'Escalator',d:'Delivers, then keeps asking for more.'}
};

/* ---------- small state helpers ---------- */
const hasConn=k=>S.conns.includes(k);
const has=(c,k)=>c.traits.some(t=>t.k===k);
function trig(c,k){const t=c.traits.find(t=>t.k===k);if(t)t.rev=true;return !!t;}
function dropTrait(c,k){c.traits=c.traits.filter(t=>t.k!==k);}
const OPM=()=>FOUNDERS[S.founder].op;
function rep(d){S.rep=clamp(S.rep+d,0,100);}
function heat(d){S.heat=clamp(S.heat+d,0,100);}
function log(msg,cls){S.log.unshift({y:`${FUNDNAMES[S.fund.n-1]} Y${S.year}`,msg,cls:cls||''});if(S.log.length>80)S.log.length=80;}
function news(s){S.news.unshift(`${calYear()}: ${s}`);}
const co=id=>S.companies.find(c=>c.id===id);
const bribeCost=()=>0.8*sc();
function levCap(){return FOUNDERS[S.founder].lev+(hasConn('banker')?1:0);}
function avgLoad(){const cs=S.companies.filter(c=>c.ebitda>0);if(!cs.length)return 0;return cs.reduce((s,c)=>s+c.debt,0)/cs.reduce((s,c)=>s+c.ebitda,0);}

/* ---------- reputation, heat, economy ---------- */
const REP_TIERS=[
  {min:85,n:'Legendary',price:-0.10,d:'Sellers give you 10% off and offer you private deals.'},
  {min:65,n:'Respected',price:-0.05,d:'Sellers give you 5% off and offer you private deals.'},
  {min:45,n:'Known',price:0,d:'No special treatment.'},
  {min:25,n:'Shady',price:0.05,d:'Sellers charge you 5% more.'},
  {min:0,n:'Toxic',price:0.10,d:'Sellers charge you 10% more and auction houses won’t let you in.'}
];
const repTier=()=>REP_TIERS.find(t=>S.rep>=t.min);
const HEAT_TIERS=[
  {min:90,n:'Raid',d:'At year end the authorities raid your office: fund cash frozen for a year, every piece of evidence rolls at 50%. Jail risk ×2.8.'},
  {min:60,n:'Under watch',d:'A regulator audits you every year: a fine and one fewer action next year. Plus a reporter every year. Jail risk ×2.2.'},
  {min:30,n:'Reporters circling',d:'Every year a reporter digs up your most dangerous evidence. Jail risk ×1.6.'},
  {min:0,n:'Quiet',d:'Nobody is looking. Jail risk ×1.'}
];
const heatTier=()=>HEAT_TIERS.find(t=>S.heat>=t.min);
const SEV={1:{n:'minor',p:0.04,life:3},2:{n:'serious',p:0.07,life:5},3:{n:'severe',p:0.11,life:8}};
function evLife(e){return Math.max(1,SEV[e.sev].life-(hasConn('shredder')?2:0));}
function evChance(e){return e.hold?0:Math.min(0.95,SEV[e.sev].p+S.heat/200);}
const JAIL={1:0.005,2:0.015,3:0.03};
function jailChance(sev){return JAIL[sev||2]*(1+S.heat/50);}
const jailPct=sev=>(Math.round(jailChance(sev)*1000)/10)+'%';
// every illegal act rolls for jail on the spot
function jailRoll(crime,sev){
  if(PREVIEW||S.phase==='over')return false;
  if(chance(jailChance(sev))){news(`${S.firm} founder arrested for ${crime}.`);gameOver('Arrested',`You were caught in the act: ${crime}. The judge was not impressed.`);return true;}
  return false;
}
function addEvidence(crime,sev){
  sev=sev||2;
  if(PREVIEW){S.evidence.push({id:0,crime,sev,age:0});return;}
  if(jailRoll(crime,sev))return;
  S.evidence.push({id:S.uid++,crime,sev,age:0});
}
function moodOf(m){
  if(m<0.85)return {n:'Cold',cls:'bad'};if(m<0.95)return {n:'Cool',cls:'warn'};if(m<1.05)return {n:'Normal',cls:''};if(m<1.15)return {n:'Warm',cls:'good'};return {n:'Hot',cls:'good'};
}
function genEconomy(){
  const ph=rf(0,6.28);S.mktPlan=[];S.ratePlan=[];
  for(let y=0;y<9;y++){const m=clamp(1+0.2*Math.sin(ph+y*0.95)+rf(-0.04,0.04),0.72,1.28);S.mktPlan.push(m);S.ratePlan.push(clamp(0.075-0.08*(m-1)+rf(-0.004,0.004),0.03,0.13));}
  S.mktShift=0;S.rateShift=0;applyEconomy();
}
function applyEconomy(){S.mkt=clamp(S.mktPlan[S.year-1]+S.mktShift,0.5,1.5);S.rate=clamp(S.ratePlan[S.year-1]+S.rateShift,0.02,0.16);}
function forecast(dy){const y=S.year-1+dy;if(y>8)return null;const f=Math.pow(0.5,dy);return {m:clamp(S.mktPlan[y]+S.mktShift*f,0.5,1.5),r:clamp(S.ratePlan[y]+S.rateShift*f,0.02,0.16)};}
function loadPremium(l){return l<=2?-0.01:l<=3?0:l<=4?0.01:l<=5?0.025:l<=6?0.04:0.06;}

/* ---------- valuation ---------- */
function health(c){return c.growth<0?'Failing':c.growth>=0.08?'Thriving':'Steady';}
function mult(c){
  let m=SECTORS[c.sector].mult*S.mkt;
  if(c.sector===S.hot)m*=1.25; if(c.sector===S.cold)m*=0.8;
  const h=health(c); if(h==='Failing')m*=0.65; else if(h==='Thriving')m*=1.2;
  m+=1.5*Math.log10(Math.max(c.ebitda,0.5));
  m+=c.multBonus;
  if(c.platform>=2)m+=S.laws.antitrust?2:1;
  return Math.max(2,m);
}
function value(c){return Math.max(0,c.ebitda)*mult(c)*(1+(c.inflated||0));}
function equity(c){return Math.max(0,value(c)-c.debt);}
function nav(){return S.companies.reduce((s,c)=>s+equity(c),0);}
function fundMoic(){const f=S.fund;return (f.cash+f.dist+nav())/f.size;}
function largest(){return S.companies.slice().sort((a,b)=>value(b)-value(a))[0]||null;}
function compRate(c,debt){const d=debt===undefined?c.debt:debt;const l=c.ebitda>0?d/c.ebitda:99;return Math.max(0.02,S.rate+loadPremium(l)+c.rateAdj+FOUNDERS[S.founder].rate)*(S.laws.interest?0.7:1);}
// chance the bank takes this company next year (debt above 7x profit), by quick simulation
function riskOf(c,debt){
  const d0=debt===undefined?c.debt:debt;if(d0<=0||c.ebitda<=0)return d0>0?1:0;
  const rate=compRate(c,d0),known=k=>c.traits.some(t=>t.rev&&t.k===k);let hits=0;const N=240;
  for(let i=0;i<N;i++){
    let e=c.ebitda*(1+c.growth+(Math.random()*0.06-0.03)*(c.growth<0?1.6:1));
    if(Math.random()<0.12)e*=0.85;
    if(known('concentration')&&Math.random()<0.18)e*=0.75;
    let d=d0;const fcf=e*0.65-d*rate;d-=fcf>0?Math.min(d,fcf):fcf;
    if(known('maintenance')&&c.yearsOwned===0)d+=e;
    if(known('lawsuit')&&c.yearsOwned===1)d+=1.5*e;
    if(d/e>lim(c))hits++;
  }
  return hits/N;
}
const lim=c=>7+(c.limit||0);
function riskLabel(p){return p<0.05?{n:'Safe',cls:'Safe'}:p<0.25?{n:'Risky',cls:'Risky'}:{n:'Danger',cls:'Danger'};}

/* ---------- companies ---------- */
function genName(sector){
  for(let i=0;i<30;i++){const n=`${pick(PREFIX)} ${pick(SECTORS[sector].suf)}`;if(!S.usedNames.includes(n)){S.usedNames.push(n);return n;}}
  return `${pick(PREFIX)} ${sector} #${S.uid}`;
}
function genCompany(h,extraBad){
  const sector=pick(Object.keys(SECTORS));
  const g={Failing:[-0.12,-0.03],Steady:[0.01,0.06],Thriving:[0.08,0.16]}[h];
  const e={Failing:[0.012,0.04],Steady:[0.02,0.06],Thriving:[0.02,0.05]}[h];
  const c={id:S.uid++,name:genName(sector),sector,ebitda:S.fund.size*rf(e[0],e[1]),growth:rf(g[0],g[1]),
    multBonus:0,debt:0,rateAdj:0,platform:0,traits:[],assetKnown:false,owned:false,yearsOwned:0,cost:0,
    strategic:false,inflated:0,slb:false,aiwash:0,fakeBid:false};
  const bad=['cooked','lawsuit','keyperson','concentration','union','maintenance'];
  const good=['realestate','pricing','patent','loyal','bloated','founder'];
  const nb={Failing:2,Steady:1,Thriving:chance(0.5)?1:0}[h]+(extraBad||0);
  let ng={Failing:chance(0.5)?1:0,Steady:1,Thriving:1}[h]; if(chance(0.3))ng++;
  shuffle(bad).slice(0,nb).forEach(k=>c.traits.push({k,rev:false}));
  shuffle(good).slice(0,ng).forEach(k=>c.traits.push({k,rev:false}));
  c.traits=shuffle(c.traits);
  const v=value(c);
  c.assetValue=v*({Failing:rf(0.9,1.5),Steady:rf(0.35,0.75),Thriving:rf(0.2,0.45)}[h])+(has(c,'realestate')?v*0.6:0);
  if(has(c,'cooked'))c.ebitda/=0.75;
  return c;
}
function makeOffer(c,kind,premium){if(kind!=='auction')premium*=1+repTier().price;const o={c,kind,premium,price:0,dd:0,ddMax:kind==='auction'?1:9,done:false,disc:false};recalcOffer(o);return o;}
function recalcOffer(o){o.price=value(o.c)*o.premium*(o.disc?0.88:1);}
function revealEffect(o,t){
  if(t.k==='cooked'){o.c.ebitda*=0.75;recalcOffer(o);log(`${o.c.name} restated its profit. New price ${fm(o.price)}.`);}
  if(t.k==='founder'){o.disc=true;recalcOffer(o);log(`The founder of ${o.c.name} cut the price to ${fm(o.price)}.`);}
}
function maxDebt(c,price){return Math.min(levCap()*c.ebitda,0.8*price);}
function canFinance(c,price){return !S.frozen&&price-maxDebt(c,price)<=S.fund.cash+1e-9;}
function ddCost(o){return 0.15*sc()+0.01*o.price;}

/* ---------- cards ---------- */
function strike(c){trig(c,'union');c.ebitda*=0.9;c.growth-=0.01;log(`Workers at ${c.name} walked out. Profit −10%, growth −1%.`,'bad');}
function needCash(x){if(S.frozen){log('Your fund cash is frozen this year.','bad');return false;}if(S.fund.cash<x){log(`Not enough fund cash (${fm(x)} needed).`,'bad');return false;}S.fund.cash-=x;return true;}
function needPersonal(x){if(S.personal<x){log(`Not enough personal money (${fm(x)} needed).`,'bad');return false;}S.personal-=x;return true;}
const CARDS={
  cut:{n:'Cut Costs',c:1,t:'co',r:'common',tier:'legal',d:'Profit +8%. Doubled with Bloated Costs. Union Trouble causes a strike.',
    p:c=>{let g=0.08*OPM();if(trig(c,'bloated'))g*=2;c.ebitda*=1+g;log(`Cut costs at ${c.name}: profit ${pct(g)}.`);if(has(c,'union'))strike(c);}},
  raise:{n:'Raise Prices',c:1,t:'co',r:'common',tier:'legal',d:'Profit +6%. Doubled with Pricing Power.',odds:'25% chance customers leave: growth −1% (not with Pricing Power).',
    p:c=>{let g=0.06*OPM();if(trig(c,'pricing'))g*=2;else if(chance(0.25)){c.growth-=0.01;log(`Some ${c.name} customers left over the price hike. Growth −1%.`,'bad');}c.ebitda*=1+g;log(`Raised prices at ${c.name}: profit ${pct(g)}.`);}},
  ceo:{n:'Replace the CEO',c:2,t:'co',r:'common',tier:'legal',d:'Growth +3% (to at least +2%), profit +3%. Backfires with Key-Person Risk.',
    p:c=>{if(trig(c,'keyperson')){c.ebitda*=0.8;dropTrait(c,'keyperson');log(`The founder of ${c.name} left with the customer list. Profit −20%.`,'bad');return;}
      c.growth=Math.max(c.growth+0.03*OPM(),0.02);c.ebitda*=1.03;log(`New CEO at ${c.name}. Growth now ${pct(c.growth)}.`);}},
  overhaul:{n:'Process Overhaul',c:2,t:'co',r:'common',tier:'legal',d:'Growth +3%.',
    p:c=>{c.growth+=0.03*OPM();log(`Process overhaul at ${c.name}. Growth now ${pct(c.growth)}.`);}},
  consult:{n:'Hire Consultants',c:1,t:'co',r:'common',tier:'legal',d:'Reveal every hidden trait and the breakup value. Profit +3%.',
    p:c=>{c.traits.forEach(t=>t.rev=true);c.assetKnown=true;c.ebitda*=1.03;log(`Consultants finished their deck on ${c.name}. Everything is on the table.`);}},
  recap:{n:'Dividend Recap',c:1,t:'co',r:'common',tier:'gray',d:'Borrow 1.5× yearly profit more and pay it straight out to investors. Reputation −2.',
    p:c=>{const nd=1.5*c.ebitda;if((c.debt+nd)/c.ebitda>levCap()+1.5){log(`Banks refuse to lend ${c.name} any more.`,'bad');return false;}
      c.debt+=nd;S.fund.dist+=nd;rep(-2);log(`Dividend recap at ${c.name}: ${fm(nd)} paid out.`);}},
  slb:{n:'Sale-Leaseback',c:1,t:'co',r:'common',tier:'gray',d:'Sell the property and rent it back: pays out 35% of breakup value. Profit −8%. Once per company.',
    p:c=>{if(c.slb){log(`${c.name} has nothing left to sell and lease back.`,'bad');return false;}

const TYPES={ops:'Operations',fin:'Finance',pr:'PR',pol:'Political',shady:'Shady'};
const CARD_TYPE={cut:'ops',raise:'ops',ceo:'ops',overhaul:'ops',consult:'ops',layoffs:'ops',offshore:'ops',expand:'ops',digital:'ops',pivot:'ops',squeeze:'ops',offsite:'ops',
  recap:'fin',slb:'fin',refi:'fin',addon:'fin',paydown:'fin',cayman:'fin',
  press:'pr',gala:'pr',spin:'pr',greenwash:'pr',aiwash:'pr',

const CARD_SEV={creative:3,insider:2,bribe:2,shred:2,unionbust:1,rig:2,fakebid:2,skim:3,pension:3};
function cardCost(k){if(k==='cut'&&hasConn('mckinsey')&&!S.mckUsed)return 0;return CARDS[k].c;}
function draw(n){for(let i=0;i<n;i++){if(!S.deck.length){S.deck=shuffle(S.discard);S.discard=[];}if(!S.deck.length)break;S.hand.push(S.deck.pop());}}
function addCard(k){S.cards.push(k);S.discard.push(k);}
function removeCard(k){const i=S.cards.indexOf(k);if(i<0)return;S.cards.splice(i,1);for(const pile of [S.deck,S.discard,S.hand]){const j=pile.indexOf(k);if(j>=0){pile.splice(j,1);return;}}}
function draftCards(n,rareOnly){
  const w={common:6,uncommon:3,rare:1};const out=[];
  const keys=Object.keys(CARDS).filter(k=>!rareOnly||CARDS[k].r!=='common');
  for(let t=0;t<60&&out.length<n;t++){const o={};keys.forEach(k=>{if(!out.includes(k))o[k]=w[CARDS[k].r];});out.push(wpick(o));}
  return out;
}
function draftConns(n){return shuffle(Object.keys(CONNS).filter(k=>!S.conns.includes(k))).slice(0,n);}

/* ---------- card preview ---------- */
function snapshotMetrics(c){return {profit:c?c.ebitda:0,growth:c?c.growth:0,value:c?value(c):0,debt:c?c.debt:0,stake:c?equity(c):0,risk:c?riskOf(c):0,
  cash:S.fund.cash,dist:S.fund.dist,personal:S.personal,rep:S.rep,heat:S.heat,inf:S.influence,ev:S.evidence.length,companies:S.companies.length};}
function previewCard(k,cid){
  const S0=S,q0=Q.length,p0=pending;let res;
  try{
    S=JSON.parse(JSON.stringify(S0));PREVIEW=true;
    const c=cid!=null?co(cid):null;if(c)c.traits=c.traits.filter(t=>t.rev);
    const before=snapshotMetrics(c);
    const r=CARDS[k].p(c);
    if(r===false)res={blocked:S.log[0]?S.log[0].msg:'Can’t play this here.'};
    else{const c2=c?co(c.id):null;res={before,after:snapshotMetrics(c2)};}
  }catch(e){res={blocked:'No preview available.'};}
  finally{S=S0;PREVIEW=false;Q.length=q0;pending=p0;}
  return res;
}
function previewHTML(k,cid){
  const r=previewCard(k,cid);const C=CARDS[k];
  if(r.blocked)return `<div class="preview"><span class="bad">${esc(r.blocked)}</span></div>`;
  const b=r.before,a=r.after,L=[];
  const line=(label,x,y,f,goodUp=true)=>{if(Math.abs(y-x)<1e-6)return;const up=y>x;L.push(`<div>${label}: <b>${f(x)}</b> → <b class="${up===goodUp?'good':'bad'}">${f(y)}</b></div>`);};
  if(cid!=null){line('Yearly profit',b.profit,a.profit,fm);line('Growth',b.growth,a.growth,pct);line('Value',b.value,a.value,fm);line('Debt',b.debt,a.debt,fm,false);line('Your stake',b.stake,a.stake,fm);
    if(Math.abs(a.risk-b.risk)>=0.03)line('Chance bank takes it',b.risk,a.risk,x=>Math.round(x*100)+'%',false);}
  line('Fund cash',b.cash,a.cash,fm);line('Paid out',b.dist,a.dist,fm);line('Your money',b.personal,a.personal,fm);
  line('Reputation',b.rep,a.rep,x=>Math.round(x));line('Heat',b.heat,a.heat,x=>Math.round(x),false);line('Influence',b.inf,a.inf,x=>Math.round(x));
  if(a.ev>b.ev)L.push(`<div class="bad">Evidence +${a.ev-b.ev}</div>`);
  if(!L.length)L.push('<div>No visible change.</div>');
  if(C.odds)L.push(`<div class="warn">${C.odds}</div>`);
  if(cid!=null){const c=co(cid);if(c&&c.traits.some(t=>!t.rev))L.push('<div class="muted">Hidden traits could change this.</div>');}
  if(C.tier==='illegal')L.push(`<div class="bad">Jail risk ${jailPct(CARD_SEV[k]||2)} (game over)</div>`);
  return `<div class="preview">${L.join('')}</div>`;
}

/* ---------- modals ---------- */
const queue=m=>{if(!S||S.phase!=='over')Q.push(m);};
const next=m=>{if(!S||S.phase!=='over')Q.unshift(m);};
function info(title,body){return {title,body,choices:[{label:'Continue'}]};}
function cardRewardModal(why){
  const opts=draftCards(3);
  return {title:'Add a Play to Your Playbook',body:`${why} Pick one card for your deck, or skip.`,
    choices:opts.map(k=>({label:CARDS[k].n,sub:`${CARDS[k].c} action${CARDS[k].c===1?'':'s'} · ${CARDS[k].d}`,cls:CARDS[k].tier,fn:()=>{addCard(k);log(`Added ${CARDS[k].n} to your playbook.`);}})).concat([{label:'Skip'}])};
}
function connRewardModal(why){
  const opts=draftConns(3);
  if(!opts.length)return info('Connections','You already know everyone worth knowing.');
  return {title:'You Made a Connection',body:why||'Winning that got you noticed. Choose one.',
    choices:opts.map(k=>({label:CONNS[k].n,sub:CONNS[k].d,fn:()=>{S.conns.push(k);log(`New connection: ${CONNS[k].n}.`,'good');}}))};
}

/* ---------- bribery ---------- */
function genOfficials(){const names=shuffle(OFF_NAMES);return ['Zoning Commissioner','Regulator','Senator'].map((role,i)=>({id:i,name:names[i],role,trait:wpick({greedy:35,unreliable:15,bought:15,honest:15,sting:10,escalator:10}),known:false,demand:false}));}
function bribeModal(o){
  const bc=bribeCost();const offs=S.officials.filter(x=>!o.role||x.role===o.role);const choices=[];
  offs.forEach(of=>{
    if(!of.known)choices.push({label:`Background check on ${of.name}`,sub:`${fm(bc*0.25)} personal · learn what they’re really like`,disabled:()=>S.personal<bc*0.25,
      fn:()=>{S.personal-=bc*0.25;of.known=true;next(bribeModal(o));}});
    choices.push({label:`Pay ${of.name}, ${of.role}`,sub:`${fm(bc)} personal · ${of.known?OFF_TRAITS[of.trait].n+': '+OFF_TRAITS[of.trait].d:'character unknown'}`,cls:'illegal',
      disabled:()=>S.personal<bc,fn:()=>resolveBribe(of,bc,o)});
  });
  choices.push({label:'Back off',fn:()=>{o.onBackoff&&o.onBackoff();}});
  return {title:'Envelope of Cash',body:`${o.purpose}<br><span class="muted small">You have ${fm(S.personal)} of personal money. Every bribe that lands leaves serious evidence.</span>`,choices};
}
function resolveBribe(of,bc,o){
  S.personal-=bc;of.known=true;let msg='';
  switch(of.trait){
    case 'greedy':addEvidence('bribery',2);heat(4);msg=`${of.name} took the envelope and delivered.`;o.onSuccess(of);break;
    case 'escalator':addEvidence('bribery',2);heat(4);of.demand=true;msg=`${of.name} delivered. Then smiled and said, “See you next year.”`;o.onSuccess(of);break;
    case 'unreliable':addEvidence('bribery',2);msg=`${of.name} took the money and did nothing.`;o.onFail&&o.onFail();break;
    case 'bought':if(jailRoll('bribery',2))return;heat(15);S.rivalBoost=true;msg=`${of.name} already works for ${pick(RIVALS).name}. They know your playbook now (rivals bid harder at your next auction). Heat +15.`;o.onFail&&o.onFail();break;
    case 'honest':if(jailRoll('attempted bribery',2))return;heat(20);msg=`${of.name} refused and called a reporter. Heat +20.`;o.onFail&&o.onFail();openCase('attempted bribery',1);break;
    case 'sting':if(jailRoll('bribery, on tape',3))return;heat(25);msg=`${of.name} was wearing a wire. Heat +25.`;o.onFail&&o.onFail();openCase('bribery, on tape',3,3);break;
  }
  if(S.phase==='over')return;
  log(msg,of.trait==='greedy'||of.trait==='escalator'?'warn':'bad');
  next(info('The Envelope',msg));
}
function bribeCard(){
  queue(bribeModal({purpose:'Who gets the envelope? A zoning commissioner fast-tracks permits at your largest company (profit +20%). A regulator makes problems go away (heat −30, one case closed). A senator delivers votes (influence +6).',
    onSuccess:of=>{
      if(of.role==='Zoning Commissioner'){const c=largest();if(c){c.ebitda*=1.2;log(`Permits for ${c.name} came through overnight. Profit +20%.`);}}
      else if(of.role==='Regulator'){heat(-30);const cs=S.cases[0];if(cs)closeCase(cs,'An investigation was quietly closed.');}
      else{S.influence+=6;}
    }}));
}

/* ---------- legal trouble ---------- */
function openCase(crime,stage,sev){
  stage=stage||1;sev=sev||2;
  if(hasConn('golf')&&!S.golfUsed){S.golfUsed=true;log(`A look into ${crime} was quietly dropped. Your golf buddy made a call.`,'good');return;}
  if(stage===1&&hasConn('prfirm')&&!S.prUsed){S.prUsed=true;log(`A reporter asked about ${crime}. Your PR firm buried it.`,'good');return;}
  const cs={id:S.uid++,crime,stage,sev};S.cases.push(cs);queue(caseModal(cs));
}
function closeCase(cs,msg){S.cases=S.cases.filter(x=>x!==cs);if(msg)log(msg,'good');}
// Influence can only delay: the case goes away, the evidence comes back and is safe for one year.
function holdCase(cs){closeCase(cs);S.evidence.push({id:S.uid++,crime:cs.crime,sev:cs.sev||2,age:0,hold:1});log(`The ${cs.crime} story is on hold for a year. The evidence is still out there.`,'warn');}
function caseModal(cs){
  const bc=bribeCost(),sev=cs.sev||2;
  if(cs.stage===1){const fc=favorCost(2);return {title:'A Reporter Is Asking Questions',body:`A journalist is digging into <b>${esc(cs.crime)}</b> (${SEV[sev].n}) at ${esc(S.firm)}.`,choices:[
    {label:'Hire a crisis PR firm',sub:`${fm(0.5*bc)} personal · 60% the story dies`,disabled:()=>S.personal<0.5*bc,fn:()=>{S.personal-=0.5*bc;if(chance(0.6))closeCase(cs,'The story died.');else{cs.stage=2;cs.wait=true;rep(-5);log('The story ran anyway. Reputation −5. Regulators noticed.','bad');}}},
    {label:'Call in a favor',sub:sev>=3?'Too big to bury with favors':`Spend ${fc} influence · the story is held for a year, the evidence stays`,disabled:()=>sev>=3||S.influence<fc,fn:()=>{useFavor(2);holdCase(cs);}},
    {label:'Stonewall',sub:'Heat +10 · 40% it goes away, otherwise regulators next year',fn:()=>{heat(10);if(chance(0.4))closeCase(cs,'The reporter moved on.');else{cs.stage=2;cs.wait=true;rep(-5);}}},
    {label:'Leak dirt on a rival instead',sub:'Gray · reputation −2, minor evidence, story dies',cls:'gray',fn:()=>{rep(-2);addEvidence('leaking confidential information',1);closeCase(cs,`The press got distracted by a scandal at ${pick(RIVALS).name}.`);}}]};}
  if(cs.stage===2){const fc=favorCost(4);return {title:'Regulators Open an Investigation',body:`The Securities Commission has opened a formal investigation into <b>${esc(cs.crime)}</b> (${SEV[sev].n}). Reputation −5.`,choices:[
    {label:'Hire top lawyers',sub:`${fm(1.5*bc)} personal · ${S.lawyered?'guaranteed (retainer)':'55% the case closes'}`,disabled:()=>S.personal<1.5*bc,fn:()=>{rep(-5);S.personal-=1.5*bc;const ok=S.lawyered||chance(0.55);S.lawyered=false;if(ok)closeCase(cs,'Your lawyers buried them in paperwork. Case closed.');else{cs.stage=3;cs.wait=true;log('The investigation is escalating.','bad');}}},
    {label:'Cooperate and pay a fine',sub:`${fm(2*bc+0.15*S.personal)} (15% of your money) · reputation −10 · banned from auctions this fund`,disabled:()=>S.personal<2*bc,fn:()=>{rep(-5);S.personal-=Math.min(S.personal,2*bc+0.15*S.personal);rep(-10);S.auctionBan=true;news(`${S.firm} fined over ${cs.crime}.`);closeCase(cs,'Fine paid. Case closed. Auction houses won’t deal with you this fund.');}},
    {label:'Call in big favors',sub:sev>=3?'Too big to bury with favors':`Spend ${fc} influence · the case is shelved for a year, the evidence stays`,disabled:()=>sev>=3||S.influence<fc,fn:()=>{rep(-5);useFavor(4);holdCase(cs);}},
    {label:'Obstruct',sub:'Illegal · 50% the case collapses, otherwise a subpoena now and severe evidence',cls:'illegal',fn:()=>{rep(-5);if(chance(0.5))closeCase(cs,'Key documents went missing. The case collapsed.');else{addEvidence('obstruction of justice',3);heat(15);if(S.phase==='over')return;cs.stage=3;next(caseModal(cs));}}}]};}
  const fine=4*bc+0.35*S.personal;
  return {title:'Subpoena',body:`Prosecutors are building a criminal case on <b>${esc(cs.crime)}</b>.`,choices:[

/* ---------- bosses ---------- */
// Pitch and Rival are fought with your own playbook: each card acts by its type.
const BOSS_RULES={
  pitch:{ops:'Proof: doubt down. Stronger with high portfolio growth.',fin:'The numbers: doubt down. Stronger with a high return.',pr:'Charm: doubt down. Stronger with good reputation.',pol:'Name-drop: doubt down. Stronger with many connections. Influence +1.',shady:'Lie: doubt −28. Serious evidence, heat +6, jail risk. 20% chance you’re exposed (doubt +30).'},
  duel:{ops:'Fortify: Kestrel buys 25% fewer points this round.',fin:'Buy back shares: Kestrel’s stake −8. Costs fund cash (otherwise −3).',pr:'Win shareholders over: Kestrel’s stake −5.',pol:'Regulator delay: Kestrel buys half as much this round.',shady:'Dirty trick: Kestrel’s stake −12. Serious evidence, heat +8, jail risk.'}
};
function bossDraw(n){const b=S.boss;for(let i=0;i<n;i++){if(!b.deck.length){b.deck=shuffle(b.discard);b.discard=[];}if(!b.deck.length)break;b.hand.push(b.deck.pop());}}
function bossNewRound(){const b=S.boss;b.discard.push(...b.hand);b.hand=[];b.bw=FOUNDERS[S.founder].bw+(hasConn('second')?1:0);b.played=[];bossDraw(5);}
function portGrowth(){const cs=S.companies.filter(c=>c.ebitda>0);if(!cs.length)return 0;const t=cs.reduce((s,c)=>s+c.ebitda,0);return cs.reduce((s,c)=>s+c.growth*c.ebitda,0)/t;}
function pitchDmg(ty){return Math.round({ops:clamp(4+100*portGrowth(),3,22),fin:clamp(4+30*(fundMoic()-1),2,25),pr:4+S.rep/10,pol:5+1.5*S.conns.length,shady:28}[ty]);}
const INTENTS={
  returns:{q:'“Walk us through your returns. Honestly.”',ty:['fin']},
  debt:{q:'“Why is there so much debt in this portfolio?”',ty:['fin']},
  growth:{q:'“Show us you can actually run companies.”',ty:['ops']},
  scandal:{q:'“We keep reading about your firm in the papers.”',ty:['pr']},
  losses:{q:'“What happened to the companies you lost?”',ty:['pr','ops']},
  edge:{q:'“Why you, and not the other hundred firms?”',ty:['pr','pol']}
};
function pickIntent(){
  const b=S.boss,weak={};
  if(fundMoic()<1.3)weak.returns=1;if(avgLoad()>4)weak.debt=1;if(portGrowth()<0.03)weak.growth=1;
  if(S.heat>=30||S.cases.length||S.rep<40)weak.scandal=1;if(S.fund.lost>0)weak.losses=1;
  const o={edge:2,returns:2,growth:2};for(const k in weak)o[k]=(o[k]||0)+4;
  const k=wpick(o);return {k,ty:INTENTS[k].ty,dmg:[18,24,30,36][b.round-1]+(weak[k]?10:0),weak:!!weak[k]};
}
function startPitch(){
  const doubt=Math.round(clamp(80+(1.35-fundMoic())*120+S.heat*0.3+S.cases.length*10-(S.rep-50)*0.4,50,180));
  S.boss={kind:'pitch',doubt,start:doubt,round:1,max:4,deck:shuffle(S.cards),discard:[],hand:[],bw:0,played:[],msgs:[`Investors take their seats. Doubt starts at ${doubt}.`],done:false};
  S.boss.intent=pickIntent();bossNewRound();S.phase='boss';
}
function pitchWin(){const b=S.boss;b.done=true;b.doubt=0;S.pitchScore=0.2;b.msgs.unshift('The room is sold. They’re fighting over allocation.');log('You won the Investor Pitch.','good');queue(connRewardModal('The investors loved you. One of them introduces you to someone useful.'));}
function startDuel(){
  const c=largest();if(!c){queue(info('The Hostile Rival','Kestrel Partners wanted to take over one of your companies. You don’t own any. They go after someone else.'));pending=startOps;S.phase='node';return;}
  const v=value(c);
  S.boss={kind:'duel',coId:c.id,stake:25,chest:v*rf(0.55,0.9),chest0:0,round:1,max:5,pill:false,known:false,bluffed:false,buyMult:1,
    deck:shuffle(S.cards),discard:[],hand:[],bw:0,played:[],msgs:[`Kestrel Partners has quietly bought 25% of ${c.name} and wants control. If they reach 50%, they force a sale at 70% of value.`],done:false};
  S.boss.chest0=S.boss.chest;bossNewRound();S.boss.tell=duelTell();S.phase='boss';
}
function duelTell(){const b=S.boss;if(b.known)return `Kestrel has ${fm(b.chest)} left.`;const r=b.chest/b.chest0;const real=r>0.6?0:r>0.3?1:2;const shown=chance(0.8)?real:ri(0,2);
  return ['Kestrel’s partners look relaxed.','Kestrel is making calls to its lenders.','Kestrel’s partners look nervous.'][shown]+(hasConn('insider')?` Your Auction Insider says about ${fm(b.chest*rf(0.85,1.15))}.`:'');}
function bossCard(i){
  const b=S.boss;if(b.done)return;const k=b.hand[i];if(!k)return;const cost=CARDS[k].c;if(cost>b.bw)return;const ty=CARD_TYPE[k];
  b.bw-=cost;b.hand.splice(i,1);b.discard.push(k);b.played.push(ty);
  if(k==='network'){bossDraw(2);b.msgs.unshift('Networking Lunch: drew 2 cards.');return;}
  if(b.kind==='pitch'){
    let d=pitchDmg(ty);
    if(ty==='pol')S.influence+=1;
    if(ty==='shady'){addEvidence('lying to investors',2);if(S.phase==='over')return;heat(6);if(chance(0.2)){d=-30;b.msgs.unshift(`${CARDS[k].n}: an investor caught the lie. Doubt +30.`);}}
    b.doubt-=d;if(d>0)b.msgs.unshift(`${CARDS[k].n} (${TYPES[ty]}): doubt −${d}.`);
    if(b.doubt<=0)pitchWin();
  } else {
    const c=co(b.coId);if(!c)return;const v=value(c);
    if(ty==='fin'){const x=0.06*v;if(!S.frozen&&S.fund.cash>=x){S.fund.cash-=x;c.cost+=x;b.stake-=8;b.msgs.unshift(`${CARDS[k].n}: bought back shares for ${fm(x)}. Stake −8.`);}else{b.stake-=3;b.msgs.unshift(`${CARDS[k].n}: no cash for a buyback. Stake −3.`);}}
    else if(ty==='ops'){b.buyMult=Math.max(0.2,b.buyMult*0.75);b.msgs.unshift(`${CARDS[k].n}: ${c.name} looks stronger. Kestrel buys 25% less this round.`);}
    else if(ty==='pr'){b.stake-=5;b.msgs.unshift(`${CARDS[k].n}: shareholders warm to you. Stake −5.`);}
    else if(ty==='pol'){b.buyMult=Math.max(0.2,b.buyMult*0.5);b.msgs.unshift(`${CARDS[k].n}: a regulator slows Kestrel down. They buy half as much this round.`);}
    else{addEvidence('market manipulation',2);if(S.phase==='over')return;heat(8);b.stake-=12;b.msgs.unshift(`${CARDS[k].n}: a dirty trick. Stake −12.`);}
    b.stake=Math.max(0,Math.round(b.stake));
  }
}
function bossMove(a){
  const b=S.boss;if(b.done||b.kind!=='duel')return;const c=co(b.coId);if(!c)return;

  if(last){gameOver('Retired',`You closed ${FUNDNAMES[2]} at a ${moic.toFixed(2)}× return and retired to a ranch in Montana.`);return;}
  const target=([1.35,1.45][f.n-1]+S.promise)*(hasConn('whisper')?0.85:1);
  const parts=[['Fund return',moic],['Reputation',(S.rep-50)/200],['Heat',-S.heat/400],['Open cases',-0.08*S.cases.length],['Investor pitch',S.pitchScore],['Golf with investors',S.lpBonus],['Safe hands (no companies lost)',f.lost===0&&f.exits.length+cont.length>0?0.05:0],['Bribed pension manager',S.pensionBribe],['Black Monday panic',-S.bmPenalty],['Investors found evidence',-0.1*S.evidence.filter(()=>chance(0.25)).length]];
  const score=parts.reduce((s,p)=>s+p[1],0);
  let outcome,size;
  if(score>=target){outcome='success';size=f.size*6*Math.pow(Math.min(2,score/target),1.5);}
  else if(score>=0.8*target){outcome='weak';size=f.size*3;}
  else{outcome='fail';size=0;}
  const repealed=[];
  if(f.n>=2)for(const k in S.laws)if(chance(0.25)){delete S.laws[k];S.bills[k]=0;repealed.push(LAWS[k].n);}
  S.raise={moic,carry,parts:parts.filter(p=>p[1]!==0||p[0]==='Fund return'),score,target,outcome,size,cont,repealed};S.phase='raise';
}
function gameOver(kind,text){
  S.phase='over';S.outcome={kind,text};Q=[];pending=null;
  try{const h=JSON.parse(localStorage.getItem(HALL_KEY)||'[]');h.push({firm:S.firm,founder:FOUNDERS[S.founder].n,fortune:S.personal,kind,funds:S.funds.length,date:new Date().toISOString().slice(0,10),v:VERSION});h.sort((a,b)=>b.fortune-a.fortune);localStorage.setItem(HALL_KEY,JSON.stringify(h.slice(0,20)));}catch(e){}
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
}

function explain(k){
  const f=S.fund;const fc=[1,2].map(forecast).filter(Boolean);

  const X={
    cash:['Fund cash','Money your investors gave you that you haven’t spent yet. Use it to buy companies and rescue them. Unspent cash goes back to investors at the end with no profit, so put it to work.'],
    paid:['Paid out','Money already sent back to investors from sales, dividends, recaps and payouts. It counts toward your return and can’t be lost anymore.'],
    ret:['Return',`Everything the fund is worth (fund cash + paid out + your stakes in companies) divided by what investors put in. 1.00× means you broke even. <b>Your bonus starts at 1.30×.</b> Fundraise target for the next fund: <b>${target}</b>.`],
    money:['Your money','Your own fortune: 2% of the fund every year in fees, plus your bonus at the end of each fund. It pays for bribes, conferences, legal defense and fines. <b>Your final score.</b>'],
    rep:['Reputation',`How the industry sees you (0–100). At 0 the run ends. It also counts at every fundraise.${tiers(REP_TIERS,repTier(),t=>t.min+'+')}`],
    heat:['Heat',`How closely the press and the authorities are watching (0–100). It cools by 8 a year. Higher heat makes evidence surface more often.${tiers(HEAT_TIERS,heatTier(),t=>t.min+'+')}`],
    inf:['Influence',`Political favors. Spend it any year in the “Call in a favor” panel: government contracts, tip-offs on deals, better bank terms, fast-tracked auctions, cooling heat. It also gets you out of trouble in events and bosses. Each favor costs 1 more for the rest of the fund (used ${S.favors} so far). It can delay a crime story for a year but never erase the evidence, and it can’t touch severe crimes. From Fund II you can also push laws through Congress. Earn it from lobbyists, donations, golf with senators, Political cards in the Investor Pitch and bribes.`],
    rate:['Bank interest',`The base interest rate banks charge this year: <b>${(S.rate*100).toFixed(1)}%</b>. Each company pays this plus a premium for heavy debt:<div class="tablewrap"><table><tr><th>Debt load</th><th>Extra</th></tr><tr><td>Up to 2×</td><td>−1%</td></tr><tr><td>2–3×</td><td>0</td></tr><tr><td>3–4×</td><td>+1%</td></tr><tr><td>4–5×</td><td>+2.5%</td></tr><tr><td>5–6×</td><td>+4%</td></tr><tr><td>Over 6×</td><td>+6%</td></tr></table></div>Forecast: ${fc.map((x,i)=>`Year ${S.year+i+1}: ${(x.r*100).toFixed(1)}%`).join(' · ')||'end of fund'}. Cheap money usually means a hot market.`],
    mkt:['Market',`How much buyers are paying compared with normal: <b>${moodOf(S.mkt).n}</b>, ${pct(S.mkt-1)} on every price. It moves in a cycle. Buy when it’s cold, sell when it’s hot. Hot markets bring more auctions and exit windows; cold markets bring more distressed sellers.<br>Forecast: ${fc.map((x,i)=>`Year ${S.year+i+1}: ${moodOf(x.m).n} (${pct(x.m-1)})`).join(' · ')||'end of fund'}. Events can change it.`],
    profit:['Yearly profit','What the company earns in a year before interest and taxes (finance people call it EBITDA). Everything is priced off it: value = yearly profit × multiple. Each year 65% of it goes to paying interest and repaying debt. Once the debt is gone, that money is paid out to your investors.'],
    growth:['Growth','How much yearly profit changes each year, plus small random swings. Below 0% the company is <b>Failing</b> and buyers pay 35% less for it. At 8% or more it is <b>Thriving</b> and buyers pay 20% more. Very fast growth slows down a little each year.'],
    multiple:['Multiple','How many years of profit a buyer will pay. It depends on the sector, the market mood, whether the sector is hot or cold, the company’s health and its size (bigger companies earn a higher multiple). Platforms built from merged companies and cards like AI-Wash push it up.'],
    value:['Value','What a buyer would pay for the whole company today: yearly profit × multiple. Selling to a PE firm gets you 97% of it. A strategic buyer pays 115% or more. Debt is repaid out of the sale price.'],
    debt:['Debt','What the company owes its banks. Each year it pays interest at the rate shown: the base bank interest plus a premium for heavy debt. Whatever profit is left repays the debt.'],
    load:['Debt load','Debt divided by yearly profit. If it goes above the bank limit (normally 7×), the bank can take the company. Up to 2× is safe: the company pays less interest and grows 1% faster. Above 4×, interest gets expensive fast.'],
    stake:['Your stake','Value minus debt (finance people call it equity). This is what the fund would get if you sold today, and it counts toward your fund’s return.'],
    breakup:['Breakup value','What the company’s buildings, equipment and other assets would fetch if you sold it for parts. Unknown until you do diligence or hire consultants. For failing companies it is often worth more than the business itself.'],

  };

}

    S.auc={oi:+x,price:o.price,leader:null,step:value(o.c)*0.05,msgs:[]};if(o.note)S.auc.msgs.push(o.note);},

  shopConn:x=>{const sh=S.node.shop,k=sh.conns[+x],p=connPrice();if(sh.sold.includes('n'+x)||!needPersonal(p))return;S.conns.push(k);sh.sold.push('n'+x);log(`New connection: ${CONNS[k].n}.`,'good');},

function playCard(hi,c){
  const k=S.hand[hi],C=CARDS[k],cost=cardCost(k);if(cost>S.bw){log('Not enough actions left this year.','bad');return;}
  if(C.p(c)===false)return;
  if(k==='cut'&&hasConn('mckinsey'))S.mckUsed=true;
  S.bw-=cost;S.hand.splice(hi,1);S.discard.push(k);sel=null;
}
function mergeCos(a,b){
  if(!co(a.id)||!co(b.id))return;
  const tot=a.ebitda+b.ebitda;a.growth=(a.growth*a.ebitda+b.growth*b.ebitda)/tot;a.ebitda=tot;a.debt+=b.debt;a.cost+=b.cost;
  a.platform+=1+b.platform;a.traits=a.traits.concat(b.traits);a.assetValue+=b.assetValue;a.assetKnown=a.assetKnown&&b.assetKnown;
  a.multBonus=Math.max(a.multBonus,b.multBonus);a.inflated=Math.max(a.inflated,b.inflated);a.rateAdj=Math.min(a.rateAdj,b.rateAdj);
  if(!/Holdings$/.test(a.name))a.name=`${a.name.split(' ')[0]} ${a.sector} Holdings`;
  S.companies=S.companies.filter(x=>x!==b);log(`Merged ${b.name} into ${a.name}.`,'good');news(`${S.firm} combines ${b.name} into ${a.name}.`);
}

    const dp=c.ebitda/o.p-1;return `<tr><td>${esc(c.name)}</td><td class="n">${fm(o.p)} → <b class="${dp>=0?'good':'bad'}">${fm(c.ebitda)}</b></td><td class="n">${fm(o.d)} → <b class="${c.debt<=o.d?'good':'bad'}">${fm(c.debt)}</b></td></tr>`;}).join('');

function endWarnings(){
  const w=[];const playable=S.hand.filter(k=>cardCost(k)<=S.bw);
  if(S.bw>0&&playable.length)w.push(`You still have ${S.bw} action${S.bw===1?'':'s'} and ${playable.length} playable card${playable.length===1?'':'s'}.`);
  S.companies.forEach(c=>{const r=risk(c);if(r>=0.25)w.push(`<b>${esc(c.name)}</b> is in Danger: ${Math.round(r*100)}% chance the bank takes it.`);});
  if(S.year===7&&S.companies.length)w.push(`This closes the fund. ${S.companies.length} unsold ${S.companies.length===1?'company goes':'companies go'} to a fire sale or a continuation fund.`);

}

/* cards */
function cardFace(k,o){
  o=o||{};const C=CARDS[k],ty=CARD_TYPE[k],shop=o.price!==undefined;
  const cost=shop?(o.sold?'Sold':fm(o.price)):cardCost(k);
  const dis=o.dis!==undefined?o.dis:(o.sold||(shop?S.personal<o.price:cardCost(k)>S.bw));
  return `<button class="card t-${ty} ${o.selected?'sel':''} ${C.tier!=='legal'?'tier-'+C.tier:''}" data-a="${o.a}" data-x="${o.x}" ${o.drag?`data-card="${o.x}"`:''} ${dis?'disabled':''}>
    <span class="cost ${shop?'price':''}">${cost}</span><span class="art">${svg(ty)}</span><span class="nm">${C.n}</span><span class="ty">${TYPES[ty]}${C.tier==='illegal'?' · illegal':C.tier==='gray'?' · gray':''}</span><span class="tx">${o.full?C.d:(o.eff||shortDesc(C.d))}</span></button>`;
}
function trayHTML(){
  if(tab!=='play'||Q.length&&false)return '';
  if(S.phase==='ops'){
    const selK=sel!==null?S.hand[sel]:null;let bar='';
    if(selK){const C=CARDS[selK];
      bar=C.t==='none'?`<div class="selbar"><div class="row between"><b>${C.n}</b>${btn('Cancel','selcard',sel,{cls:'sm'})}</div><p class="small">${C.d}</p>${previewHTML(selK,null)}<div class="row">${btn(`Play ${C.n}`,'playNow','',{cls:'primary',dis:cardCost(selK)>S.bw})}</div></div>`
        :`<div class="selbar"><div class="row between"><b>${C.n}</b>${btn('Cancel','selcard',sel,{cls:'sm'})}</div><span class="sel-hint">Scroll to a company and tap <b>Apply</b>. Each one shows what the card would do.</span></div>`;}
    return `<div class="tray ${selK?'picking':trayMin?'min':''}">${bar}<div class="tray-head"><span class="bw" aria-label="actions left">${S.bw}<small>action${S.bw===1?'':'s'}</small></span>
      ${btn(svg('undo')+'Undo','undo','',{cls:'sm',dis:!undoStack.length})}${selK?'':btn(trayMin?'Show cards':'Hide cards','trayMin','',{cls:'sm'})}
      ${btn(S.year===7?'End year & close fund':'End year','endYear','',{cls:'primary end'})}</div>
      <div class="hand">${S.hand.length?S.hand.map((k,i)=>cardFace(k,{a:'selcard',x:i,selected:sel===i,drag:true})).join(''):'<p class="muted small empty">No cards left this year.</p>'}</div></div>`;
  }
  if(S.phase==='boss'&&S.boss&&!S.boss.done&&S.boss.hand){const b=S.boss;
    return `<div class="tray"><div class="tray-head"><span class="bw">${b.bw}<small>action${b.bw===1?'':'s'}</small></span><span class="small grow">Round ${Math.min(b.round,b.max)} of ${b.max}</span>${btn('End round','bend','',{cls:'primary end'})}</div>
      <div class="hand">${b.hand.map((k,i)=>bossCardFace(k,i)).join('')||'<p class="muted small empty">No cards left this round.</p>'}</div></div>`;
  }
  return '';
}
function bossCardFace(k,i){
  const b=S.boss,ty=CARD_TYPE[k];let eff;
  if(k==='network')eff='Draw 2 cards';
  else if(b.kind==='pitch')eff=ty==='shady'?`Doubt −28 · jail ${jailPct(2)}`:`Doubt −${pitchDmg(ty)}${b.intent.ty.includes(ty)?' · answers!':''}`;
  else eff=shortDesc(BOSS_RULES.duel[ty])+(ty==='shady'?` · jail ${jailPct(2)}`:'');
  return cardFace(k,{a:'bcard',x:i,eff,dis:CARDS[k].c>b.bw,selected:b.kind==='pitch'&&b.intent.ty.includes(ty)});
}

/* company sheets */
function sparkSVG(c){
  const pts=(c.hist||[]).slice();if(!pts.length||Math.abs(pts[pts.length-1]-c.ebitda)>1e-9)pts.push(c.ebitda);if(pts.length<2)return '';
  const w=300,h=36,mn=Math.min(...pts),mx=Math.max(...pts),rg=mx-mn||1;
  const xy=pts.map((v,i)=>[4+i/(pts.length-1)*(w-8),h-5-(v-mn)/rg*(h-10)]);
  const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const L=xy[xy.length-1],up=pts[pts.length-1]>=pts[0];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Yearly profit history"><path d="${d} L${w-4} ${h} L4 ${h} Z" fill="${up?'var(--mint)':'var(--coral)'}" opacity=".45"/><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${L[0]}" cy="${L[1]}" r="4" fill="var(--grape)" stroke="var(--ink)" stroke-width="2"/></svg>`;
}
function traitsHTML(c){const r=c.traits.filter(t=>t.rev);return r.length?`<div class="traits">${r.map(t=>`<button class="trait ${TRAITS[t.k].bad?'bad':'good'}" data-a="trait" data-x="${t.k}">${TRAITS[t.k].n}</button>`).join('')}</div>`:'';}
function sheetHTML(c,o){
  o=o||{};const h=health(c),lev=c.ebitda>0?c.debt/c.ebitda:0,rk=risk(c),rl=riskLabel(rk);
  const kv=(ex,label,v,cls,key,raw)=>`<button class="kv" data-a="explain" data-x="${ex}"><span class="ck">${label}</span><span class="cv ${cls||''}" ${key?`data-num="${key}" data-raw="${raw}" data-fmt="m"`:''}>${v}</span></button>`;
  const stats=[kv('profit','Yearly profit',fm(c.ebitda),'',c.owned?'p'+c.id:'',c.ebitda),kv('growth','Growth',pct(c.growth),c.growth<0?'bad':c.growth>=0.08?'good':''),kv('multiple','Multiple',mult(c).toFixed(1)+'×'),
    kv('value','Value',fm(value(c))),c.owned?kv('stake','Your stake',fm(equity(c))):kv('breakup','Breakup value',c.assetKnown?fm(c.assetValue):'?'),
    c.owned?kv('stakeret','Stake return',c.cost>0?(equity(c)/c.cost).toFixed(2)+'×':'–'):''].join('');
  const gauge=c.owned?`<div class="gauge"><div class="gl"><button class="lnk" data-a="explain" data-x="load">Debt ${fm(c.debt)} · load ${lev.toFixed(1)}× · ${(compRate(c)*100).toFixed(1)}% interest</button></div>
    <div class="gbar"><i class="${rl.cls}" style="width:${clamp(lev/lim(c)*100,0,100)}%"></i><span class="gmark" style="left:${clamp(5/lim(c)*100,0,100)}%"></span></div>

  return `<article class="sheet ${o.target?'target':''}" ${o.drop?`data-drop="${c.id}"`:''}>
    <div class="sh-head"><span class="sec-ic">${svg(c.sector)}</span><div class="grow"><h3>${esc(c.name)}</h3><span class="small muted">${c.sector}${o.sub?' · '+o.sub:''}</span></div><span class="stamp h-${h}">${h}</span></div>

function opsActions(c){
  const selK=sel!==null?S.hand[sel]:null;
  if(selK&&CARDS[selK].t==='co')return previewHTML(selK,c.id)+`<div class="row">${btn(`Apply ${CARDS[selK].n}`,'apply',c.id,{cls:'primary'})}</div>`;
  const pe=salePE(c),st=saleStrat(c),br=saleBreak(c),canSt=c.strategic||S.exitBoost>0;
  const sub=net=>`+${fm(net)} paid out · return ${fundMoic().toFixed(2)}× → ${retAfter(net,c).toFixed(2)}×`;
  let a=btn('Sell to a PE firm','sell',`${c.id}:pe`,{dis:pe<c.debt,sub:pe<c.debt?'Wouldn’t cover the debt':sub(pe-c.debt)});
  if(canSt)a+=btn('Strategic sale','sell',`${c.id}:strat`,{cls:'primary',dis:st<c.debt,sub:sub(st-c.debt)});
  a+=btn('Break up','sell',`${c.id}:break`,{cls:'gray',sub:c.assetKnown?(br<c.debt?'Wouldn’t cover the debt':sub(br-c.debt)+' · rep −2 to −5'):'Value unknown · rep −2 to −5'});
  if(S.companies.some(o=>o!==c&&o.sector===c.sector))a+=btn('Merge…','merge',c.id,{sub:'Combine with a same-sector company'});
  if(value(c)<c.debt)a+=btn('Let the bank take it','keys',c.id,{cls:'danger',sub:'Reputation −5'});
  return `<div class="acts">${a}</div>`;
}

/* map */
function mapSVG(){
  const W=360,rowH=66,top=70,H=top+6*rowH+20,X=[110,210,310],Y=yr=>top+(6-yr)*rowH+rowH/2;
  const cur=S.year;let s=`<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fund map">`;
  for(let yr=1;yr<6;yr++)for(let a=0;a<3;a++)for(let b=0;b<3;b++)if(Math.abs(a-b)<=1){const taken=S.path[yr-1]===a&&S.path[yr]===b;
    s+=`<line x1="${X[a]}" y1="${Y(yr)}" x2="${X[b]}" y2="${Y(yr+1)}" class="edge ${taken?'taken':''}"/>`;}
  for(let a=0;a<3;a++)s+=`<line x1="${X[a]}" y1="${Y(6)}" x2="210" y2="44" class="edge ${S.path[5]===a&&cur===7?'taken':''}"/>`;
  for(let yr=1;yr<=6;yr++){
    const m=yr<=cur?S.mktPlan[yr-1]+(yr===cur?S.mktShift:0):yr-cur<=2?forecast(yr-cur).m:null;const md=m==null?null:moodOf(m);
    s+=`<text x="8" y="${Y(yr)-3}" class="yr">Year ${yr}</text><text x="8" y="${Y(yr)+12}" class="mood ${md?md.cls:''}">${md?md.n:'?'}</text>`;
    for(let l=0;l<3;l++){const t=S.map[yr-1][l],past=yr<cur,here=past&&S.path[yr-1]===l,can=yr===cur&&reachable(l);
      const cls=can?'can':past?(here?'done':'gone'):yr===cur?'gone':'';
      s+=`<g class="node ${cls}" ${can?`data-a="go" data-x="${l}" role="button" tabindex="0" aria-label="${NODE_LABEL[t]}"`:''}><circle cx="${X[l]}" cy="${Y(yr)}" r="21" fill="${NODE_COLOR[t]}"/>${can?`<circle cx="${X[l]}" cy="${Y(yr)}" r="27" class="ring"/>`:''}
        <g transform="translate(${X[l]-11} ${Y(yr)-11}) scale(.92)" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICO[t]}</g>
        <text x="${X[l]}" y="${Y(yr)+34}" class="nl">${NODE_LABEL[t]}</text></g>`;}
  }
  const bossCan=cur===7;
  s+=`<g class="node boss ${bossCan?'can':''}" ${bossCan?'data-a="go" data-x="boss" role="button" tabindex="0"':''}><rect x="110" y="14" width="200" height="44" rx="14" fill="var(--coral)"/>${bossCan?'<rect x="104" y="8" width="212" height="56" rx="18" class="ring"/>':''}
    <g transform="translate(124 24)" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round">${ICO.boss}</g><text x="220" y="34" class="bt">BOSS · Year 7</text><text x="220" y="50" class="bn">${BOSS[S.fund.n-1].n}</text></g>`;
  return s+'</svg>';
}

  return `<div class="panel"><h2>Portfolio · your stakes ${fm(nav())}</h2><div class="minis">${S.companies.map(c=>{const r=riskLabel(risk(c));return `<div class="mini"><span class="sec-ic sm">${svg(c.sector)}</span><span class="grow"><b>${esc(c.name)}</b><span class="small muted">${fm(value(c))} · ${pct(c.growth)}</span></span>${c.debt>0?pill(r.n,r.cls):''}</div>`;}).join('')}</div></div>`;
}

function offerHTML(o,i){

  if(o.done)a='<p class="muted small">Closed.</p>';
  else{const dc=ddCost(o),fin=canFinance(c,o.price);
    a=btn(full?'Diligence complete':`Diligence · ${fm(dc)}`,'dd',i,{dis:full||o.dd>=o.ddMax||S.fund.cash<dc||!!S.frozen,sub:full?'':auc?`${o.ddMax-o.dd} round left (time pressure)`:'Reveal a hidden trait'});
    if(auc&&!o.allowed)a+=btn('Pull strings','pull',i,{dis:S.influence<favorCost(2),sub:`${S.auctionBan?'Banned this fund':'Your reputation is Toxic'} · spend ${favorCost(2)} influence to get in`});
    else if(auc)a+=btn(S.rigged||S.fasttrack?`Win it at ${fm(o.price)}`:`Start bidding at ${fm(o.price)}`,'startAuction',i,{cls:S.rigged?'primary illegal':'primary',dis:!!S.auc||!fin,sub:!fin?(S.frozen?'Fund cash frozen':'You can’t afford this'):S.rigged?'Rigged':S.fasttrack?'Fast-tracked':`vs ${o.rivals.filter(r=>r.in).length} rivals`});
    else a+=btn(`Buy for ${fm(o.price)}`,'buy',i,{cls:'primary',dis:!fin,sub:fin?`Banks lend up to ${fm(maxDebt(c,o.price))}`:S.frozen?'Fund cash frozen':`Needs ${fm(o.price-maxDebt(c,o.price))} from the fund`});}
  const sub=o.kind==='private'?'Private deal':o.kind==='distressed'?'Distressed sale':auc?'Auction':'For sale';

}

function buyScreen(){

  return `${hintHTML('buy')}<div class="panel"><h2>Finance ${esc(c.name)}</h2><p>Price <b>${fm(b.price)}</b>. Banks lend up to <b>${fm(mx)}</b> (${levCap()}× yearly profit, at most 80% of the price). The rest comes from fund cash (${fm(S.fund.cash)}).</p>
    <label for="lev" class="small muted">How much to borrow</label>
    <div class="slider">${btn('−','levStep','-1',{cls:'round',dis:b.debt<=mn+1e-9})}<input type="range" id="lev" min="${mn}" max="${mx}" step="any" value="${b.debt}">${btn('+','levStep','1',{cls:'round',dis:b.debt>=mx-1e-9})}</div>

}
const levStepSize=()=>Math.max(0.01,+(S.buy.price*0.0025).toPrecision(1));
