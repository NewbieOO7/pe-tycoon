<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>PE Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: a phone-width board game. Sticky HUD on top, the current screen in the middle, the hand tray and four tabs fixed at the bottom. Chunky ink outlines, offset shadows and bright game-piece colors, one look on purpose. */
:root{
  --board:#2f8f83; --board-dk:#24716a; --ink:#24180f; --paper:#fff8e6; --paper-2:#f6ead0;
  --sun:#ffd84a; --mint:#8fe3c6; --lime:#c4eb7a; --coral:#ff8a72; --pink:#ffb8dc; --sky:#a9c8ff; --lilac:#c9b2ff; --grape:#7a3fd0;
  --good:#1a7f45; --bad:#c42f18; --warn:#a86200; --muted:#6b5a3a;
  --display:"Lilita One", "Arial Black", Impact, sans-serif;
  --body:"Nunito", "Trebuchet MS", system-ui, sans-serif;
  --tray-h:236px; --tabs-h:62px;
  color-scheme:light;
}
html,body{background:var(--board);color:var(--ink)}
body{font-family:var(--body);font-size:14px;line-height:1.4;font-weight:600;
  background-color:var(--board);background-image:radial-gradient(rgb(255 255 255/.07) 1.5px,transparent 1.5px);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sun)}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance}
h2{font-size:19px;display:flex;align-items:center;gap:6px} h3{font-size:15px}
p{margin:0} ul{margin:0;padding-left:18px}
.small{font-size:12px} .muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.mono{font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center} .row.tight{gap:5px} .between{justify-content:space-between}
.ic{width:20px;height:20px;flex:none}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.main{display:flex;flex-direction:column;gap:12px;padding-block:12px calc(var(--tabs-h) + 24px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.has-tray .main{padding-bottom:calc(var(--tray-h) + var(--tabs-h) + 24px + env(safe-area-inset-bottom,0px))}
footer{font-size:11px;color:var(--paper);opacity:.7;text-align:center}

/* panels & buttons */
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{font:inherit;font-weight:800;color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:9px 12px;cursor:pointer;text-align:left;display:inline-flex;flex-direction:column;justify-content:center;gap:1px;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible,.tab:focus-visible,g[data-a]:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.btn .sub{font-size:11.5px;font-weight:600;opacity:.85}
.btn.primary{background:var(--sun)} .btn.gray{background:#ffe1a6} .btn.illegal{background:var(--coral)} .btn.danger{background:var(--coral)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline}
.btn.sm{padding:5px 9px;font-size:12px;flex-direction:row;align-items:center;gap:4px} .btn.sm .ic{width:15px;height:15px}
.btn.wide{width:100%;text-align:center;align-items:center;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.02em}
.slider{display:flex;align-items:center;gap:10px;width:100%}
.slider input[type=range]{flex:1;min-width:0;height:30px;margin:0;accent-color:var(--grape);cursor:pointer}
.slider input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:99px;border:2.5px solid var(--ink);background:var(--paper-2)}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:var(--sun);border:3px solid var(--ink)}
.slider input[type=range]{-webkit-appearance:none;appearance:none;background:transparent}
.slider input[type=range]::-moz-range-track{height:8px;border-radius:99px;border:2.5px solid var(--ink);background:var(--paper-2)}
.slider input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--sun);border:3px solid var(--ink)}
.btn.round{width:44px;height:44px;border-radius:50%;padding:0;align-items:center;font-family:var(--display);font-size:24px;font-weight:400;flex:none}
.acts{display:flex;flex-direction:column;gap:8px}
.pill{font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--paper-2);border:2px solid var(--ink);white-space:nowrap;display:inline-block}
.pill.Safe{background:var(--mint)} .pill.Risky{background:var(--sun)} .pill.Danger{background:var(--coral)} .pill.out{opacity:.4;text-decoration:line-through}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px} td,th{padding:5px 6px;border-bottom:2px dashed rgb(36 24 15/.2);text-align:left} .n{text-align:right;font-variant-numeric:tabular-nums}
details{border-top:2px dashed rgb(36 24 15/.2);padding-top:6px} details summary{cursor:pointer;font-weight:800}
input[type=text]{box-sizing:border-box;font:inherit;padding:10px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);width:100%}
.hint{background:var(--sky);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.hint-t{font-family:var(--display);font-weight:400;font-size:15px}

/* HUD */
.hud{position:relative;z-index:20;background:var(--sun);border-bottom:3px solid var(--ink);padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.firm{font-family:var(--display);font-size:19px;line-height:1.05;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11px;font-weight:800;white-space:nowrap;background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:1px 8px}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.chip{font:inherit;color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:10px;box-shadow:0 2px 0 var(--ink);padding:2px 5px 3px;display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;min-width:0;overflow:hidden}
.chip .ck{font-size:8.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:800;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip .cv{font-family:var(--display);font-size:15px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.good .cv{color:var(--good)} .chip.bad .cv{color:var(--bad)} .chip.warn .cv{color:var(--warn)}
.relics{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:flex-end}
.rl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted)}
.relic{flex:none;width:27px;height:27px;border-radius:50%;background:var(--lilac);border:2.5px solid var(--ink);box-shadow:0 2px 0 var(--ink);display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.relic .ic{width:17px;height:17px}
.hotcold{margin-left:auto;font-size:11px;white-space:nowrap}

/* operations: a fixed screen, one company per swipe */
html.opsmode,html.opsmode body{height:100%;overflow:hidden}
html.opsmode{box-sizing:border-box}
html.opsmode .app{height:100%}
html.opsmode .main{flex:1;min-height:0;padding:6px 0 4px!important;gap:4px;overflow:hidden}
html.opsmode .main>footer{display:none}
html.opsmode .tray,html.opsmode .tabs{position:static;flex:none;width:100%}
html.opsmode .hud{gap:4px;padding-top:6px;padding-bottom:6px}
html.opsmode .firm{font-size:16px} html.opsmode .relic{width:24px;height:24px} html.opsmode .relic .ic{width:14px;height:14px}
html.opsmode .chip{padding:1px 5px 2px} html.opsmode .chip .cv{font-size:13.5px}
html.opsmode .tray{padding:6px 0 8px;gap:6px}
html.opsmode .bw{width:40px;height:40px;font-size:17px}
html.opsmode .tray-head .end{padding:6px 12px;font-size:15px}
.chip.yr{cursor:default;background:var(--paper-2)}
.ops-top{display:flex;justify-content:space-between;align-items:center;color:var(--paper);font-family:var(--display);font-size:17px;text-shadow:0 2px 0 var(--ink);padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.ops-top .ot{display:flex;gap:6px;align-items:center}
.cidx{font-size:13px}
.carousel{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.carousel::-webkit-scrollbar{display:none}
.slide{box-sizing:border-box;flex:0 0 100%;min-width:0;scroll-snap-align:center;scroll-snap-stop:always;padding:4px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;overflow-y:auto}
.cdots{display:flex;gap:6px;margin-left:auto;margin-right:8px}
.cdots button{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:var(--board-dk);padding:0;cursor:pointer}
.cdots button.on{background:var(--sun)}
.sheet.ops{padding:9px 10px;gap:6px;flex:none}
.sheet.ops .sec-ic.sm{width:28px;height:28px}
.sheet.ops .traits .trait{font-size:10.5px;padding:1px 8px}
.sheet.ops .sh-head h3{font-size:15.5px}
.sheet.ops .stamp{font-size:12px}
.kvs.c{gap:5px} .kvs.c .kv{padding:2px 6px} .kvs.c .kv .ck{font-size:8.5px} .kvs.c .kv .cv{font-size:14px}
.drow{display:flex;align-items:center;gap:6px}
.drow .gbar{flex:1;min-width:30px}
.gbar.sm{height:10px;border-width:2px}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn.sm2{padding:6px 8px;font-size:12.5px;border-radius:10px}
.btn.sm2 .sub{font-size:10.5px}
.btn.apply{width:100%;align-items:center;font-size:14px}
.preview.c{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;font-size:11.5px;padding:6px 8px}
.preview.c>.warn,.preview.c>.muted,.preview.c>.bad{grid-column:1/-1}

/* tabs & tray */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto}
.tab{position:relative;font:inherit;font-weight:800;font-size:11px;color:var(--paper);background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;border-radius:10px}
.tab.on{color:var(--ink);background:var(--sun)}
.tab .dot{position:absolute;top:2px;right:calc(50% - 18px);width:11px;height:11px;border-radius:50%;background:var(--coral);border:2px solid var(--ink)}
.tray{position:fixed;left:0;right:0;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px));z-index:24;max-width:560px;margin:0 auto;background:var(--board-dk);border-top:3px solid var(--ink);padding:8px 0 10px;display:flex;flex-direction:column;gap:8px}
.tray-head{display:flex;gap:8px;align-items:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));color:var(--paper)}
.tray-head .end{margin-left:auto;padding:7px 14px;font-family:var(--display);font-weight:400;font-size:16px}
.bw{width:46px;height:46px;border-radius:50%;background:var(--grape);color:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;line-height:1;flex:none}
.bw small{font-family:var(--body);font-size:8px;font-weight:800;text-transform:uppercase}
.selbar{margin:0 12px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;max-height:45vh;overflow:auto}
.hand{display:flex;gap:9px;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));scroll-snap-type:x proximity}
.hand.wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px;overflow:visible;padding:12px 2px 4px}
.hand.wrap .card{width:100%;min-height:150px;padding:12px 5px 8px}
.hand.wrap .card .nm{font-size:12.5px} .hand.wrap .card .tx{font-size:10px} .hand.wrap .card .art{width:40px;height:34px}
.hand.wrap .card .cost.price{right:-4px;font-size:10px}
/* compact hand in the tray: name, type and a three-line effect */
.tray .card{width:84px;min-height:72px;padding:19px 5px 7px;gap:3px;justify-content:center}
.tray .card .art{display:none}
.tray .card .art{width:36px;height:30px;border-radius:8px} .tray .card .art .ic{width:18px;height:18px}
.tray .card .nm{font-size:12.5px} .tray .card .ty{font-size:8px}
.tray .card .tx{font-size:9.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tray .card .cost{width:24px;min-width:24px;height:24px;font-size:13px;top:-7px;left:-7px}
.tray.min .hand,.tray.picking .hand{display:none}
.selbar .sel-hint{font-size:11px}
.selbar.one{flex-direction:row;align-items:center;gap:8px;padding:6px 8px}
.selbar.one .grow{gap:1px}
.selbar .sel-hint{font-weight:600;color:var(--muted)}
.sel-desc{font-size:11.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hand .empty{color:var(--paper)}

/* cards */
.card{position:relative;flex:none;width:112px;min-height:160px;font:inherit;color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:10px 7px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;scroll-snap-align:start;touch-action:pan-x;transition:transform .12s;user-select:none;-webkit-user-select:none}
.card:disabled{cursor:default}
.tray .card:disabled{opacity:.55}
.card.t-ops{background:var(--sun)} .card.t-fin{background:var(--mint)} .card.t-pr{background:var(--pink)} .card.t-pol{background:var(--sky)} .card.t-shady{background:var(--coral)}
.card.sel{transform:translateY(-10px) rotate(-2deg);box-shadow:0 9px 0 var(--ink)}
.card.tier-illegal{background-image:repeating-linear-gradient(-45deg,transparent 0 9px,rgb(36 24 15/.08) 9px 12px)}
.card .cost{position:absolute;top:-9px;left:-9px;min-width:28px;height:28px;padding:0 4px;border-radius:99px;background:var(--grape);color:#fff;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:15px}
.card .cost.price{font-family:var(--body);font-size:10.5px;font-weight:800;left:auto;right:-6px}
.card .art{width:46px;height:40px;border-radius:10px;background:var(--paper);border:2.5px solid var(--ink);display:grid;place-items:center}
.card .art .ic{width:24px;height:24px}
.card .nm{font-family:var(--display);font-size:13.5px;line-height:1.05}
.card .ty{font-size:8.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.card .tx{font-size:10.5px;line-height:1.25;font-weight:700}
.stackwrap{position:relative;min-width:0} .stackwrap .count{position:absolute;bottom:-6px;right:-6px;background:var(--ink);color:var(--paper);border-radius:99px;padding:1px 7px;font-size:11px;font-weight:800}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;opacity:.92}
.ghost .card{box-shadow:0 14px 0 rgb(36 24 15/.5)}

/* company sheets */
.sheet{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.sheet.target{border-style:dashed} .sheet.dropping{background:var(--sun);transform:scale(1.01)}
.sh-head{display:flex;gap:10px;align-items:center}
.sh-head h3{font-size:17px;line-height:1.1}
.sec-ic{width:40px;height:40px;border-radius:12px;background:var(--lilac);border:2.5px solid var(--ink);display:grid;place-items:center;flex:none}
.sec-ic.sm{width:30px;height:30px;border-radius:9px} .sec-ic.sm .ic{width:16px;height:16px}
.stamp{font-family:var(--display);font-size:13px;padding:3px 9px;border:2.5px solid var(--ink);border-radius:8px;transform:rotate(4deg);flex:none}
.stamp.h-Failing{background:var(--coral)} .stamp.h-Steady{background:var(--sky)} .stamp.h-Thriving{background:var(--lime)}
.kvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kv{font:inherit;color:var(--ink);text-align:left;background:var(--paper-2);border:2px solid var(--ink);border-radius:10px;padding:4px 7px;display:flex;flex-direction:column;min-width:0;cursor:pointer}
div.kv{cursor:default}
.kv .ck{font-size:9px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv .cv{font-family:var(--display);font-size:16px;line-height:1.15;font-variant-numeric:tabular-nums}
.spark{width:100%;height:38px;display:block}
.gauge{display:flex;flex-direction:column;gap:4px}
.gl{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.lnk{font:inherit;font-size:12px;font-weight:700;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-align:left;display:inline-flex;gap:5px;align-items:center}
.gbar{position:relative;height:14px;border:2.5px solid var(--ink);border-radius:99px;background:var(--paper-2);overflow:hidden}
.gbar i{position:absolute;inset:0 auto 0 0;border-right:2.5px solid var(--ink)}
.gbar i.Safe{background:var(--mint)} .gbar i.Risky{background:var(--sun)} .gbar i.Danger{background:var(--coral)}
.gmark{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ink)}
.traits{display:flex;flex-wrap:wrap;gap:5px}
.trait{font:inherit;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;border:2px solid var(--ink);cursor:pointer;color:var(--ink)}
.trait.good{background:var(--mint)} .trait.bad{background:var(--coral)}
.preview{background:var(--paper-2);border:2px dashed var(--ink);border-radius:12px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.preview b{font-variant-numeric:tabular-nums}
.minis{display:flex;flex-direction:column;gap:6px}
.mini{display:flex;gap:8px;align-items:center;font:inherit;color:var(--ink);background:none;border:0;padding:0;text-align:left;cursor:default}
button.mini{cursor:pointer}
.mini b{font-size:13px}

/* screens */
.screen-title{display:flex;align-items:center;gap:8px;color:var(--paper);font-family:var(--display);font-size:22px;text-shadow:0 2px 0 var(--ink)}
.screen-title .ic{width:26px;height:26px}
.board{background:var(--board-dk);color:var(--paper)}
.board h2{color:var(--paper)}
.map{width:100%;height:auto;display:block}
.map .edge{stroke:rgb(255 248 230/.35);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round}
.map .edge.taken{stroke:var(--sun);stroke-dasharray:none;stroke-width:5}
.map .node circle:first-child,.map .node rect:first-child{stroke:var(--ink);stroke-width:3}
.map .node.gone{opacity:.35} .map .node.done circle:first-child{stroke:var(--sun);stroke-width:4}
.map .node.can{cursor:pointer}
.map .ring{fill:none;stroke:var(--sun);stroke-width:3;stroke-dasharray:5 4;animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.map .nl{font-family:var(--body);font-size:10.5px;font-weight:800;fill:var(--paper);text-anchor:middle}
.map .yr{font-family:var(--display);font-size:13px;fill:var(--paper)}

const TR_CACHE=new Map();
// placeholder-index-independent lookup: "{6} x {7}" matches an entry written as "{0} x {1}" (or any numbering)
const phNorm=str=>{const ord=[];const k=str.replace(/\{(\d+)\}/g,(m,i)=>{ord.push(i);return '{'+(ord.length-1)+'}';});return [k,ord];};
let TR_NORM=null;
function trNormLook(core){
  if(!TR_NORM){TR_NORM={};for(const en in TR_TR){const [k,ord]=phNorm(en);if(TR_NORM[k]!=null)continue;const pos={};ord.forEach((o,j)=>pos[o]=j);TR_NORM[k]=TR_TR[en].replace(/\{(\d+)\}/g,(m,i)=>'{'+pos[i]+'}');}}
  const [k,ord]=phNorm(core);const v=TR_NORM[k];return v==null?null:v.replace(/\{(\d+)\}/g,(m,j)=>'{'+ord[+j]+'}');
}
function trLook(core){let v=TR_TR[core];if(v==null)v=trNormLook(core);if(v==null&&core.endsWith(':')){const b=trLook(core.slice(0,-1));if(b!=null)v=b+':';}return v;}
function trText(key){
  if(LANG==='en')return key;
  let v=TR_CACHE.get(key);if(v!==undefined)return v;
  v=TR_TR[key];
  if(v==null)v=key.split(/(<[^>]*>)/).map(seg=>{if(!seg||seg[0]==='<')return seg;const m=seg.match(/^(\s*)([\s\S]*?)(\s*)$/);if(!m[2])return seg;const tv=trLook(m[2]);return tv==null?seg:m[1]+tv+m[3];}).join('');
  TR_CACHE.set(key,v);return v;
}
function $t(s,...vals){
  if(Array.isArray(s)&&s.raw){
    if(LANG==='en'){let o=s[0];for(let i=1;i<s.length;i++)o+=vals[i-1]+s[i];return o;}
    let key=s[0];for(let i=1;i<s.length;i++)key+='{'+(i-1)+'}'+s[i];
    return trText(key).replace(/\{(\d+)\}/g,(m,i)=>String(vals[+i]));
  }
  return trText(String(s));
}

}

function forecast(dy){const y=S.year-1+dy;if(y>8)return null;const f=Math.pow(0.5,dy);return {m:clamp(S.mktPlan[y]+S.mktShift*f,0.5,1.5),r:clamp(S.ratePlan[y]+S.rateShift*f,0.02,0.16)};}
function loadPremium(l){return l<=2?-0.01:l<=3?0:l<=4?0.01:l<=5?0.025:l<=6?0.04:0.06;}

/* ---------- valuation ---------- */
function health(c){return c.growth<0?'Failing':c.growth>=0.08?'Thriving':'Steady';}
function mult(c){
  let m=SECTORS[c.sector].mult*S.mkt;
  if(c.sector===S.hot)m*=1.25; if(c.sector===S.cold)m*=0.8;
  const h=health(c); if(h==='Failing')m*=0.65; else if(h==='Thriving')m*=1.2;
  m+=1.5*Math.log10(Math.max(c.ebitda,0.5));
  m+=c.multBonus;
  if(c.platform>=2)m+=S.laws.antitrust?2:1;
  return Math.max(2,m);
}
function value(c){return Math.max(0,c.ebitda)*mult(c)*(1+(c.inflated||0));}
function equity(c){return Math.max(0,value(c)-c.debt);}
function nav(){return S.companies.reduce((s,c)=>s+equity(c),0);}
function fundMoic(){const f=S.fund;return (f.cash+f.dist+nav())/f.size;}
function largest(){return S.companies.slice().sort((a,b)=>value(b)-value(a))[0]||null;}
function compRate(c,debt){const d=debt===undefined?c.debt:debt;const l=c.ebitda>0?d/c.ebitda:99;return Math.max(0.02,S.rate+loadPremium(l)+c.rateAdj+FOUNDERS[S.founder].rate)*(S.laws.interest?0.7:1);}
// chance the bank takes this company next year (debt above 7x profit), by quick simulation
function riskOf(c,debt){
  const d0=debt===undefined?c.debt:debt;if(d0<=0||c.ebitda<=0)return d0>0?1:0;
  const rate=compRate(c,d0),known=k=>c.traits.some(t=>t.rev&&t.k===k);let hits=0;const N=240;
  for(let i=0;i<N;i++){
    let e=c.ebitda*(1+c.growth+(Math.random()*0.06-0.03)*(c.growth<0?1.6:1));
    if(Math.random()<0.12)e*=0.85;
    if(known('concentration')&&Math.random()<0.18)e*=0.75;
    let d=d0;const fcf=e*0.65-d*rate;d-=fcf>0?Math.min(d,fcf):fcf;
    if(known('maintenance')&&c.yearsOwned===0)d+=e;
    if(known('lawsuit')&&c.yearsOwned===1)d+=1.5*e;
    if(d/e>lim(c))hits++;
  }
  return hits/N;
}
const lim=c=>7+(c.limit||0);
function riskLabel(p){return p<0.05?{n:$t('Safe'),cls:'Safe'}:p<0.25?{n:$t('Risky'),cls:'Risky'}:{n:$t('Danger'),cls:'Danger'};}

/* ---------- companies ---------- */
function genName(sector){
  for(let i=0;i<30;i++){const n=$t`${pick(PREFIX)} ${pick(SECTORS[sector].suf)}`;if(!S.usedNames.includes(n)){S.usedNames.push(n);return n;}}
  return $t`${pick(PREFIX)} ${sector} #${S.uid}`;
}
function genCompany(h,extraBad){
  const sector=pick(Object.keys(SECTORS));
  const g={Failing:[-0.12,-0.03],Steady:[0.01,0.06],Thriving:[0.08,0.16]}[h];
  const e={Failing:[0.012,0.04],Steady:[0.02,0.06],Thriving:[0.02,0.05]}[h];
  const c={id:S.uid++,name:genName(sector),sector,ebitda:S.fund.size*rf(e[0],e[1]),growth:rf(g[0],g[1]),
    multBonus:0,debt:0,rateAdj:0,platform:0,traits:[],assetKnown:false,owned:false,yearsOwned:0,cost:0,
    strategic:false,inflated:0,slb:false,aiwash:0,fakeBid:false};
  const bad=['cooked','lawsuit','keyperson','concentration','union','maintenance'];
  const good=['realestate','pricing','patent','loyal','bloated','founder'];
  const nb={Failing:2,Steady:1,Thriving:chance(0.5)?1:0}[h]+(extraBad||0);
  let ng={Failing:chance(0.5)?1:0,Steady:1,Thriving:1}[h]; if(chance(0.3))ng++;
  shuffle(bad).slice(0,nb).forEach(k=>c.traits.push({k,rev:false}));
  shuffle(good).slice(0,ng).forEach(k=>c.traits.push({k,rev:false}));
  c.traits=shuffle(c.traits);
  const v=value(c);
  c.assetValue=v*({Failing:rf(0.9,1.5),Steady:rf(0.35,0.75),Thriving:rf(0.2,0.45)}[h])+(has(c,'realestate')?v*0.6:0);
  if(has(c,'cooked'))c.ebitda/=0.75;
  return c;
}
function makeOffer(c,kind,premium){if(kind!=='auction')premium*=1+repTier().price;const o={c,kind,premium,price:0,dd:0,ddMax:kind==='auction'?1:9,done:false,disc:false};recalcOffer(o);return o;}
function recalcOffer(o){o.price=value(o.c)*o.premium*(o.disc?0.88:1);}
function revealEffect(o,t){
  if(t.k==='cooked'){o.c.ebitda*=0.75;recalcOffer(o);log($t`${o.c.name} restated its profit. New price ${fm(o.price)}.`);}
  if(t.k==='founder'){o.disc=true;recalcOffer(o);log($t`The founder of ${o.c.name} cut the price to ${fm(o.price)}.`);}
}
function maxDebt(c,price){return Math.min(levCap()*c.ebitda,0.8*price);}
function canFinance(c,price){return !S.frozen&&price-maxDebt(c,price)<=S.fund.cash+1e-9;}
function ddCost(o){return 0.15*sc()+0.01*o.price;}

/* ---------- card preview ---------- */
function snapshotMetrics(c){return {profit:c?c.ebitda:0,growth:c?c.growth:0,value:c?value(c):0,debt:c?c.debt:0,stake:c?equity(c):0,risk:c?riskOf(c):0,
  cash:S.fund.cash,dist:S.fund.dist,personal:S.personal,rep:S.rep,heat:S.heat,inf:S.influence,ev:S.evidence.length,companies:S.companies.length};}
function previewCard(k,cid){
  const S0=S,q0=Q.length,p0=pending;let res;
  try{
    S=JSON.parse(JSON.stringify(S0));PREVIEW=true;
    const c=cid!=null?co(cid):null;if(c)c.traits=c.traits.filter(t=>t.rev);
    const before=snapshotMetrics(c);
    const r=CARDS[k].p(c);
    if(r===false)res={blocked:S.log[0]?S.log[0].msg:$t('Can’t play this here.')};
    else{const c2=c?co(c.id):null;res={before,after:snapshotMetrics(c2)};}
  }catch(e){res={blocked:$t('No preview available.')};}
  finally{S=S0;PREVIEW=false;Q.length=q0;pending=p0;}
  return res;
}
function previewHTML(k,cid,cp){
  const r=previewCard(k,cid);const C=CARDS[k];
  if(r.blocked)return $t`<div class="preview"><span class="bad">${esc(r.blocked)}</span></div>`;
  const b=r.before,a=r.after,L=[];

  if(cid!=null){line($t('Yearly profit'),b.profit,a.profit,fm);line($t('Growth'),b.growth,a.growth,pct);line($t('Value'),b.value,a.value,fm);line($t('Debt'),b.debt,a.debt,fm,false);line($t('Your stake'),b.stake,a.stake,fm);
    if(Math.abs(a.risk-b.risk)>=0.03)line($t('Chance bank takes it'),b.risk,a.risk,x=>Math.round(x*100)+'%',false);}
  line($t('Fund cash'),b.cash,a.cash,fm);line($t('Paid out'),b.dist,a.dist,fm);line($t('Your money'),b.personal,a.personal,fm);
  line($t('Reputation'),b.rep,a.rep,x=>Math.round(x));line($t('Heat'),b.heat,a.heat,x=>Math.round(x),false);line($t('Influence'),b.inf,a.inf,x=>Math.round(x));
  if(a.ev>b.ev)L.push($t`<div class="bad">Evidence +${a.ev-b.ev}</div>`);
  if(!L.length)L.push($t('<div>No visible change.</div>'));
  if(C.odds)L.push($t`<div class="warn">${C.odds}</div>`);
  if(cid!=null){const c=co(cid);if(c&&c.traits.some(t=>!t.rev))L.push($t('<div class="muted">Hidden traits could change this.</div>'));}
  if(C.tier==='illegal')L.push($t`<div class="bad">Jail risk ${jailPct(CARD_SEV[k]||2)} (game over)</div>`);
  let html=L.join('');
  if(cp)html=html.replace($t('Yearly profit:'),$t('Profit:')).replace($t('Your stake:'),$t('Stake:')).replace($t('Chance bank takes it:'),$t('Bank risk:')).replace($t('Fund cash:'),$t('Cash:')).replace($t('Your money:'),$t('Money:')).replace($t('Reputation:'),$t('Rep:'));
  return $t`<div class="preview${cp?' c':''}">${html}</div>`;
}

function genOfficials(){const names=shuffle(OFF_NAMES);return ['Zoning Commissioner','Regulator','Senator'].map((role,i)=>({id:i,name:names[i],role,trait:wpick({greedy:35,unreliable:15,bought:15,honest:15,sting:10,escalator:10}),known:false,demand:false}));}
function bribeModal(o){
  const bc=bribeCost();const offs=S.officials.filter(x=>!o.role||x.role===o.role);const choices=[];
  offs.forEach(of=>{
    if(!of.known)choices.push({label:$t`Background check on ${of.name}`,sub:$t`${fm(bc*0.25)} personal · learn what they’re really like`,disabled:()=>S.personal<bc*0.25,
      fn:()=>{S.personal-=bc*0.25;of.known=true;next(bribeModal(o));}});
    choices.push({label:$t`Pay ${of.name}, ${$t(of.role)}`,sub:$t`${fm(bc)} personal · ${of.known?OFF_TRAITS[of.trait].n+': '+OFF_TRAITS[of.trait].d:$t('character unknown')}`,cls:'illegal',
      disabled:()=>S.personal<bc,fn:()=>resolveBribe(of,bc,o)});
  });
  choices.push({label:$t('Back off'),fn:()=>{o.onBackoff&&o.onBackoff();}});
  return {title:$t('Envelope of Cash'),body:$t`${o.purpose}<br><span class="muted small">You have ${fm(S.personal)} of personal money. Every bribe that lands leaves serious evidence.</span>`,choices};
}
function resolveBribe(of,bc,o){
  S.personal-=bc;of.known=true;let msg='';
  switch(of.trait){
    case 'greedy':addEvidence('bribery',2);heat(4);msg=$t`${of.name} took the envelope and delivered.`;o.onSuccess(of);break;
    case 'escalator':addEvidence('bribery',2);heat(4);of.demand=true;msg=$t`${of.name} delivered. Then smiled and said, “See you next year.”`;o.onSuccess(of);break;
    case 'unreliable':addEvidence('bribery',2);msg=$t`${of.name} took the money and did nothing.`;o.onFail&&o.onFail();break;
    case 'bought':if(jailRoll('bribery',2))return;heat(15);S.rivalBoost=true;msg=$t`${of.name} already works for ${pick(RIVALS).name}. They know your playbook now (rivals bid harder at your next auction). Heat +15.`;o.onFail&&o.onFail();break;
    case 'honest':if(jailRoll($t('attempted bribery'),2))return;heat(20);msg=$t`${of.name} refused and called a reporter. Heat +20.`;o.onFail&&o.onFail();openCase($t('attempted bribery'),1);break;
    case 'sting':if(jailRoll($t('bribery, on tape'),3))return;heat(25);msg=$t`${of.name} was wearing a wire. Heat +25.`;o.onFail&&o.onFail();openCase($t('bribery, on tape'),3,3);break;
  }
  if(S.phase==='over')return;
  log(msg,of.trait==='greedy'||of.trait==='escalator'?'warn':'bad');
  next(info($t('The Envelope'),msg));
}

/* ---------- legal trouble ---------- */
function openCase(crime,stage,sev){
  stage=stage||1;sev=sev||2;
  if(hasConn('golf')&&!S.golfUsed){S.golfUsed=true;log($t`A look into ${crime} was quietly dropped. Your golf buddy made a call.`,'good');return;}
  if(stage===1&&hasConn('prfirm')&&!S.prUsed){S.prUsed=true;log($t`A reporter asked about ${crime}. Your PR firm buried it.`,'good');return;}
  const cs={id:S.uid++,crime,stage,sev};S.cases.push(cs);queue(caseModal(cs));
}
function closeCase(cs,msg){S.cases=S.cases.filter(x=>x!==cs);if(msg)log(msg,'good');}
// Influence can only delay: the case goes away, the evidence comes back and is safe for one year.
function holdCase(cs){closeCase(cs);S.evidence.push({id:S.uid++,crime:cs.crime,sev:cs.sev||2,age:0,hold:1});log($t`The ${cs.crime} story is on hold for a year. The evidence is still out there.`,'warn');}
function caseModal(cs){
  const bc=bribeCost(),sev=cs.sev||2;
  if(cs.stage===1){const fc=favorCost(2);return {title:$t('A Reporter Is Asking Questions'),body:$t`A journalist is digging into <b>${esc(cs.crime)}</b> (${SEV[sev].n}) at ${esc(S.firm)}.`,choices:[
    {label:$t('Hire a crisis PR firm'),sub:$t`${fm(0.5*bc)} personal · 60% the story dies`,disabled:()=>S.personal<0.5*bc,fn:()=>{S.personal-=0.5*bc;if(chance(0.6))closeCase(cs,$t('The story died.'));else{cs.stage=2;cs.wait=true;rep(-5);log($t('The story ran anyway. Reputation −5. Regulators noticed.'),'bad');}}},
    {label:$t('Call in a favor'),sub:sev>=3?$t('Too big to bury with favors'):$t`Spend ${fc} influence · the story is held for a year, the evidence stays`,disabled:()=>sev>=3||S.influence<fc,fn:()=>{useFavor(2);holdCase(cs);}},
    {label:$t('Stonewall'),sub:$t('Heat +10 · 40% it goes away, otherwise regulators next year'),fn:()=>{heat(10);if(chance(0.4))closeCase(cs,$t('The reporter moved on.'));else{cs.stage=2;cs.wait=true;rep(-5);}}},
    {label:$t('Leak dirt on a rival instead'),sub:$t('Gray · reputation −2, minor evidence, story dies'),cls:'gray',fn:()=>{rep(-2);addEvidence($t('leaking confidential information'),1);closeCase(cs,$t`The press got distracted by a scandal at ${pick(RIVALS).name}.`);}}]};}
  if(cs.stage===2){const fc=favorCost(4);return {title:$t('Regulators Open an Investigation'),body:$t`The Securities Commission has opened a formal investigation into <b>${esc(cs.crime)}</b> (${SEV[sev].n}). Reputation −5.`,choices:[
    {label:$t('Hire top lawyers'),sub:$t`${fm(1.5*bc)} personal · ${S.lawyered?$t('guaranteed (retainer)'):$t('55% the case closes')}`,disabled:()=>S.personal<1.5*bc,fn:()=>{rep(-5);S.personal-=1.5*bc;const ok=S.lawyered||chance(0.55);S.lawyered=false;if(ok)closeCase(cs,$t('Your lawyers buried them in paperwork. Case closed.'));else{cs.stage=3;cs.wait=true;log($t('The investigation is escalating.'),'bad');}}},
    {label:$t('Cooperate and pay a fine'),sub:$t`${fm(2*bc+0.15*S.personal)} (15% of your money) · reputation −10 · banned from auctions this fund`,disabled:()=>S.personal<2*bc,fn:()=>{rep(-5);S.personal-=Math.min(S.personal,2*bc+0.15*S.personal);rep(-10);S.auctionBan=true;news($t`${S.firm} fined over ${cs.crime}.`);closeCase(cs,$t('Fine paid. Case closed. Auction houses won’t deal with you this fund.'));}},
    {label:$t('Call in big favors'),sub:sev>=3?$t('Too big to bury with favors'):$t`Spend ${fc} influence · the case is shelved for a year, the evidence stays`,disabled:()=>sev>=3||S.influence<fc,fn:()=>{rep(-5);useFavor(4);holdCase(cs);}},
    {label:$t('Obstruct'),sub:$t('Illegal · 50% the case collapses, otherwise a subpoena now and severe evidence'),cls:'illegal',fn:()=>{rep(-5);if(chance(0.5))closeCase(cs,$t('Key documents went missing. The case collapsed.'));else{addEvidence($t('obstruction of justice'),3);heat(15);if(S.phase==='over')return;cs.stage=3;next(caseModal(cs));}}}]};}

    {label:$t('Let the bank take it'),sub:$t('You lose the company. Reputation −5.'),fn:()=>{if(co(c.id))handKeys(c);}}]};

function handKeys(c){S.companies=S.companies.filter(x=>x!==c);rep(-5);S.fund.lost++;S.fund.exits.push({name:c.name,moic:0,net:0});news($t`${c.name} collapses under ${S.firm}’s debt.`);log($t`Lost ${c.name} to the bank.`,'bad');fxStamp($t('SEIZED'),c.name,true);}

function saleStrat(c){return value(c)*(1.15+S.exitBoost+(c.fakeBid?0.3:0))*(c.sector===S.hot&&hasConn('hype')?1.1:1);}
function saleBreak(c){return c.assetValue*0.95;}
function realize(c,net,kind){
  S.fund.dist+=net;S.companies=S.companies.filter(x=>x!==c);
  const m=c.cost>0?net/c.cost:0;S.fund.exits.push({name:c.name,moic:m,net});
  if(kind==='break'){rep(c.growth<0?-2:-5);news($t`${c.name} broken up and sold for parts. ${ri(60,500)*Math.ceil(Math.sqrt(sc()))} jobs lost.`);}
  else news($t`${S.firm} sells ${c.name} to ${kind==='pe'?pick(RIVALS).name:kind==='family'?$t('the founding family'):$t('a strategic buyer')} for ${fm(net+c.debt)}.`);
  fxStamp(kind==='break'?$t('BROKEN UP'):$t('SOLD'),c.name);
  log($t`Sold ${c.name}: ${fm(net)} paid out (${m.toFixed(2)}× your stake).`,'good');
}

function bossDraw(n){const b=S.boss;for(let i=0;i<n;i++){if(!b.deck.length){b.deck=shuffle(b.discard);b.discard=[];}if(!b.deck.length)break;b.hand.push(b.deck.pop());}}

function pickIntent(){

function startPitch(){

function pitchWin(){const b=S.boss;b.done=true;b.doubt=0;S.pitchScore=0.2;b.msgs.unshift($t('The room is sold. They’re fighting over allocation.'));log($t('You won the Investor Pitch.'),'good');queue(connRewardModal($t('The investors loved you. One of them introduces you to someone useful.')));}
function startDuel(){

    deck:shuffle(S.cards),discard:[],hand:[],bw:0,played:[],msgs:[$t`Kestrel Partners has quietly bought 25% of ${c.name} and wants control. If they reach 50%, they force a sale at 70% of value.`],done:false};

function duelTell(){const b=S.boss;if(b.known)return $t`Kestrel has ${fm(b.chest)} left.`;const r=b.chest/b.chest0;const real=r>0.6?0:r>0.3?1:2;const shown=chance(0.8)?real:ri(0,2);

function bossCard(i){

function bossMove(a){

function bossEndRound(){
  const b=S.boss;if(b.done)return;
  if(b.kind==='pitch'){
    const it=b.intent;const blocked=b.played.some(t=>it.ty.includes(t));

    {label:$t('Bet against the market on a tip from a Treasury friend'),sub:$t`Illegal · personal +${fm(5*sc())} · severe evidence, heat +15`,cls:'illegal',fn:()=>{S.bm.tip=true;S.personal+=5*sc();addEvidence($t('insider trading during the crash'),3);heat(15);next(s2());}}]});
}

/* ---------- flow ---------- */
function startRun(firm,founder){
  S={v:VERSION,rs:(Date.now()^Math.floor(Math.random()*1e9))|0,uid:1,firm,founder,phase:'map',rep:50,heat:0,influence:0,personal:0,
    conns:[FOUNDERS[founder].conn],cards:FOUNDERS[founder].deck.slice(),deck:[],discard:[],hand:[],bw:0,companies:[],evidence:[],cases:[],officials:[],
    bills:{loophole:0,interest:0,antitrust:0},laws:{},log:[],news:[],funds:[],usedNames:[],fallGuys:0,lpBonus:0,exitBoost:0,
    rivalHandicap:false,rivalBoost:false,lawyered:false,mckUsed:false,golfUsed:false,prUsed:false,rate:0.07,mkt:1,hot:null,cold:null,year:1,fund:{n:1,size:50},
    frozen:0,audit:0,favors:0,bmPenalty:0,tipoff:false,fasttrack:false,rigged:false,auctionBan:false,pitchScore:0,pensionBribe:0,promiseNext:0,promise:0};
  startFund(1,50,[]);
}
function rotateHype(){const k=shuffle(Object.keys(SECTORS));S.hot=k[0];S.cold=k[1];}
function startFund(n,size,cont){
  S.fund={n,size,cash:size,dist:0,fees:0,exits:[],lost:0};S.year=1;S.pos=null;S.path=[];genEconomy();S.map=genMap();S.officials=genOfficials();
  rotateHype();S.deck=shuffle(S.cards);S.discard=[];S.hand=[];
  S.lpBonus=0;S.golfUsed=false;S.prUsed=false;S.exitBoost=0;S.node=null;S.boss=null;S.auctionBan=false;S.pitchScore=0;S.pensionBribe=0;
  S.promise=S.promiseNext||0;S.promiseNext=0;S.favors=0;S.bmPenalty=0;S.tipoff=false;S.fasttrack=false;
  cont.forEach(c=>{const eq=equity(c);S.fund.cash=Math.max(0,S.fund.cash-eq);c.cost=eq;S.companies.push(c);});
  S.phase='map';log($t`${FUNDNAMES[n-1]} closed at ${fm(size)}. Seven years to put it to work. Year 7 boss: ${BOSS[n-1].n}.`,'good');
}
function enterNode(t){
  S.node={type:t};
  switch(t){
    case 'deal':S.node.offers=[0,1].map(()=>makeOffer(genCompany(wpick({Steady:50,Thriving:25,Failing:25})),'deal',rf(1.0,1.1)));
      if(S.rep>=65){const o=makeOffer(genCompany(wpick({Steady:50,Thriving:35,Failing:15})),'private',rf(0.85,0.95));S.node.offers.push(o);}break;
    case 'distressed':S.node.offers=[0,1].map(()=>makeOffer(genCompany('Failing',chance(0.5)?1:0),'distressed',rf(0.65,0.8)*(hasConn('vulture')?0.9:1)));break;
    case 'auction':{
      const c=genCompany(chance(0.6)?'Thriving':'Steady');if(!c.traits.some(t=>!TRAITS[t.k].bad))c.traits.push({k:'loyal',rev:false});
      const o=makeOffer(c,'auction',0.9);const v=value(c);
      o.rivals=RIVALS.map(r=>({name:r.name,limit:v*(rf(0.95,1.3)+r.bias+(r.loves===c.sector?0.15:0)+(S.rivalBoost?0.1:0)),in:true}));
      S.rivalBoost=false;o.allowed=S.rep>=25&&!S.auctionBan;
      if(S.rivalHandicap){o.rivals.sort((a,b)=>b.limit-a.limit);const gone=o.rivals.shift();o.note=$t`${gone.name}’s financing fell through. They’re out.`;S.rivalHandicap=false;}
      S.node.offers=[o];break;}
    case 'conference':S.node.shop={cards:draftCards(hasConn('club')?4:3),conns:draftConns(2),sold:[]};break;
    case 'exit':S.exitBoost=0.25;S.companies.forEach(c=>c.strategic=true);break;
    case 'event':runEvent();pending=startOps;break;
    case 'boss':
      if(S.fund.n===1){startPitch();return;}
      if(S.fund.n===2){blackMonday();pending=startOps;break;}
      startDuel();return;
  }
  if(S.tipoff&&S.node.offers){S.tipoff=false;S.node.offers.forEach(o=>{const t=shuffle(o.c.traits.filter(t=>!t.rev))[0];if(t){t.rev=true;revealEffect(o,t);log($t`Tip-off on ${o.c.name}: ${TRAITS[t.k].n}.`,TRAITS[t.k].bad?'bad':'good');}});}
  S.phase='node';
}
function startOps(){S.phase='ops';S.node=null;S.buy=null;S.auc=null;S.boss=null;S.bw=FOUNDERS[S.founder].bw+(hasConn('second')?1:0)-(S.audit?1:0);S.audit=0;draw(5+(hasConn('rolodex')?1:0));}
function endYear(){
  S.yearPre=yearSnap();
  S.discard.push(...S.hand);S.hand=[];sel=null;
  const f=S.fund;
  if(S.frozen)S.frozen--;
  S.cases.filter(cs=>cs.wait).forEach(cs=>{cs.wait=false;queue(caseModal(cs));});
  for(const c of S.companies.slice()){
    c.yearsOwned++;
    const load=c.ebitda>0?c.debt/c.ebitda:99;
    c.ebitda*=1+c.growth+(load<=2?0.01:0)+rf(-0.03,0.03)*(c.growth<0?1.6:1);
    if(c.growth>0.1)c.growth-=0.008;c.growth+=rf(-0.008,0.008);
    const fcf=c.ebitda*0.65-c.debt*compRate(c);
    if(fcf>=0){const pay=Math.min(c.debt,fcf);c.debt-=pay;if(fcf>pay)f.dist+=fcf-pay;}else c.debt-=fcf;
    c.assetValue*=1.02;
    if(has(c,'maintenance')&&c.yearsOwned===1){c.debt+=c.ebitda;dropTrait(c,'maintenance');log($t`Deferred Maintenance at ${c.name}: ${fm(c.ebitda)} of emergency repairs added to its debt.`,'bad');}
    if(has(c,'lawsuit')&&c.yearsOwned===2){const a=1.5*c.ebitda;c.debt+=a;dropTrait(c,'lawsuit');log($t`Pending Lawsuit at ${c.name}: ${fm(a)} settlement added to its debt.`,'bad');}
    if(has(c,'keyperson')&&chance(0.12)){c.ebitda*=0.85;dropTrait(c,'keyperson');log($t`Key-Person Risk at ${c.name}: the founder quit. Profit −15%.`,'bad');}
    if(has(c,'concentration')&&chance(0.18)){c.ebitda*=0.75;dropTrait(c,'concentration');log($t`Customer Concentration at ${c.name}: the biggest customer left. Profit −25%.`,'bad');}
    if(has(c,'patent')&&chance(0.25)){const a=0.6*c.ebitda;f.dist+=a;dropTrait(c,'patent');log($t`Unused Patent at ${c.name} licensed for ${fm(a)}.`,'good');}
    (c.hist=c.hist||[]).push(c.ebitda);if(c.hist.length>12)c.hist.shift();
    c.strategic=chance(0.3);c.fakeBid=false;
  }
  if(chance(0.25)){const owned=[...new Set(S.companies.map(c=>c.sector))];const s=owned.length&&chance(0.7)?pick(owned):pick(Object.keys(SECTORS));
    const hit=S.companies.filter(c=>c.sector===s);hit.forEach(c=>c.ebitda*=0.85);
    if(hit.length)queue(info($t`Downturn in ${$t(s)}`,$t`Demand for ${$t(s).toLocaleLowerCase(LANG)} dropped. ${hit.map(c=>esc(c.name)).join(', ')} lost 15% of profit. Companies with heavy debt feel this most.`));
    else log($t`A downturn hit ${$t(s)}. You own nothing there.`);}
  const fee=0.02*f.size,fromCash=Math.min(f.cash,fee);f.cash-=fromCash;f.dist-=fee-fromCash;f.fees+=fee;S.personal+=fee;
  if(hasConn('dog'))rep(1);
  if(hasConn('cayman'))heat(3);
  const raid=S.heat>=90;
  for(const e of S.evidence.slice()){
    e.age++;
    if(e.age>=evLife(e)){S.evidence=S.evidence.filter(x=>x!==e);log($t`The ${e.crime} trail went cold.`,'good');}
    else if(e.hold){e.hold--;}
    else if(chance(raid?0.5:evChance(e))){S.evidence=S.evidence.filter(x=>x!==e);openCase(e.crime,e.sev>=3?2:1,e.sev);}
  }
  if(!raid&&S.heat>=30){const w=S.evidence.filter(e=>!e.hold).sort((a,b)=>b.sev-a.sev)[0];if(w){S.evidence=S.evidence.filter(x=>x!==w);log($t`Reporters circling: someone dug up the ${w.crime}.`,'bad');openCase(w.crime,w.sev>=3?2:1,w.sev);}}
  if(!raid&&S.heat>=60){const fine=0.05*S.personal+0.3*sc();S.personal=Math.max(0,S.personal-fine);S.audit=1;queue(info($t('Regulatory Audit'),$t`You’re under watch. Regulators spent the year in your office. Fine: ${fm(fine)}. Next year you have one fewer action.`));}
  if(raid){S.frozen=2;S.heat=60;rep(-10);news($t`Federal agents raid ${S.firm} offices.`);queue(info($t('Raid!'),$t('Federal agents walked out of your office with boxes of files. Your fund cash is frozen for a year, every piece of evidence was examined, and your reputation took a beating (−10).')));}
  else heat(-5);
  S.officials.filter(o=>o.demand).forEach(of=>{const bc=bribeCost();queue({title:$t`${of.name} Wants Another Envelope`,body:$t`The ${$t(of.role).toLocaleLowerCase(LANG)} you paid off wants ${fm(2*bc)} more. Or they start talking.`,choices:[
    {label:$t('Pay up'),sub:$t`${fm(2*bc)} personal · Illegal · serious evidence`,cls:'illegal',disabled:()=>S.personal<2*bc,fn:()=>{S.personal-=2*bc;addEvidence('bribery',2);of.demand=chance(0.5);}},
    {label:$t('Refuse'),sub:$t('They go to the regulators'),fn:()=>{of.demand=false;openCase('bribery',2);}}]});});
  if(S.year%2===0)rotateHype();
  if(S.fund.n>=2)for(const k in S.bills)if(!S.laws[k]&&S.bills[k]>0)S.bills[k]=Math.max(0,S.bills[k]-ri(0,2));
  S.companies.filter(c=>c.ebitda<=0||c.debt/c.ebitda>lim(c)).forEach(c=>queue(breachModal(c)));
  S.exitBoost=0;
  pending=()=>{
    if(S.phase==='over')return;
    if(S.rep<=0){gameOver($t('Blacklisted'),$t('Your reputation hit zero. No investor will return your calls.'));return;}
    if(S.year>=7){S.phase='close';S.closeSel={};S.companies.forEach(c=>S.closeSel[c.id]='sell');}
    else{S.year++;S.mckUsed=false;S.mktShift*=0.5;S.rateShift*=0.5;applyEconomy();S.phase='map';}
    if(S.yearPre){queue(yearReport(S.yearPre));S.yearPre=null;}
  };
}
function finalizeClose(){
  const f=S.fund,last=f.n===3,cont=[];
  for(const c of S.companies){
    if(!last&&S.closeSel[c.id]==='cont'){f.dist+=equity(c);cont.push(c);rep(-3);heat(4);news($t`${S.firm} moves ${c.name} into a continuation fund, at its own valuation.`);}
    else{const p=equity(c)*(last?0.9:0.85);f.dist+=p;f.exits.push({name:c.name,moic:c.cost>0?p/c.cost:0,net:p});news($t`${c.name} sold in ${S.firm}’s end-of-fund fire sale.`);}
  }
  S.companies=[];
  const total=f.cash+f.dist,moic=total/f.size;
  let carry=0;if(moic>=1.3)carry=0.2*(total-f.size)*(S.laws.loophole?1.5:1)*(hasConn('cayman')?1.25:1);
  S.personal+=carry;
  S.funds.push({n:f.n,size:f.size,moic,carry,fees:f.fees});
  if(last){gameOver($t('Retired'),$t`You closed ${FUNDNAMES[2]} at a ${moic.toFixed(2)}× return and retired to a ranch in Montana.`);return;}
  const target=([1.35,1.45][f.n-1]+S.promise)*(hasConn('whisper')?0.85:1);
  const parts=[[$t('Fund return'),moic],[$t('Reputation'),(S.rep-50)/200],[$t('Heat'),-S.heat/400],[$t('Open cases'),-0.08*S.cases.length],[$t('Investor pitch'),S.pitchScore],[$t('Golf with investors'),S.lpBonus],[$t('Safe hands (no companies lost)'),f.lost===0&&f.exits.length+cont.length>0?0.05:0],[$t('Bribed pension manager'),S.pensionBribe],[$t('Black Monday panic'),-S.bmPenalty],[$t('Investors found evidence'),-0.1*S.evidence.filter(()=>chance(0.25)).length]];
  const score=parts.reduce((s,p)=>s+p[1],0);
  let outcome,size;
  if(score>=target){outcome='success';size=f.size*6*Math.pow(Math.min(2,score/target),1.5);}
  else if(score>=0.8*target){outcome='weak';size=f.size*3;}
  else{outcome='fail';size=0;}
  const repealed=[];
  if(f.n>=2)for(const k in S.laws)if(chance(0.25)){delete S.laws[k];S.bills[k]=0;repealed.push(LAWS[k].n);}
  S.raise={moic,carry,parts:parts.filter(p=>p[1]!==0||p[0]===$t('Fund return')),score,target,outcome,size,cont,repealed};S.phase='raise';
}
function gameOver(kind,text){
  S.phase='over';S.outcome={kind,text};Q=[];pending=null;
  try{const h=JSON.parse(localStorage.getItem(HALL_KEY)||'[]');h.push({firm:S.firm,founder:FOUNDERS[S.founder].n,fortune:S.personal,kind,funds:S.funds.length,date:new Date().toISOString().slice(0,10),v:VERSION});h.sort((a,b)=>b.fortune-a.fortune);localStorage.setItem(HALL_KEY,JSON.stringify(h.slice(0,20)));}catch(e){}
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
}

/* ---------- explanations ---------- */
function explain(k){
  const f=S.fund;const fc=[1,2].map(forecast).filter(Boolean);
  const target=f.n<3?(([1.35,1.45][f.n-1]+S.promise)*(hasConn('whisper')?0.85:1)).toFixed(2)+'×':$t('none (final fund)');
  const tiers=(list,cur,fmtMin)=>$t`<div class="tablewrap"><table>${list.map(t=>$t`<tr class="${t===cur?'on':''}"><td>${t.n}</td><td>${fmtMin(t)}</td><td>${t.d}</td></tr>`).join('')}</table></div>`;
  const X={
    cash:[$t('Fund cash'),$t('Money your investors gave you that you haven’t spent yet. Use it to buy companies and rescue them. Unspent cash goes back to investors at the end with no profit, so put it to work.')],

    inf:[$t('Influence'),$t`Political favors. Spend it any year in the “Call in a favor” panel: government contracts, tip-offs on deals, better bank terms, fast-tracked auctions, cooling heat. It also gets you out of trouble in events and bosses. Each favor costs 1 more for the rest of the fund (used ${S.favors} so far). It can delay a crime story for a year but never erase the evidence, and it can’t touch severe crimes. From Fund II you can also push laws through Congress. Earn it from lobbyists, donations, golf with senators, Political cards in the Investor Pitch and bribes.`],
    rate:[$t('Bank interest'),$t`The base interest rate banks charge this year: <b>${(S.rate*100).toFixed(1)}%</b>. Each company pays this plus a premium for heavy debt:<div class="tablewrap"><table><tr><th>Debt load</th><th>Extra</th></tr><tr><td>Up to 2×</td><td>−1%</td></tr><tr><td>2–3×</td><td>0</td></tr><tr><td>3–4×</td><td>+1%</td></tr><tr><td>4–5×</td><td>+2.5%</td></tr><tr><td>5–6×</td><td>+4%</td></tr><tr><td>Over 6×</td><td>+6%</td></tr></table></div>Forecast: ${fc.map((x,i)=>$t`Year ${S.year+i+1}: ${(x.r*100).toFixed(1)}%`).join(' · ')||$t('end of fund')}. Cheap money usually means a hot market.`],
    mkt:[$t('Market'),$t`How much buyers are paying compared with normal: <b>${moodOf(S.mkt).n}</b>, ${pct(S.mkt-1)} on every price. It moves in a cycle. Buy when it’s cold, sell when it’s hot. Hot markets bring more auctions and exit windows; cold markets bring more distressed sellers.<br>Forecast: ${fc.map((x,i)=>$t`Year ${S.year+i+1}: ${moodOf(x.m).n} (${pct(x.m-1)})`).join(' · ')||$t('end of fund')}. Events can change it.<br>Hot sector right now: <b>${$t(S.hot)}</b> (+25% on prices). Cold: <b>${$t(S.cold)}</b> (−20%).`],
    profit:[$t('Yearly profit'),$t('What the company earns in a year before interest and taxes (finance people call it EBITDA). Everything is priced off it: value = yearly profit × multiple. Each year 65% of it goes to paying interest and repaying debt. Once the debt is gone, that money is paid out to your investors.')],
    growth:[$t('Growth'),$t('How much yearly profit changes each year, plus small random swings. Below 0% the company is <b>Failing</b> and buyers pay 35% less for it. At 8% or more it is <b>Thriving</b> and buyers pay 20% more. Very fast growth slows down a little each year.')],
    multiple:[$t('Multiple'),$t('How many years of profit a buyer will pay. It depends on the sector, the market mood, whether the sector is hot or cold, the company’s health and its size (bigger companies earn a higher multiple). Platforms built from merged companies and cards like AI-Wash push it up.')],
    value:[$t('Value'),$t('What a buyer would pay for the whole company today: yearly profit × multiple. Selling to a PE firm gets you 97% of it. A strategic buyer pays 115% or more. Debt is repaid out of the sale price.')],

/* ---------- actions ---------- */
const A={
  pickFounder:x=>{titleFounder=x;},
  start:()=>{const el=document.getElementById('firmname');const n=(el&&el.value.trim())||'Granite Ridge Capital';startRun(n.slice(0,40),titleFounder);},
  continue:()=>{try{S=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){S=null;}},
  quit:()=>{S=null;Q=[];pending=null;},
  explain:x=>{queue(explain(x));},
  conn:x=>{const C=CONNS[x];if(C)queue(info(C.n,$t`${C.d}<p class="small muted">Connections are permanent for the rest of this run. Win auctions and bosses, or buy them at conferences, to get more.</p>`));},

  buy:x=>{const o=S.node.offers[+x];if(!canFinance(o.c,o.price))return;S.buy={oi:+x,price:o.price,auction:false};S.phase='buy';},
  bid:()=>{const a=S.auc,o=S.node.offers[a.oi];const bid=a.leader?a.price+a.step:a.price;if(!canFinance(o.c,bid))return;
    a.price=bid;a.leader='You';a.msgs.unshift($t`You bid ${fm(bid)}.`);
    const nxt=bid+a.step;o.rivals.forEach(r=>{if(r.in&&r.limit<nxt){r.in=false;a.msgs.unshift($t`${r.name} drops out.`);}});
    const live=o.rivals.filter(r=>r.in).sort((p,q)=>q.limit-p.limit);
    if(!live.length){a.msgs.unshift($t('Nobody else bids. You win.'));S.buy={oi:a.oi,price:bid,auction:true};S.auc=null;S.phase='buy';return;}

    S.auc={oi:+x,price:o.price,leader:null,step:value(o.c)*0.05,msgs:[]};if(o.note)S.auc.msgs.push(o.note);},
  pull:x=>{const o=S.node.offers[+x];if(!useFavor(2))return;o.allowed=true;log($t('A phone call got you into the auction.'));},
  walk:()=>{const a=S.auc,o=S.node.offers[a.oi];o.done=true;log($t`${a.leader&&a.leader!=='You'?a.leader:$t('A rival')} won ${o.c.name} at ${fm(a.price)}.`);S.auc=null;},
  confirmBuy:()=>{const b=S.buy,o=S.node.offers[b.oi],c=o.c;const el=document.getElementById('lev');const debt=clamp(b.debt!=null?b.debt:+(el?el.value:0),Math.max(0,b.price-S.fund.cash),maxDebt(c,b.price));
    S.fund.cash-=b.price-debt;c.debt=debt;c.cost=b.price-debt;c.owned=true;c.yearsOwned=0;o.done=true;
    const sur=[];
    c.traits.forEach(t=>{if(t.rev)return;if(t.k==='cooked'){c.ebitda*=0.75;t.rev=true;sur.push($t('<b>Cooked Books</b>: real profit is 25% lower than reported. Your debt load just jumped.'));}
      if(t.k==='founder'){t.rev=true;sur.push($t('<b>Motivated Seller</b>: the founder would have taken 12% less. Oh well.'));}});
    if(has(c,'loyal'))c.growth+=0.02;
    if(hasConn('guru')&&c.growth<0)c.growth+=0.04;
    c.hist=[c.ebitda];S.companies.push(c);S.buy=null;S.phase='node';fxStamp($t('ACQUIRED'),c.name);
    log($t`Bought ${c.name} for ${fm(b.price)} (${fm(debt)} borrowed, ${fm(c.cost)} from the fund).`,'good');news($t`${S.firm} acquires ${c.name} for ${fm(b.price)}.`);
    if(sur.length)queue(info($t('Post-Closing Surprise'),sur.join('<br>')));
    queue(cardRewardModal($t('Your associates learned something on that deal.')));
    if(b.auction)queue(connRewardModal($t('Winning that auction got you noticed. Choose one.')));},
  cancelBuy:()=>{if(S.buy.auction&&!S.buy.sure){queue(confirmModal($t('Back out of the deal?'),$t('You already won this auction. Walking away now costs 5 reputation.'),$t('Back out'),()=>{S.buy.sure=true;A.cancelBuy();}));return;}if(S.buy.auction){rep(-5);S.node.offers[S.buy.oi].done=true;log($t('You walked away from a signed deal. Reputation −5.'),'bad');}S.buy=null;S.phase='node';},
  leave:()=>{startOps();},
  retreat:x=>{if(x==='rep')rep(10);else if(x==='heat')heat(-25);else if(x==='inf')S.influence+=3;else S.lpBonus+=0.08;startOps();},
  shopCard:x=>{const sh=S.node.shop,k=sh.cards[+x],p=cardPrice(k);if(sh.sold.includes('c'+x)||!needPersonal(p))return;addCard(k);sh.sold.push('c'+x);log($t`Bought ${CARDS[k].n}.`);},
  shopConn:x=>{const sh=S.node.shop,k=sh.conns[+x],p=connPrice();if(sh.sold.includes('n'+x)||!needPersonal(p))return;S.conns.push(k);sh.sold.push('n'+x);log($t`New connection: ${CONNS[k].n}.`,'good');},
  shopRemove:()=>{const p=0.6*sc()*(hasConn('club')?0.8:1);if(S.personal<p||S.cards.length<=4)return;const uniq=[...new Set(S.cards)];
    queue({title:$t('Fire a Junior Associate'),body:$t`Remove one card from your playbook for ${fm(p)}.`,choices:uniq.map(k=>({label:CARDS[k].n,sub:CARDS[k].d,fn:()=>{S.personal-=p;removeCard(k);log($t`Removed ${CARDS[k].n} from your playbook.`);}})).concat([{label:$t('Never mind')}])});},
  donate:()=>{const p=1.5*sc()*(hasConn('club')?0.8:1);if(!needPersonal(p))return;S.influence+=3;rep(-1);S.node.shop.sold.push('don');log($t('Campaign donation made. Influence +3.'));},
  selcard:x=>{const hi=+x;if(CARDS[S.hand[hi]]&&CARDS[S.hand[hi]].instant){sel=null;playCard(hi,null);return;}sel=sel===hi?null:hi;},
  playNow:()=>{if(sel===null)return;const k=S.hand[sel];if(CARDS[k].t!=='none')return;playCard(sel,null);},
  apply:x=>{if(sel===null)return;const c=co(+x);if(c)playCard(sel,c);},
  sell:x=>{const [id,kind]=x.split(':');const c=co(+id);if(!c)return;const gross=kind==='pe'?salePE(c):kind==='strat'?saleStrat(c):saleBreak(c);
    if(gross<c.debt){log($t`Selling ${c.name} that way would not cover its debt.`,'bad');return;}
    const go=()=>{if(!co(c.id))return;c.assetKnown=true;realize(c,gross-c.debt,kind);};
    if(kind==='break')queue(confirmModal($t`Break up ${c.name}?`,$t`Sell it for parts: ${c.assetKnown?fm(gross-c.debt)+$t(' paid out'):$t('you only learn the value when you do it')}. Workers lose their jobs and your reputation drops by ${c.growth<0?2:5}.`,$t('Break it up'),go));else go();},
  keys:x=>{const c=co(+x);if(c)queue(confirmModal($t`Give ${c.name} to the bank?`,$t('You lose the company and get nothing for it. Reputation −5.'),$t('Let the bank take it'),()=>{if(co(c.id))handKeys(c);}));},
  merge:x=>{const a=co(+x);const others=S.companies.filter(c=>c!==a&&c.sector===a.sector);
    queue({title:$t`Merge Into ${a.name}`,body:$t('Fold another company in this sector into it. Bigger companies get a higher multiple, and 2+ merged companies get a platform premium.'),

  endYear:()=>{const w=endWarnings();if(w.length)queue({title:$t('End the year?'),body:$t`<ul>${w.map(x=>$t`<li>${x}</li>`).join('')}</ul>`,choices:[{label:$t('End the year'),cls:'primary',fn:()=>endYear()},{label:$t('Keep playing')}]});else endYear();},

    r.repealed.forEach(n=>log($t`Election: the ${n} was repealed.`,'bad'));startFund(S.fund.n+1,r.size,r.cont);S.raise=null;},
  modal:x=>{const m=Q.shift();const ch=m&&m.choices[+x];if(ch&&ch.fn)ch.fn();},

function playCard(hi,c){
  const k=S.hand[hi],C=CARDS[k],cost=cardCost(k);if(cost>S.bw){log($t('Not enough actions left this year.'),'bad');return;}
  if(C.p(c)===false)return;
  if(k==='cut'&&hasConn('mckinsey'))S.mckUsed=true;
  S.bw-=cost;S.hand.splice(hi,1);S.discard.push(k);sel=null;
}
function mergeCos(a,b){
  if(!co(a.id)||!co(b.id))return;
  const tot=a.ebitda+b.ebitda;a.growth=(a.growth*a.ebitda+b.growth*b.ebitda)/tot;a.ebitda=tot;a.debt+=b.debt;a.cost+=b.cost;
  a.platform+=1+b.platform;a.traits=a.traits.concat(b.traits);a.assetValue+=b.assetValue;a.assetKnown=a.assetKnown&&b.assetKnown;
  a.multBonus=Math.max(a.multBonus,b.multBonus);a.inflated=Math.max(a.inflated,b.inflated);a.rateAdj=Math.min(a.rateAdj,b.rateAdj);
  if(!/Holdings$/.test(a.name))a.name=$t`${a.name.split(' ')[0]} ${a.sector} Holdings`;
  S.companies=S.companies.filter(x=>x!==b);log($t`Merged ${b.name} into ${a.name}.`,'good');news($t`${S.firm} combines ${b.name} into ${a.name}.`);
}

function endWarnings(){
  const w=[];const playable=S.hand.filter(k=>cardCost(k)<=S.bw);
  if(S.bw>0&&playable.length)w.push($t`You still have ${S.bw} action${S.bw===1?'':'s'} and ${playable.length} playable card${playable.length===1?'':'s'}.`);
  S.companies.forEach(c=>{const r=risk(c);if(r>=0.25)w.push($t`<b>${esc(c.name)}</b> is in Danger: ${Math.round(r*100)}% chance the bank takes it.`);});

  return w;
}

function bossCardFace(k,i){

/* company sheets */
function sparkSVG(c){
  const pts=(c.hist||[]).slice();if(!pts.length||Math.abs(pts[pts.length-1]-c.ebitda)>1e-9)pts.push(c.ebitda);if(pts.length<2)return '';
  const w=300,h=36,mn=Math.min(...pts),mx=Math.max(...pts),rg=mx-mn||1;
  const xy=pts.map((v,i)=>[4+i/(pts.length-1)*(w-8),h-5-(v-mn)/rg*(h-10)]);
  const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const L=xy[xy.length-1],up=pts[pts.length-1]>=pts[0];
  return $t`<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${$t('Yearly profit history')}"><path d="${d} L${w-4} ${h} L4 ${h} Z" fill="${up?'var(--mint)':'var(--coral)'}" opacity=".45"/><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${L[0]}" cy="${L[1]}" r="4" fill="var(--grape)" stroke="var(--ink)" stroke-width="2"/></svg>`;
}
function traitsHTML(c){const r=c.traits.filter(t=>t.rev);return r.length?$t`<div class="traits">${r.map(t=>$t`<button class="trait ${TRAITS[t.k].bad?'bad':'good'}" data-a="trait" data-x="${t.k}">${TRAITS[t.k].n}</button>`).join('')}</div>`:'';}
function sheetHTML(c,o){

  const stats=[kv('profit',$t('Yearly profit'),fm(c.ebitda),'',c.owned?'p'+c.id:'',c.ebitda),kv('growth',$t('Growth'),pct(c.growth),c.growth<0?'bad':c.growth>=0.08?'good':''),kv('multiple',$t('Multiple'),mult(c).toFixed(1)+'×'),

    <div class="gbar"><i class="${rl.cls}" style="width:${clamp(lev/lim(c)*100,0,100)}%"></i><span class="gmark" style="left:${clamp(5/lim(c)*100,0,100)}%"></span></div>
    <div class="gl"><button class="lnk" data-a="explain" data-x="risk">${pill(rl.n,rl.cls)} ${Math.round(rk*100)}% chance the bank takes it</button><span class="small muted">limit ${lim(c)}×</span></div>${lev<=2&&c.debt>=0?$t('<span class="small good">Low debt: +1% growth, cheaper interest</span>'):''}</div>`:'';
  const tags=[c.platform?pill($t('Platform ')+c.platform):'',hotPill(c),c.inflated?pill($t('Inflated'),'Danger'):'',c.fakeBid?pill($t('Fake buyer'),'Danger'):'',c.strategic&&o.ops?pill($t('Strategic buyer!'),'Safe'):''].join('');

function opsActions(c){
  const pe=salePE(c),st=saleStrat(c),br=saleBreak(c),canSt=c.strategic||S.exitBoost>0,rp=c.growth<0?2:5;
  const sub=net=>$t`+${fm(net)} · return ${retAfter(net,c).toFixed(2)}×`;
  const b=[btn($t('Sell to PE firm'),'sell',$t`${c.id}:pe`,{cls:'sm2',dis:pe<c.debt,sub:pe<c.debt?$t('Debt too high'):sub(pe-c.debt)})];
  if(canSt)b.push(btn($t('Strategic sale'),'sell',$t`${c.id}:strat`,{cls:'sm2 primary',dis:st<c.debt,sub:sub(st-c.debt)}));
  b.push(btn($t('Break up'),'sell',$t`${c.id}:break`,{cls:'sm2 gray',sub:c.assetKnown?(br<c.debt?$t('Debt too high'):$t`+${fm(br-c.debt)} · rep −${rp}`):$t`Value unknown · rep −${rp}`}));
  if(S.companies.some(o=>o!==c&&o.sector===c.sector))b.push(btn($t('Merge…'),'merge',c.id,{cls:'sm2',sub:$t('With a same-sector company')}));

}

/* map */
function mapSVG(){
  const W=360,rowH=66,top=70,H=top+6*rowH+20,X=[110,210,310],Y=yr=>top+(6-yr)*rowH+rowH/2;
  const cur=S.year;let s=$t`<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="${$t('Fund map')}">`;
  for(let yr=1;yr<6;yr++)for(let a=0;a<3;a++)for(let b=0;b<3;b++)if(Math.abs(a-b)<=1){const taken=S.path[yr-1]===a&&S.path[yr]===b;
    s+=$t`<line x1="${X[a]}" y1="${Y(yr)}" x2="${X[b]}" y2="${Y(yr+1)}" class="edge ${taken?'taken':''}"/>`;}
  for(let a=0;a<3;a++)s+=$t`<line x1="${X[a]}" y1="${Y(6)}" x2="210" y2="44" class="edge ${S.path[5]===a&&cur===7?'taken':''}"/>`;
  for(let yr=1;yr<=6;yr++){
    const m=yr<=cur?S.mktPlan[yr-1]+(yr===cur?S.mktShift:0):yr-cur<=2?forecast(yr-cur).m:null;const md=m==null?null:moodOf(m);
    s+=$t`<text x="8" y="${Y(yr)-3}" class="yr">Year ${yr}</text><text x="8" y="${Y(yr)+12}" class="mood ${md?md.cls:''}">${md?md.n:'?'}</text>`;
    for(let l=0;l<3;l++){const t=S.map[yr-1][l],past=yr<cur,here=past&&S.path[yr-1]===l,can=yr===cur&&reachable(l);
      const cls=can?'can':past?(here?'done':'gone'):yr===cur?'gone':'';
      s+=$t`<g class="node ${cls}" ${can?$t`data-a="go" data-x="${l}" role="button" tabindex="0" aria-label="${NODE_LABEL[t]}"`:''}><circle cx="${X[l]}" cy="${Y(yr)}" r="21" fill="${NODE_COLOR[t]}"/>${can?$t`<circle cx="${X[l]}" cy="${Y(yr)}" r="27" class="ring"/>`:''}
        <g transform="translate(${X[l]-11} ${Y(yr)-11}) scale(.92)" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICO[t]}</g>
        <text x="${X[l]}" y="${Y(yr)+34}" class="nl">${NODE_LABEL[t]}</text></g>`;}
  }
  const bossCan=cur===7;
  s+=$t`<g class="node boss ${bossCan?'can':''}" ${bossCan?'data-a="go" data-x="boss" role="button" tabindex="0"':''}><rect x="110" y="14" width="200" height="44" rx="14" fill="var(--coral)"/>${bossCan?$t('<rect x="104" y="8" width="212" height="56" rx="18" class="ring"/>'):''}
    <g transform="translate(124 24)" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round">${ICO.boss}</g><text x="220" y="34" class="bt">BOSS · Year 7</text><text x="220" y="50" class="bn">${BOSS[S.fund.n-1].n}</text></g>`;
  return s+'</svg>';
}

    return $t`<button class="btn ${c.cls||''}" data-a="modal" data-x="${i}" ${d?'disabled':''}>${esc(c.label)}${sub?$t`<span class="sub">${esc(sub)}</span>`:''}</button>`;}).join('')}</div></div>`;
  const b=el.querySelector('button:not(:disabled)');if(b)b.focus({preventScroll:true});
}
function render(){
  for(let guard=0;guard<10&&!Q.length&&pending;guard++){const p=pending;pending=null;p();}
  riskCache={};
  if(S&&sel!==null&&(S.phase!=='ops'||sel>=S.hand.length))sel=null;
  if(!S||S.phase!=='ops')undoStack=[];
  const app=document.getElementById('app');
  if(!S){document.documentElement.classList.remove('opsmode');prevNums={};app.className='app title-mode';app.innerHTML=titleScreen();renderModal();return;}
  if(S.phase==='over'){document.documentElement.classList.remove('opsmode');app.className='app';app.innerHTML=overScreen();renderModal();runFx();return;}
  const main=tab==='office'?officeScreen():tab==='deck'?deckScreen():tab==='log'?logScreen():playScreen();
  const opsMode=S.phase==='ops'&&tab==='play'&&S.companies.length>0;
  document.documentElement.classList.toggle('opsmode',opsMode);
  if(opsMode&&!Q.length&&!HINTS_SEEN.off&&!HINTS_SEEN.ops)queue({title:$t('Tip'),body:HINTS.ops,choices:[{label:$t('Got it'),cls:'primary',fn:()=>{HINTS_SEEN.ops=1;saveHints();}},{label:$t('Turn off tips'),fn:()=>{HINTS_SEEN.off=1;saveHints();}}]});
  const tray=trayHTML();
  app.className='app'+(tray?' has-tray':'');
  app.innerHTML=hudHTML()+$t`<main class="main">${main}<footer>PE Tycoon v${VERSION}</footer></main>`+tray+tabsHTML();
  fitPad();setupCarousel();levText();renderModal();animateNums();runFx();
  if(!Q.length&&!pending)save();
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
// keep the last company scrollable above the fixed tray and tabs, whatever their real height
function fitPad(){const app=document.getElementById('app');const mn=app.querySelector('.main');if(!mn)return;if(document.documentElement.classList.contains('opsmode')){mn.style.paddingBottom='';return;}const tr=app.querySelector('.tray'),tb=app.querySelector('.tabs');mn.style.paddingBottom=((tr?tr.offsetHeight:0)+(tb?tb.offsetHeight:0)+20)+'px';}
try{window.addEventListener('resize',fitPad);}catch(e){}

/* juice */
const fmtBy=(f,v)=>f==='m'?fm(v):f==='x'?v.toFixed(2)+'×':f==='i'?String(Math.round(v)):null;
const fmtDelta=(f,d)=>f==='m'?(d>0?'+':'−')+fm(Math.abs(d)):f==='x'?(d>0?'+':'−')+Math.abs(d).toFixed(2)+'×':(d>0?'+':'−')+Math.abs(Math.round(d));
function animateNums(){
  document.querySelectorAll('[data-num]').forEach(el=>{
    const k=el.dataset.num,raw=+el.dataset.raw,f=el.dataset.fmt,prev=prevNums[k];prevNums[k]=raw;
    if(prev===undefined||!f||Math.abs(raw-prev)<Math.max(1e-6,Math.abs(prev)*1e-4))return;
    const d=raw-prev;if(f==='i'&&Math.round(d)===0)return;
    const good=(d>0)!==!!el.dataset.inv;
    const r=el.getBoundingClientRect();const fl=document.createElement('span');fl.className='float '+(good?'up':'down');fl.textContent=fmtDelta(f,d);
    fl.style.left=(r.left+r.width/2)+'px';fl.style.top=(r.top)+'px';document.getElementById('fx').appendChild(fl);setTimeout(()=>fl.remove(),1100);
    if(REDUCED)return;
    const t0=performance.now(),dur=450;const step=t=>{const p=Math.min(1,(t-t0)/dur);el.textContent=fmtBy(f,prev+d*(1-Math.pow(1-p,3)));if(p<1&&el.isConnected)requestAnimationFrame(step);};requestAnimationFrame(step);
  });
}
function runFx(){
  const layer=document.getElementById('fx');
  while(fxQ.length){const x=fxQ.shift();const st=document.createElement('div');st.className='stampfx'+(x.shake?' bad':'');st.innerHTML=$t`<b>${esc(x.text)}</b><span>${esc(x.sub||'')}</span>`;layer.appendChild(st);setTimeout(()=>st.remove(),1300);
    if(x.shake&&!REDUCED){const a=document.getElementById('app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');setTimeout(()=>a.classList.remove('shake'),500);}}
}

/* input */
const UNDOABLE=new Set(['selcard','apply','playNow','sell','keys','modal']);
function runAction(a,x){
  const f=A[a];if(!f)return;
  const track=S&&S.phase==='ops'&&UNDOABLE.has(a);let pre,ph,pe,pc;
  if(track){pre=JSON.stringify(S);ph=S.heat;pe=S.evidence.length;pc=S.cases.length;}
  f(x);
  if(track&&S&&S.phase==='ops'){const post=JSON.stringify(S);if(post!==pre){if(S.heat>ph||S.evidence.length>pe||S.cases.length>pc)undoStack=[];else if(!Q.length){undoStack.push(pre);if(undoStack.length>15)undoStack.shift();}}}
  render();
}
document.addEventListener('click',e=>{
  if(suppressClick){suppressClick=false;return;}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  runAction(b.dataset.a,b.dataset.x);
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-a]')){e.preventDefault();runAction(e.target.dataset.a,e.target.dataset.x);}});
document.addEventListener('input',e=>{if(e.target.id==='lev'&&S&&S.buy){S.buy.debt=+e.target.value;levText();}});
// drag a card upward out of the tray and drop it on a company
document.addEventListener('pointerdown',e=>{const c=e.target.closest('[data-card]');if(!c||!S||S.phase!=='ops'||Q.length)return;drag={i:+c.dataset.card,x:e.clientX,y:e.clientY,started:false,ghost:null,over:null};});
document.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.started){
    if(dy<-14&&Math.abs(dy)>Math.abs(dx)){const k=S.hand[drag.i];if(!k||CARDS[k].t!=='co'||cardCost(k)>S.bw){drag=null;return;}
      drag.started=true;sel=drag.i;render();const g=document.createElement('div');g.className='ghost';g.innerHTML=cardFace(k,{a:'noop',x:'',dis:false});document.getElementById('fx').appendChild(g);drag.ghost=g;}
    else if(Math.abs(dx)>14)drag=null;
    return;}
  e.preventDefault();drag.ghost.style.transform=$t`translate(${e.clientX-55}px,${e.clientY-80}px) rotate(-4deg)`;
  const t=document.elementFromPoint(e.clientX,e.clientY);const d=t&&t.closest('[data-drop]');
  if(drag.over&&drag.over!==d)drag.over.classList.remove('dropping');if(d)d.classList.add('dropping');drag.over=d;
},{passive:false});
document.addEventListener('pointerup',e=>{
  if(!drag)return;const d=drag;drag=null;if(!d.started)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,50);d.ghost&&d.ghost.remove();
  const t=document.elementFromPoint(e.clientX,e.clientY);const tgt=t&&t.closest('[data-drop]');
  if(tgt&&sel!==null)runAction('apply',tgt.dataset.drop);else render();
});
document.addEventListener('pointercancel',()=>{if(drag&&drag.ghost)drag.ghost.remove();drag=null;});

function start(d){
  if(d&&d.save){try{S=JSON.parse(d.save);}catch(e){S=null;}}
  if(S)logSeen=S.log.length;
  render();
}
localizeData();
window.claude?.hot?.snapshot?.(()=>({save:S&&!Q.length?JSON.stringify(S):null}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});

</script>
</body>
